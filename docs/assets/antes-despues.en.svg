<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>By hand: ten pieces, each with its manual. With aegis: one command, then a push</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6f5e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="430" rx="14" fill="#f6f7f9"/>
  <text x="30" y="40" font-size="15" fill="#5b6672" letter-spacing="1.5">BY HAND</text>
  <text x="440" y="40" font-size="15" fill="#5b6672" letter-spacing="1.5">WITH AEGIS</text>
  <g font-size="17" fill="#1f2733">
    <rect x="26" y="60" width="182" height="44" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.5"/><text x="117" y="88" text-anchor="middle">a cluster</text>
    <rect x="218" y="60" width="182" height="44" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.5"/><text x="309" y="88" text-anchor="middle">continuous deployment</text>
    <rect x="26" y="118" width="182" height="44" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.5"/><text x="117" y="146" text-anchor="middle">an image registry</text>
    <rect x="218" y="118" width="182" height="44" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.5"/><text x="309" y="146" text-anchor="middle">a CVE scanner</text>
    <rect x="26" y="176" width="182" height="44" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.5"/><text x="117" y="204" text-anchor="middle">image signing</text>
    <rect x="218" y="176" width="182" height="44" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.5"/><text x="309" y="204" text-anchor="middle">certificates and DNS</text>
    <rect x="26" y="234" width="182" height="44" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.5"/><text x="117" y="262" text-anchor="middle">a tunnel or proxy</text>
    <rect x="218" y="234" width="182" height="44" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.5"/><text x="309" y="262" text-anchor="middle">encrypted secrets</text>
    <rect x="26" y="292" width="182" height="44" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.5"/><text x="117" y="320" text-anchor="middle">metrics and alerts</text>
    <rect x="218" y="292" width="182" height="44" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.5"/><text x="309" y="320" text-anchor="middle">tested backups</text>
  </g>
  <text x="207" y="372" font-size="16" fill="#5b6672" text-anchor="middle">ten pieces, ten manuals,</text>
  <text x="207" y="396" font-size="16" fill="#5b6672" text-anchor="middle">and wiring them is where the time goes</text>
  <line x1="412" y1="60" x2="412" y2="400" stroke="#c9d1d9" stroke-width="1.5" stroke-dasharray="4 6"/>
  <g text-anchor="middle">
    <rect x="470" y="96" width="260" height="84" rx="10" fill="#2f6f5e"/>
    <text x="600" y="132" font-size="26" font-weight="600" fill="#ffffff">aegis init</text>
    <text x="600" y="162" font-size="16" fill="#d7eae3">once, on your machine</text>
    <line x1="600" y1="184" x2="600" y2="238" stroke="#2f6f5e" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="470" y="246" width="260" height="84" rx="10" fill="#e6f2ee" stroke="#2f6f5e" stroke-width="1.5"/>
    <text x="600" y="282" font-size="26" font-weight="600" fill="#1f2733">git push</text>
    <text x="600" y="312" font-size="16" fill="#2f4f44">every change, from then on</text>
  </g>
  <text x="600" y="372" font-size="16" fill="#5b6672" text-anchor="middle">the same ten pieces, already chosen</text>
  <text x="600" y="396" font-size="16" fill="#5b6672" text-anchor="middle">and already wired together</text>
</svg>
