<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 466" width="1200" height="466" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
  <title>Real outputs: aegis init --list and aegis verify --profile both</title>
  <rect x="0" y="0" width="1200" height="466" rx="14" fill="#1e2127"/>
  <g fill="#5b6672" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
    <circle cx="26" cy="24" r="6" fill="#e0443e"/><circle cx="46" cy="24" r="6" fill="#dea123"/><circle cx="66" cy="24" r="6" fill="#1aab29"/>
    <text x="600" y="29" text-anchor="middle" fill="#8b949e">real outputs of the product · two commands</text>
  </g>
  <g fill="#c9d1d9">
    <text x="40" y="76"><tspan fill="#7ee787">$</tspan> aegis init --list</text>
    <text x="40" y="104">[<tspan fill="#7ee787">✔</tspan>] 00-preflight</text><text x="40" y="126">[<tspan fill="#7ee787">✔</tspan>] 05-host</text><text x="40" y="148">[<tspan fill="#7ee787">✔</tspan>] 10-age-ceremony</text><text x="40" y="170">[<tspan fill="#7ee787">✔</tspan>] 12-workrepos</text><text x="40" y="192">[<tspan fill="#7ee787">✔</tspan>] 15-third-parties</text><text x="40" y="214">[<tspan fill="#7ee787">✔</tspan>] 20-k3s</text><text x="40" y="236">[<tspan fill="#7ee787">✔</tspan>] 25-edge-tofu</text><text x="40" y="258">[<tspan fill="#7ee787">✔</tspan>] 30-argocd</text><text x="40" y="280">[<tspan fill="#7ee787">✔</tspan>] 35-gitops</text><text x="40" y="302">[<tspan fill="#7ee787">✔</tspan>] 40-registry-pki</text><text x="40" y="324">[<tspan fill="#7ee787">✔</tspan>] 50-jenkins</text><text x="40" y="346">[<tspan fill="#7ee787">✔</tspan>] 60-webhook</text><text x="40" y="368">[<tspan fill="#7ee787">✔</tspan>] 70-deploy-auto</text><text x="40" y="390">[<tspan fill="#7ee787">✔</tspan>] 80-supply-chain</text><text x="40" y="412">[<tspan fill="#7ee787">✔</tspan>] 85-observability</text><text x="40" y="434">[<tspan fill="#7ee787">✔</tspan>] 87-ai</text>
  </g>
  <line x1="420" y1="60" x2="420" y2="420" stroke="#30363d"/>
  <g fill="#c9d1d9">
    <text x="460" y="76"><tspan fill="#7ee787">$</tspan> aegis verify --profile both</text>
    <text x="460" y="112" fill="#8b949e">…</text>
    <text x="460" y="140"><tspan fill="#7ee787">PASS</tspan> every check has an executable tooth or is on the</text>
    <text x="460" y="162">     debt list, and the list does not lie</text>
    <text x="460" y="204" fill="#7ee787" font-weight="600">══ STATIC VERIFICATION: ALL PASS ══</text>
    <text x="460" y="232" fill="#7ee787">   profile cloudflare  237 checks, 0 not evaluated</text>
    <text x="460" y="254" fill="#7ee787">   profile local       237 checks, 0 not evaluated</text>
    <text x="460" y="300"><tspan fill="#7ee787">$</tspan> aegis --help | head -1</text>
    <text x="460" y="328"><tspan font-weight="600">aegis</tspan> — self-hosted GitOps platform · v3.0.0-alpha.1</text>
    <text x="460" y="380" fill="#8b949e" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">Without a cluster: the verifier measures the artifact. With one:</text>
    <text x="460" y="402" fill="#8b949e" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">aegis check measures the live instance against what is declared.</text>
  </g>
</svg>
