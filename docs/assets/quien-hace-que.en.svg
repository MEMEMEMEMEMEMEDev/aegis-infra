<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>The team pushes; the platform builds, scans, signs and publishes; you watch the console and get the alerts</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b4652"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="330" rx="14" fill="#f6f7f9"/>
  <text x="30" y="40" font-size="15" fill="#5b6672" letter-spacing="1.5">WHO DOES WHAT</text>
  <g text-anchor="middle" fill="#1f2733">
    <rect x="30" y="70" width="220" height="200" rx="10" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.5"/>
    <text x="140" y="108" font-size="22" font-weight="600">The team</text>
    <text x="140" y="146" font-size="17" fill="#5b6672">writes code</text>
    <text x="140" y="172" font-size="17" fill="#5b6672">and runs git push</text>
    <text x="140" y="214" font-size="15" fill="#5b6672">no need to know</text>
    <text x="140" y="236" font-size="15" fill="#5b6672">what Kubernetes is</text>

    <rect x="290" y="70" width="220" height="200" rx="10" fill="#e6f2ee" stroke="#2f6f5e" stroke-width="1.5"/>
    <text x="400" y="108" font-size="22" font-weight="600">The platform</text>
    <text x="400" y="146" font-size="17" fill="#2f4f44">builds and scans</text>
    <text x="400" y="172" font-size="17" fill="#2f4f44">signs and publishes</text>
    <text x="400" y="198" font-size="17" fill="#2f4f44">watches and backs up</text>
    <text x="400" y="236" font-size="14" fill="#2f4f44">refuses what did not go through it</text>

    <rect x="550" y="70" width="220" height="200" rx="10" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.5"/>
    <text x="660" y="108" font-size="22" font-weight="600">You</text>
    <text x="660" y="146" font-size="17" fill="#5b6672">install and onboard</text>
    <text x="660" y="172" font-size="17" fill="#5b6672">look at the console</text>
    <text x="660" y="198" font-size="17" fill="#5b6672">get the alerts</text>
    <text x="660" y="236" font-size="14" fill="#5b6672">knowing what a cluster is helps</text>
  </g>
  <line x1="252" y1="170" x2="286" y2="170" stroke="#3b4652" stroke-width="2" marker-end="url(#a)"/>
  <line x1="512" y1="170" x2="546" y2="170" stroke="#3b4652" stroke-width="2" marker-end="url(#a)"/>
  <text x="400" y="306" font-size="15" fill="#5b6672" text-anchor="middle">in a small team, the two roles are usually the same person</text>
</svg>
