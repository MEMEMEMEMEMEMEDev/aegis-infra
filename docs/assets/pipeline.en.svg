<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>What happens to a git push in aegis</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b4652"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="300" rx="14" fill="#f6f7f9"/>
  <text x="40" y="44" font-size="15" fill="#5b6672" letter-spacing="1.5">WHAT HAPPENS TO A GIT PUSH</text>
  <g font-size="16" fill="#1f2733" text-anchor="middle">
    <rect x="30" y="80" width="165" height="72" rx="10" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.5"/><text x="112" y="110" font-weight="600">git push</text><text x="112" y="134" font-size="12" fill="#5b6672">your repository</text><rect x="220" y="80" width="165" height="72" rx="10" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.5"/><text x="302" y="110" font-weight="600">build</text><text x="302" y="134" font-size="12" fill="#5b6672">kaniko · unprivileged</text><rect x="410" y="80" width="165" height="72" rx="10" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.5"/><text x="492" y="110" font-weight="600">scan</text><text x="492" y="134" font-size="12" fill="#5b6672">Trivy · fixable CVE = red</text><rect x="600" y="80" width="165" height="72" rx="10" fill="#e6f2ee" stroke="#2f6f5e" stroke-width="2"/><text x="682" y="110" font-weight="600" fill="#1f4d41">sign</text><text x="682" y="134" font-size="12" fill="#2f6f5e">cosign · by digest</text><rect x="790" y="80" width="165" height="72" rx="10" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.5"/><text x="872" y="110" font-weight="600">deploy</text><text x="872" y="134" font-size="12" fill="#5b6672">ArgoCD · GitOps</text><rect x="980" y="80" width="165" height="72" rx="10" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.5"/><text x="1062" y="110" font-weight="600">expose</text><text x="1062" y="134" font-size="12" fill="#5b6672">TLS · public hostname</text>
  </g>
  <g stroke="#3b4652" stroke-width="2" marker-end="url(#arrow)"><line x1="195" y1="116" x2="218" y2="116"/><line x1="385" y1="116" x2="408" y2="116"/><line x1="575" y1="116" x2="598" y2="116"/><line x1="765" y1="116" x2="788" y2="116"/><line x1="955" y1="116" x2="978" y2="116"/></g>
  <g font-size="14" text-anchor="middle">
    <line x1="872" y1="152" x2="872" y2="200" stroke="#3b4652" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="690" y="200" width="365" height="60" rx="10" fill="#fff" stroke="#b3432b" stroke-width="2"/>
    <text x="872" y="224" fill="#b3432b" font-weight="600">Kyverno, at admission</text>
    <text x="872" y="246" fill="#1f2733">valid signature → in · unsigned → refused</text>
  </g>
  <g font-size="13" fill="#5b6672">
    <text x="40" y="224">Every step leaves a measured gate: the installer records it,</text>
    <text x="40" y="246"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">aegis check</tspan> measures it again against the live cluster.</text>
  </g>
</svg>
