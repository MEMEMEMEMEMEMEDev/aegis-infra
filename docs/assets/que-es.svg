<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Una máquina Linux y una cuenta de GitHub entran; sale tu propia plataforma de despliegue</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b4652"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="300" rx="14" fill="#f6f7f9"/>
  <text x="30" y="40" font-size="15" fill="#5b6672" letter-spacing="1.5">QUÉ ES</text>
  <g fill="#1f2733" text-anchor="middle">
    <rect x="30" y="70" width="230" height="78" rx="10" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.5"/>
    <text x="145" y="104" font-size="22" font-weight="600">Tu máquina Linux</text>
    <text x="145" y="132" font-size="16" fill="#5b6672">un VPS, un PC, un server viejo</text>
    <rect x="30" y="168" width="230" height="78" rx="10" fill="#ffffff" stroke="#c9d1d9" stroke-width="1.5"/>
    <text x="145" y="202" font-size="22" font-weight="600">Tu cuenta de GitHub</text>
    <text x="145" y="230" font-size="16" fill="#5b6672">tu código, tus repositorios</text>
  </g>
  <path d="M 262 109 C 330 109, 330 158, 400 158" fill="none" stroke="#3b4652" stroke-width="2"/>
  <path d="M 262 207 C 330 207, 330 158, 400 158" fill="none" stroke="#3b4652" stroke-width="2" marker-end="url(#a)"/>
  <rect x="302" y="140" width="104" height="36" rx="18" fill="#2f6f5e"/>
  <text x="354" y="164" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">aegis init</text>
  <g fill="#1f2733" text-anchor="middle">
    <rect x="430" y="70" width="340" height="176" rx="10" fill="#e6f2ee" stroke="#2f6f5e" stroke-width="1.5"/>
    <text x="600" y="110" font-size="21" font-weight="600">Tu plataforma de despliegue</text>
    <text x="600" y="146" font-size="17" fill="#2f4f44">cada push: construir, escanear,</text>
    <text x="600" y="170" font-size="17" fill="#2f4f44">firmar, publicar con TLS</text>
    <text x="600" y="204" font-size="17" fill="#2f4f44">y después: métricas, alertas, respaldos</text>
    <text x="600" y="228" font-size="17" fill="#2f4f44">y una ronda diaria que dice qué vio</text>
  </g>
  <text x="400" y="280" font-size="15" fill="#5b6672" text-anchor="middle">el servidor, los datos y las llaves son tuyos</text>
</svg>
