# routes.yaml — WHAT an organization asks for vs WHAT it is served with.
#
# Platform plane. No organization edits this file or even mentions it:
# contracts name a CAPABILITY (`chat.rapido`), which is a promise about
# behaviour, and here we state what fulfils that promise today.
#
# WHY THE SEPARATION EXISTS. The day there are credits from a third
# party, adding Vertex means changing the `proveedor` of one row. Zero
# contracts migrated. If the contract said `qwen3-4b`, every single
# organization would have to be edited, and each edit would be one more
# chance to get it wrong.
#
# ── what may be declared here ─────────────────────────────────────
#
# ONLY capabilities the gateway knows how to serve. Declaring
# `embeddings` before the CPU lane exists gains nothing: it leaves a
# promise that blows up only when somebody invokes it, and the first to
# find out is a visitor. The gateway rejects an unimplemented provider
# AT STARTUP, on purpose.
#
# ── the file the gateway reads does NOT come from here ────────────
#
# `aegis org` combines this with plans.yaml and with the `ai.plan`
# of each contract, and writes k8s/base/ai-system/routes.yaml. That file
# is GENERATED and carries its hash: it is not edited by hand.

version: 1

capacidades:
  # Conversation: NPCs, guides, site chat. Short context on purpose —
  # it is what keeps latency low with a single GPU behind it.
  chat.rapido:
    proveedor: local
    engine: llm
    modelo: qwen3-4b
    contexto_max: 12288

  # Same machine, same window: today `chat.largo` promises no more
  # context than `chat.rapido`, it promises that MORE LATENCY IS
  # TOLERATED. Two capabilities and not one because the day long
  # context is served by another provider, the tasks that already asked
  # for it are not touched.
  chat.largo:
    proveedor: local
    engine: llm
    modelo: qwen3-4b
    contexto_max: 12288

  # Translation, served by the SPECIALIST and not by the conversation
  # lane. Two capabilities and not one because a 1.8B translator does
  # one thing well and narrates badly, and the day a bigger model
  # serves both, the contracts that asked for `traduccion` are not
  # touched.
  traduccion:
    proveedor: local
    engine: mt
    modelo: hy-mt2-1.8b
    contexto_max: 4096

  # ── the CPU lane ────────────────────────────────────────────────
  # Declared on 2026-09-01 under the rule this file states above: only
  # capabilities the gateway knows how to serve. Until today they were
  # listed as pending, and that was correct while nothing served them
  # — but the seed had come to ship engine-cpu.yaml and engine-mt.yaml,
  # so the artifact was DEPLOYING engines whose capabilities nothing
  # routed to. The first real run found it the moment a contract asked
  # for `traduccion` and the validator answered that only chat.rapido
  # and chat.largo exist.
  #
  # `contexto_max` here is the input ceiling in TOKENS for embeddings
  # (the model truncates at 512); for the audio pair it bounds the
  # request's TEXT, because the audio itself is bounded by the
  # gateway's hard byte cap. Same field, different unit.
  embeddings:
    proveedor: local
    engine: cpu
    modelo: multilingual-e5-small
    contexto_max: 512

  voz:
    proveedor: local
    engine: cpu
    modelo: kokoro-82m
    contexto_max: 512

  oido:
    proveedor: local
    engine: cpu
    modelo: whisper-small
    contexto_max: 512
