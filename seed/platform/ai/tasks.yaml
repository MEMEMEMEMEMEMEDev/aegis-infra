# tasks.yaml — THE NUMBERS FOR EVERY AI TASK, from the platform side.
#
# Same criterion as plans.yaml and services.yaml: an organization's
# contract names the task and its CAPABILITY, never how many tokens it
# may spend. The caps are set by the platform, which is why they can be
# readjusted for all of them at once without touching thirty contracts.
#
# WHAT COMES FROM THE CONTRACT AND WHAT COMES FROM HERE, which is the
# division that matters:
#
#   from the contract   name, capability, prompt, and —the thing that
#                       really mattered to derive— the authorized TENANT
#   from here           class and the numeric caps
#
# The tenant was the dangerous coupling. Until #60 somebody had to
# remember to write it into the registry by hand, and when it was
# missing the gateway answered 403 `tarea_prohibida` while the
# organization had key, network and plan in order: nothing on the
# contract side turned red. Now the generator derives it from the
# `ai.tareas` of the contract, so the two cannot disagree.
#
# The numbers are NOT derived, and that is deliberate: they are per-task
# fine tuning —how much output it tolerates, how much input it accepts,
# how deterministic it wants to be— and the contract has no honest way
# to express that without turning into a configuration file.
version: 1

# The values per CLASS. A task that says nothing inherits these.
clases:
  # Conversational: somebody types and waits for a short answer.
  interactive:
    max_output_tokens: 220
    max_context_tokens: 1500
    max_input_chars: 800
    temperature: 0.6
    peso: 1

# And the departures, one per task, with the reason beside each. If this
# section grows a lot it is a sign that a class is missing, not that more
# exceptions should be added.
# EMPTY IN THE SEED, and that is not an oversight. An AI task exists
# because some organization declared it in its contract (`ai.tareas`),
# and a freshly started instance has no contracts yet. The entries here
# are the FINE tuning of tasks that already exist: inheriting them from
# another instance would mean importing the stop-tokens of an NPC that
# nobody ever wrote.
#
# The `interactive` class above DOES travel: it is the default that
# makes a new task work without writing a single number.
#
# When an organization declares its first task, it shows up here with
# its class, and numbers are added only if it departs from the default.
# Example from a real instance:
#
#   tareas:
#     blog.chat.bibliotecaria:
#       clase: interactive
#       max_context_tokens: 2200   # the browser sends the article read
#       temperature: 0.5           # recommends articles that DO EXIST
#       stop: ["\nLector:", "\nBibliotecaria:"]
tareas: {}
