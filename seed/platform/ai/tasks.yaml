# tareas.yaml — LOS NÚMEROS DE CADA TAREA DE AI, del lado de la
# plataforma.
#
# Mismo criterio que plans.yaml y services.yaml: el contrato de una
# organización nombra la tarea y su CAPACIDAD, nunca cuántos tokens puede
# gastar. Los topes los pone la plataforma, y por eso se pueden reajustar
# para todas a la vez sin tocar treinta contratos.
#
# QUÉ SALE DEL CONTRATO Y QUÉ SALE DE ACÁ, que es la división que importa:
#
#   del contrato   nombre, capacidad, prompt, y —lo que de verdad
#                  importaba derivar— el TENANT autorizado
#   de acá         clase y los topes numéricos
#
# El tenant era el acoplamiento peligroso. Hasta #60 había que acordarse
# de escribirlo a mano en el registro, y si faltaba el gateway respondía
# 403 `tarea_prohibida` con la organización teniendo clave, red y plan en
# orden: nada del lado del contrato se ponía rojo. Ahora lo deriva el
# generador de `ai.tareas` del contrato, así que no puede discrepar.
#
# Los números NO se derivan y es deliberado: son ajuste fino por tarea
# —cuánta salida tolera, cuánta entrada acepta, qué tan determinista
# quiere ser— y el contrato no tiene forma honesta de expresarlos sin
# volverse un archivo de configuración.
version: 1

# Los valores por CLASE. Una tarea que no dice nada hereda éstos.
clases:
  # Conversacional: alguien escribe y espera una respuesta corta.
  interactive:
    max_output_tokens: 220
    max_context_tokens: 1500
    max_input_chars: 800
    temperature: 0.6
    peso: 1

# Y los apartamientos, uno por tarea, con el motivo al lado. Si esta
# sección crece mucho es señal de que falta una clase, no de que haya que
# seguir agregando excepciones.
# VACÍO EN LA SEED, y no es un olvido. Una tarea de AI existe porque
# alguna organización la declaró en su contrato (`ai.tareas`), y una
# instancia recién arrancada no tiene contratos todavía. Las entradas de
# acá son el ajuste FINO de tareas que ya existen: heredarlas de otra
# instancia sería traer los stop-tokens de un NPC que nadie escribió.
#
# La clase `interactive` de arriba SÍ viaja: es el default que hace que
# una tarea nueva funcione sin escribir un solo número.
#
# Cuando una organización declare su primera tarea, aparece acá con su
# clase, y solo se le agregan números si se aparta del default. Ejemplo
# de una instancia real:
#
#   tareas:
#     blog.chat.bibliotecaria:
#       clase: interactive
#       max_context_tokens: 2200   # el navegador manda qué artículo lee
#       temperature: 0.5           # recomienda artículos que EXISTEN
#       stop: ["\nLector:", "\nBibliotecaria:"]
tareas: {}
