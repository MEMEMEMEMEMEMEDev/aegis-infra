# Scan exceptions for MIRRORED third-party images.
# Passed to trivy with --ignorefile from mirror-images/Jenkinsfile.
# Jenkinsfile.app does NOT use it: our own code has no exceptions.
#
# ============================================================
# gosu in the official postgres images — 15 CVEs of the Go
# stdlib that ARE NOT IN THE BINARY
# ============================================================
#
# WHAT gosu IS
# A 1.7 MB Go binary that the official postgres image ships in order to
# drop privileges from root to the postgres user at startup: it reads
# argv, does setuid/setgid, exec, and dies. It is not an apk package (it
# does not appear in /lib/apk/db/installed) — the postgres Dockerfile
# downloads it from GitHub releases and copies it in. No apk upgrade
# ever reaches it.
#
# WHY TRIVY REPORTS 15 CVEs
# For Go binaries, trivy matches against the embedded COMPILER VERSION
# (here go1.24.6), not against the packages actually linked in. If that
# Go version has stdlib CVEs, it lists them all — even when the linker
# stripped that code out because nothing used it.
#
# THE MEASUREMENT (2026-07-26, on postgres:17.10-alpine)
# The binary was extracted and searched for real function symbols:
#
#   crypto/tls.*   -> 0     syscall.Setuid -> 2
#   crypto/x509.*  -> 0     syscall.Setgid -> 2
#   net/http.*     -> 0     syscall.Exec   -> 2
#   net/mail.*     -> 0     os/exec.*      -> 11
#   net/url.*      -> 0
#   mime.*         -> 0
#   os.OpenRoot    -> 0
#   net.Dial       -> 0
#
# Zero functions from EVERY accused package. It is not that they are
# unreachable: they are not compiled in. The only thing a first
# substring pass turned up were fragments of the runtime string blob
# ("...crypto/rsacrypto/tlswinsymlinkx509..."), short packed strings
# glued together — not symbols. A package that is really linked in shows
# up as os/exec.LookPath, os/exec.Error, and so on.
#
# WHY THIS IS NOT FIXED BY "UPGRADING"
# The Fixed Version column (1.24.13, 1.25.7, ...) lists COMPILER
# versions. The fix is to rebuild gosu, which is the job of whoever
# builds the image. Building a derived image of our own just for this
# would not improve security at all —the vulnerable code is not present
# either way— and would add the upkeep of a home-grown database image.
# Once upstream rebuilds with a newer Go, these entries go inert on
# their own.
#
# WHY ONE BY ONE AND NOT A WILDCARD
# That is what keeps the exception from growing by itself. If a 16th CVE
# shows up in gosu, the build BREAKS and somebody has to redo the
# measurement. A path wildcard would silence forever everything that
# lands there, including something that does matter.
#
# EXPIRY: 2027-01-31. The analysis holds for THIS binary compiled THIS
# way. If some day gosu is rebuilt linking in the network stack, it
# stops holding. On expiry, trivy reports again and the measurement has
# to be redone.
#
# Alternatives evaluated and discarded on 2026-07-26:
#   postgres:18.2-alpine  -> same gosu + 20 CVEs from the base
#   postgres:18.2 debian  -> same gosu + 32 CVEs from the base
#   cloudnative-pg:17.10  -> no gosu, but 4 CVEs in urllib3, which DOES
#                            execute if barman-cloud is used. Fewer
#                            findings, more residual risk.

vulnerabilities:
