# aegis-base-nginx — nginx.conf. The shape is nginx-unprivileged's,
# because that is the contract the consumers were written against.
#
# NO `user` directive: the master runs as UID 101 already (USER in the
# Containerfile) and a non-root process cannot switch user; nginx would
# only log a warning on every start.
#
# pid and every temp path live under /tmp: tenant pods run with a
# read-only root filesystem, and /tmp is the one directory UID 101 can
# write at runtime (an emptyDir in the pod spec). The package's compiled
# defaults point at /var/lib/nginx/tmp and /run/nginx, which are
# read-only there — nginx would start and die on the first POST body
# or the first upstream response that does not fit in memory.

worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # The version stays out of the Server header and the error pages:
    # it says nothing to a visitor and something to a scanner.
    server_tokens off;

    # INSIDE http{} — this is the line the base exists for. Alpine's
    # stock nginx.conf includes conf.d at the root context, where a
    # consumer's `server{}` is "not allowed here" and nginx refuses to
    # start. The Containerfile's `nginx -t` proves this include works
    # with a server{} in conf.d on every build.
    include /etc/nginx/conf.d/*.conf;
}
