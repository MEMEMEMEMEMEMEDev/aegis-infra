# aegis-base-nginx — the SAMPLE server. A consumer REPLACES this file
# (COPY its own to /etc/nginx/conf.d/default.conf) and its `server{}`
# MUST keep `listen 8080`: a tenant's NetworkPolicy admits only
# edge → 8080, so a server on any other port starts fine and never
# receives a request. No `listen 80` either — binding a port below
# 1024 as UID 101 fails at startup.
#
# In the base itself this file has one more job: it is the server{}
# that `nginx -t` validates at build time, proving nginx.conf includes
# conf.d in the http context.
server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
