# aegis-base-php — the server{} every PHP consumer gets for free.
#
# Unlike aegis-base-nginx's default.conf, this one is NOT a sample: a
# PHP application's nginx configuration is the same for every Laravel
# app ever written, so the base ships the real thing and a consumer
# normally replaces nothing. If one does need to (a different document
# root, an extra location), it COPYs its own over this path and MUST
# keep `listen 8080`: a tenant's NetworkPolicy admits only edge → 8080,
# so a server on any other port starts fine and never receives a
# request. No `listen 80` either — binding below 1024 as UID 65532
# fails at startup.
server {
    listen       8080;
    server_name  _;

    root   /app/public;
    index  index.php;

    # The front controller. Everything that is not a real file on disk
    # becomes /index.php, which is how every route in routes/web.php and
    # routes/api.php gets reached.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # A dotfile is never served. .env is the one that matters and it is
    # the classic way an application hands out its database password.
    location ~ /\. {
        deny all;
    }

    location ~ \.php$ {
        # 127.0.0.1 and not a unix socket: both processes live in this
        # container, the loopback never leaves it, and a socket would
        # need a writable directory on a read-only root filesystem.
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        include        fastcgi_params;
        # SCRIPT_FILENAME is NOT in fastcgi_params and php-fpm cannot
        # run a script without it: the symptom is a blank 404 from PHP
        # with nginx reporting 200, which reads like an application bug
        # and is not one.
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO        $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
    }
}
