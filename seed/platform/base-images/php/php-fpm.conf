; aegis-base-php — the whole php-fpm configuration, global and pool, in
; one file. Alpine's package splits it into php-fpm.conf plus an
; include of php-fpm.d/*.conf; one file is used here because the split
; buys nothing when there is exactly one pool and it costs a second
; place to look when something is wrong.
;
; WHAT IS DELIBERATELY ABSENT: `user` and `group` in the pool. FPM can
; only setuid when it starts as root, and this image never does. With
; them present FPM prints a warning on every single start — a line that
; teaches whoever reads the logs to ignore warnings, which is the real
; damage.

[global]
; The container IS the daemon. Kubernetes restarts it; nothing here
; should fork away from PID 1's supervision (see entrypoint.sh).
daemonize = no
; To the pod log, where Vector reads it. A file in the container is
; read by nobody.
error_log = /proc/self/fd/2
log_limit = 8192

[www]
; loopback only: nginx lives in this same container and nothing outside
; it may ever speak FastCGI to this process.
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
; A worker that has served this many requests is recycled. It is the
; cheap insurance against a leak in any extension: the process dies
; before it grows into the pod's memory limit and takes the container
; with it.
pm.max_requests = 500

; PHP's own log, to the same place as FPM's.
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
; Errors are logged, never rendered. A stack trace in a response body
; names paths, queries and sometimes credentials.
php_admin_flag[display_errors] = off

; The read-only root filesystem, made explicit. Everything PHP writes
; goes to /tmp, which is the emptyDir the pod spec mounts. If a library
; ever tries to write elsewhere it fails HERE with a clear message
; instead of somewhere deep in a request.
php_admin_value[sys_temp_dir] = /tmp
php_admin_value[upload_tmp_dir] = /tmp
php_admin_value[session.save_path] = /tmp

; Workers inherit the container's environment; without this they get an
; empty $_ENV and every getenv() in config/*.php returns false — which
; looks exactly like "the Secret was not mounted" and is not.
clear_env = no
