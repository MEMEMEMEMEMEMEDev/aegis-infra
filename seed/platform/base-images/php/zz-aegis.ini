; aegis-base-php — the settings that differ from the distribution's
; defaults because this PHP runs in an immutable image behind an edge,
; not on a shared host.

; The version stays out of the headers and the error pages. nginx also
; hides X-Powered-By, but a header that is never sent cannot leak
; through a misconfiguration later.
expose_php = Off

; OPCACHE, and the second line is the one worth reading. The code in a
; container image NEVER changes: there is no deploy that edits a file in
; place, only a new image with a new digest. With validate_timestamps=0
; PHP stops stat()-ing every included file on every request, which on a
; framework with a few hundred files is most of the syscalls a request
; makes. The cost of being wrong is that an edit would not be picked up
; — impossible here, and the read-only root filesystem makes it doubly
; impossible.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; Errors are logged, never rendered (the pool config says the same; this
; covers the CLI, where artisan runs during the build).
display_errors = Off
log_errors = On
error_reporting = E_ALL

; The application is not a batch job: a request that has not finished in
; 30 s is a bug, and holding the worker longer only means the pod runs
; out of workers instead of returning an error somebody can see.
max_execution_time = 30
memory_limit = 256M

; The product image travels in the request body. These two agree with
; nginx's client_max_body_size on purpose: three ceilings that disagree
; produce three different error messages for one situation.
upload_max_filesize = 8M
post_max_size = 8M
