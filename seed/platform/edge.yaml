# edge.yaml — what the edge has to expose.
#
# tofu's list of public hostnames is DERIVED from here plus the
# `dominio:` of every contract in orgs/. Nobody edits
# `public_hostnames` in main.tf by hand ever again.
#
# WHY. The hostname used to be declared twice: in the organization's
# contract and by hand in the .tf. That duplication has already cost
# twice:
#
#  - ai.__ROOT_DOMAIN__ stayed in main.tf and was never applied (task
#    #35). The IngressRoute existed in the cluster, waiting for traffic
#    that never arrived.
#  - blog.__ROOT_DOMAIN__ had to be remembered and added by hand on
#    2026-08-03.
#
# And the failure mode is the worst one there is: if it is missing, the
# hostname simply DOES NOT EXIST. No error, no alarm, nothing red. The
# cluster's manifest is perfect and nobody arrives.
#
# With the derivation, declaring `dominio:` in the contract is ALL there
# is to do.

# The root domain. The contracts declare the full FQDN
# (`blog.__ROOT_DOMAIN__`) because that is what a human recognises; tofu
# wants only the label (`blog`), and the generator does the subtraction.
root_domain: __ROOT_DOMAIN__

# The PLATFORM's own doors, which come out of no contract because they
# belong to no organization. They are the substrate's own.
#
# `ai` IS NO LONGER HERE — withdrawn in #25 on 2026-08-07, and the
# reason is worth more than the missing line.
#
# The original reasoning was good: give the AI its own hostname so that
# its kill switch and its rate limits would be independent of any site.
# What that reasoning took for granted was that the AI is consumed FROM
# THE INTERNET, and measured, it is not:
#
#   - no front end of blog, portfolio or example names the hostname
#   - the BFFs talk to the INTERNAL door over cluster DNS
#   - the public door does not serve inference (two different muxes, and
#     there is a gateway test that fails if anyone puts it there)
#
# So the only thing that hostname offered the internet was
# `GET /status` with no credential: mode, engine, queue and version. It
# told anyone when the GPU is switched on — exactly when there is
# something worth attacking — and which build is running. Free
# reconnaissance in exchange for nothing.
#
# The kill switch is not lost: it is still `ai stop`, which takes the
# engine down to zero replicas. That was always stronger than any WAF.
#
# WHEN IT COMES BACK: when the ticket flow exists (§7.2 of the design),
# which is the only case that needs a browser talking directly to the
# AI. That endpoint is already written, switched off behind a flag and
# returning 501. The day it is switched on, this hostname comes back
# TOGETHER with Turnstile in front of it — not afterwards.
platform:
  - aegis
  - argocd
  - jenkins
  # grafana and ntfy (phase 85 §5): observability is substrate, not an
  # organization. grafana goes BEHIND Access (the cloudflare-access
  # module, grafana.tf); ntfy goes out WITHOUT Access — the phone app
  # cannot authenticate against Cloudflare — and defends itself with its
  # own deny-all plus the edge's three middlewares (check 91).
  - grafana
  - ntfy
