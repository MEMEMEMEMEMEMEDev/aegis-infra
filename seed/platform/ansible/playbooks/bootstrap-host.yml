# bootstrap-host v2 — kernel + packages for K3s. Inherits the
# hardened patterns from Milestone 2 (A13): validations guarded by
# `when: not ansible_check_mode`, absolute paths, no yaml callback.
---
- name: Prepare host for K3s
  hosts: k3s_nodes
  become: true

  tasks:
    - name: Assert supported distro
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] is version('24.04', '>=')

    - name: Assert systemd is PID 1
      ansible.builtin.assert:
        that: ansible_facts['service_mgr'] == 'systemd'

    - name: Base packages
      ansible.builtin.apt:
        name: [curl, ca-certificates, iptables, jq, conntrack]
        state: present
        update_cache: true

    - name: Kernel modules (runtime + persisted)
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop: [br_netfilter, overlay]

    - name: Persist the modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/aegis-k3s.conf
        content: |
          br_netfilter
          overlay
        mode: "0644"

    - name: Sysctl for K3s (persisted)
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: "1"
        sysctl_file: /etc/sysctl.d/99-aegis-k3s.conf
        reload: true
      loop:
        - net.bridge.bridge-nf-call-iptables
        - net.bridge.bridge-nf-call-ip6tables
        - net.ipv4.ip_forward

    # ── inotify: a host ceiling, not a cluster one (2026-08-24) ─────
    # The nvidia-device-plugin opens an FS watcher over
    # /var/lib/kubelet/device-plugins/ and with the Ubuntu default
    # (fs.inotify.max_user_instances=128) it dies at startup with "too
    # many open files" — which is NOT exhausted fds, they are root's
    # inotify INSTANCES. Measured 2026-08-24: 424 restarts in 6 days,
    # the node advertising nvidia.com/gpu: 0, and with that the AI
    # engines impossible to schedule. The symptom shows up far from the
    # cause: the gpu App sits Progressing, its three resources Synced.
    #
    # Every controller, operator and kubelet in the cluster opens its
    # own; 128 is a desktop ceiling, not a node ceiling. The values are
    # the ones k3s recommends for nodes with many pods.
    - name: inotify ceiling for a k3s node (persisted)
      ansible.posix.sysctl:
        name: "{{ item.clave }}"
        value: "{{ item.valor }}"
        sysctl_file: /etc/sysctl.d/99-aegis-k3s.conf
        reload: true
      loop:
        - {clave: fs.inotify.max_user_instances, valor: "1024"}
        - {clave: fs.inotify.max_user_watches, valor: "524288"}

    # ── unprivileged user namespaces (run #8, bug D) ────────────────
    # Ubuntu >= 23.10 ships kernel.apparmor_restrict_unprivileged_userns=1
    # by DEFAULT: it blocks the rootless user namespace that buildah
    # uses for overlay(fuse) → "overlay: failed to make mount private:
    # permission denied" on the first build (phase 50). The SAME pod
    # runs GREEN on WSL2 (apparmor disabled, the key does not exist) —
    # the buildah manifest is PROVEN config (live in v1); the bug
    # belongs to the Ubuntu environment, and it will hit Hetzner JUST
    # THE SAME (Ubuntu 24.04). We restore the standard pre-23.10
    # behaviour (unprivileged userns allowed — the default everywhere
    # else). CONDITIONAL: the key only exists on kernels carrying that
    # hardening (on WSL2 it does not exist, nothing to relax):
    - name: Kernel restricts unprivileged userns (Ubuntu >= 23.10)?
      ansible.builtin.stat:
        path: /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      register: userns_restrict

    - name: Allow unprivileged user namespaces (buildah rootless)
      ansible.posix.sysctl:
        name: kernel.apparmor_restrict_unprivileged_userns
        value: "0"
        sysctl_file: /etc/sysctl.d/99-aegis-k3s.conf
        reload: true
      when: userns_restrict.stat.exists

    - name: k3s config directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    # ── cluster DNS with systemd-resolved (run #7, bug B) ────────────
    # Ubuntu uses systemd-resolved: /etc/resolv.conf is the STUB
    # (nameserver 127.0.0.53). k3s hands that stub to CoreDNS → inside
    # the pod 127.0.0.53 is an empty loopback → CoreDNS resolves
    # nothing external (i/o timeout) and the whole node loses DNS
    # after every k3s restart (the phase 40 one broke the pipeline).
    # Canonical k3s fix: --resolv-conf pointing at the REAL resolv.conf
    # of systemd-resolved. Via config.yaml (NOT INSTALL_K3S_EXEC): k3s
    # re-reads it on EVERY start → it survives the phase 40 restart.
    # CONDITIONAL: only if the path exists (portable — on a host with
    # no systemd-resolved the k3s default already works; CLAUDE.md: the
    # stack runs the same on the Ryzen as on a VPS).
    - name: Does systemd-resolved provide the real resolv.conf?
      ansible.builtin.stat:
        path: /run/systemd/resolve/resolv.conf
      register: resolved_real

    - name: k3s config.yaml — resolv-conf to real upstream (idempotent)
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: "0644"
        content: |
          # managed by aegis-init (bootstrap-host) — bug B, run #7
          resolv-conf: /run/systemd/resolve/resolv.conf
      when: resolved_real.stat.exists

    # ── the NVIDIA container runtime, and WHY IT LIVES HERE ─────────
    # Until 2026-08-31 nothing in this artifact installed it and
    # nothing measured it. The manifest that needs it says so in a
    # comment (k8s/base/gpu/runtimeclass.yaml) and a comment installs
    # nothing: its absence surfaced far from its cause, as a 300 s
    # timeout of the `gpu-units-advertised` gate about forty minutes
    # into an install, with a diagnosis listing four possible causes.
    #
    # It goes in THIS playbook and not in phase 87, and that placement
    # is the whole trick: bootstrap-host runs BEFORE k3s exists. With
    # the runtime already on the PATH, k3s writes its containerd
    # config for the first time with the `nvidia` handler in it. No
    # ordering problem, no restart, no window where the RuntimeClass
    # names something containerd has never heard of.
    #
    # And what is deliberately NOT done: `nvidia-ctk runtime configure`
    # against k3s's containerd. k3s REGENERATES that file from its
    # template on every start, so an edit by hand is erased on the next
    # boot — the class of drift this artifact refuses. Letting k3s
    # detect the runtime itself is the only version that survives.
    - name: NVIDIA container toolkit — apt keyring (AI=gpu only)
      ansible.builtin.get_url:
        url: https://nvidia.github.io/libnvidia-container/gpgkey
        dest: /etc/apt/keyrings/nvidia-container-toolkit.asc
        mode: "0644"
      when: aegis_ai | default('no') == 'gpu'

    - name: NVIDIA container toolkit — apt source (AI=gpu only)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/nvidia-container-toolkit.list
        mode: "0644"
        content: |
          # managed by aegis-init (bootstrap-host) — AI=gpu
          deb [signed-by=/etc/apt/keyrings/nvidia-container-toolkit.asc] https://nvidia.github.io/libnvidia-container/stable/deb/$(ARCH) /
      when: aegis_ai | default('no') == 'gpu'

    - name: NVIDIA container toolkit installed (AI=gpu only)
      ansible.builtin.apt:
        name: nvidia-container-toolkit
        state: present
        update_cache: true
      when: aegis_ai | default('no') == 'gpu'
