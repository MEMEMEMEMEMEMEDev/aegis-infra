# install-k3s v2 — pin LITERAL desde group_vars (A12); flags
# disable=traefik/servicelb (llegan declarativos por GitOps).
---
- name: Instalar K3s pinneado
  hosts: k3s_nodes
  become: true

  tasks:
    - name: ¿k3s ya instalado en la versión pinneada?
      ansible.builtin.command: /usr/local/bin/k3s --version
      register: k3s_ver
      changed_when: false
      failed_when: false
      check_mode: false          # lectura pura (A13)

    - name: Instalar k3s {{ k3s_version }}
      ansible.builtin.shell: |
        set -o pipefail
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_VERSION="{{ k3s_version }}" \
          INSTALL_K3S_EXEC="{{ k3s_install_flags }}" sh -
      args: { executable: /bin/bash }
      when: k3s_version not in (k3s_ver.stdout | default(''))

    - name: Esperar nodo Ready
      ansible.builtin.command: >-
        /usr/local/bin/k3s kubectl wait --for=condition=Ready
        node --all --timeout=300s
      changed_when: false
      when: not ansible_check_mode

    # H4 corrida #15: el nodo se pone Ready ANTES de que el
    # controlador de manifests CREE el deployment de coredns —
    # `rollout status` con NotFound sale rc!=0 en 0.5s (el --timeout
    # nunca aplica) y el playbook moría fatal; lo salvaba el retry
    # genérico del wrapper DE CASUALIDAD y con etiqueta errónea
    # ("¿red?"). Patrón existencia→estado (el mismo de argo_sync):
    # (loop shell y no until/retries: la semántica de retries
    #  agotados + failed_when varía entre versiones de ansible-core —
    #  regla fuente-es-el-binario: no apostar; el sh es determinista)
    - name: Esperar que el deployment coredns EXISTA (H4)
      ansible.builtin.shell: |
        for i in $(seq 1 60); do
          /usr/local/bin/k3s kubectl -n kube-system get deploy coredns \
            >/dev/null 2>&1 && exit 0
          sleep 3
        done
        echo "kube-system/coredns NUNCA fue creado tras ~180s — el controlador de manifests de k3s no lo creó (mirar journalctl -u k3s); esto NO es red" >&2
        exit 1
      args: { executable: /bin/bash }
      changed_when: false
      when: not ansible_check_mode

    - name: Validar coredns
      ansible.builtin.command: >-
        /usr/local/bin/k3s kubectl -n kube-system rollout status
        deploy/coredns --timeout=180s
      changed_when: false
      when: not ansible_check_mode
