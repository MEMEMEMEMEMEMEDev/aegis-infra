# install-k3s v2 — LITERAL pin from group_vars (A12); flags
# disable=traefik/servicelb (they arrive declaratively via GitOps).
---
- name: Install pinned K3s
  hosts: k3s_nodes
  become: true

  tasks:
    - name: Is k3s already installed at the pinned version?
      ansible.builtin.command: /usr/local/bin/k3s --version
      register: k3s_ver
      changed_when: false
      failed_when: false
      check_mode: false          # pure read (A13)

    - name: Install k3s {{ k3s_version }}
      ansible.builtin.shell: |
        set -o pipefail
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_VERSION="{{ k3s_version }}" \
          INSTALL_K3S_EXEC="{{ k3s_install_flags }}" sh -
      args: { executable: /bin/bash }
      when: k3s_version not in (k3s_ver.stdout | default(''))

    - name: Wait for node Ready
      ansible.builtin.command: >-
        /usr/local/bin/k3s kubectl wait --for=condition=Ready
        node --all --timeout=300s
      changed_when: false
      when: not ansible_check_mode

    # H4 run #15: the node turns Ready BEFORE the manifest controller
    # CREATES the coredns deployment — `rollout status` on a NotFound
    # exits rc!=0 in 0.5s (the --timeout never applies) and the
    # playbook died fatal; the wrapper's generic retry rescued it BY
    # ACCIDENT and under the wrong label ("network?"). Pattern
    # existence→state (the same one as argo_sync):
    # (a shell loop and not until/retries: the semantics of exhausted
    #  retries + failed_when vary across ansible-core versions —
    #  source-is-the-binary rule: do not bet; the sh is deterministic)
    - name: Esperar que el deployment coredns EXISTA (H4)
      ansible.builtin.shell: |
        for i in $(seq 1 60); do
          /usr/local/bin/k3s kubectl -n kube-system get deploy coredns \
            >/dev/null 2>&1 && exit 0
          sleep 3
        done
        echo "kube-system/coredns was NEVER created after ~180s — the k3s manifest controller did not create it (look at journalctl -u k3s); this is NOT a network problem" >&2
        exit 1
      args: { executable: /bin/bash }
      changed_when: false
      when: not ansible_check_mode

    - name: Validate coredns
      ansible.builtin.command: >-
        /usr/local/bin/k3s kubectl -n kube-system rollout status
        deploy/coredns --timeout=180s
      changed_when: false
      when: not ansible_check_mode
