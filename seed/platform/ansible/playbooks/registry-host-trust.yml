# registry-host-trust — settles the "pending Ansible role" from
# 2026-07-02:132: registry CA onto the host + registries.yaml +
# k3s restart. PER NODE (on hetzner the inventory has N hosts).
# Replaces the manual sudo block from v1. Idempotent: it only
# restarts k3s if something changed.
---
- name: Host trusts the internal registry (aegis' own CA)
  hosts: k3s_nodes
  become: true
  # explicit KUBECONFIG (run #7, bug B / censored task): the tasks run
  # as ROOT (become) and use BARE `kubectl` — root does NOT have
  # ~/.kube/config (phase 20 copied it to the operator user, not to
  # root) → kubectl fell back to localhost:8080 → "Extract ca.crt ...
  # FAILED" (censored by no_log). k3s.yaml is mode 644, root can read
  # it. Covers ALL the kubectl tasks of the play (extraction +
  # post-restart waits).
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  vars:
    registry_cluster_ip: "{{ registry_cluster_ip }}"
    registry_port: 5000

  tasks:
    - name: Extract ca.crt from the Secret aegis-internal-ca (delegated
            to the first node with kubectl; NEVER printed — to a file)
      ansible.builtin.shell: |
        set -o pipefail
        kubectl -n cert-manager get secret aegis-internal-ca \
          -o jsonpath='{.data.ca\.crt}' | base64 -d
      args: { executable: /bin/bash }
      register: ca_pem
      delegate_to: "{{ groups['k3s_nodes'][0] }}"
      run_once: true
      changed_when: false
      # fails HARD if the CA came back empty (avoids writing an empty
      # aegis-ca.pem that would break trust silently — the pull fails 1
      # phase later with x509). no_log STAYS (the CA is T1, no-dump
      # pattern):
      failed_when: ca_pem.rc != 0 or (ca_pem.stdout | default('') | length) == 0
      no_log: true

    - name: Install aegis-ca.pem
      ansible.builtin.copy:
        content: "{{ ca_pem.stdout }}"
        dest: /etc/rancher/k3s/aegis-ca.pem
        mode: "0644"
      register: ca_file

    - name: Install aegis' CA into the SYSTEM trust store
      # /etc/rancher/k3s/aegis-ca.pem above is read by ONE consumer:
      # containerd, told about it by registries.yaml. Nothing else on
      # the host knows that file exists — so `curl https://argocd.…`
      # and any browser on this machine reject the certificate, and the
      # operator learns to click through the warning. Under
      # EDGE=cloudflare that only affects internal names; under
      # EDGE=local it is EVERY name the platform answers to, because
      # the whole edge is served with this CA's wildcard.
      #
      # The extension MUST be .crt: update-ca-certificates ignores
      # anything else in that directory, silently, and the trust simply
      # never appears.
      ansible.builtin.copy:
        content: "{{ ca_pem.stdout }}"
        dest: /usr/local/share/ca-certificates/aegis-internal-ca.crt
        mode: "0644"
      register: ca_system

    - name: Refresh the system trust store
      ansible.builtin.command: update-ca-certificates
      when: ca_system.changed
      changed_when: ca_system.changed

    - name: "Render registries.yaml (https mirror via fixed ClusterIP + ca_file — the kubelet does not resolve .svc — A30)"
      ansible.builtin.template:
        src: ../roles/registry-host-trust/templates/registries.yaml.j2
        dest: /etc/rancher/k3s/registries.yaml
        mode: "0644"
      register: registries_file

    - name: "Map the registry name to the ClusterIP in /etc/hosts (H2 run #13)"
      # the kubelet/containerd runs ON THE HOST: .svc names are only
      # resolved by CoreDNS (internal). The mirror's hosts.toml leaves
      # server = <the name> and containerd tries to RESOLVE it before
      # falling back to the alternate host → the pull dies in DNS
      # without ever reaching the mirror. With the /etc/hosts entry the
      # pull works instantly (validated live in #13: auth+TLS+CA OK
      # downstream). The ClusterIP is fixed by design
      # (REGISTRY_CLUSTER_IP, T1):
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ registry_cluster_ip }} registry.registry-system.svc.cluster.local"
        regexp: 'registry\.registry-system\.svc\.cluster\.local\s*$'

    - name: Restart k3s ONLY if something changed
      ansible.builtin.systemd:
        name: k3s
        state: restarted
      when: ca_file.changed or registries_file.changed

    - name: Wait for node Ready after the restart
      ansible.builtin.command: >-
        kubectl wait --for=condition=Ready node --all --timeout=180s
      changed_when: false
      when: ca_file.changed or registries_file.changed
