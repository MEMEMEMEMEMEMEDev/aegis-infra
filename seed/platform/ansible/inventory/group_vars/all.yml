# Pins WITH A CODE CONSUMER in this file; nothing else (A12:
# literals, not channels; A42: the Trivy scan watches for
# ageing — bump SUPPORTED LINES).
#
# SINGLE-SOURCE RULE (no mirrors): every pin lives ONLY where it is
# consumed. Here: k3s (install-k3s.yml), userland (phase 05), cilium
# (phase 20 hetzner). CHART pins live in the Application objects
# under k8s/argocd-apps/*.yaml — the manifest ArgoCD applies is the
# source; phase 30 DERIVES from core.yaml the complete argocd
# contract (chart+version+release+values). IMAGE pins live in the
# consuming manifest/Containerfile/Jenkinsfile.
# A "pin summary" block here would be a mirror with no consumer:
# guaranteed drift (the lesson of the duplicated argocd pin).
# Pin index: grep -rn 'targetRevision\|image:' across the platform.

k3s_version: "v1.35.4+k3s1"

userland_pins:
  # drift NOTE (run #10): tofu and age are installed by installers that
  # pull THE LATEST of their line (deb repo from get.opentofu.org / apt
  # from Ubuntu) — the pin here does NOT fix what gets installed, it
  # fixes what is EXPECTED. The drift will come back over time; the
  # gate_red of phase 05 is the decision point and the pin is realigned
  # in the run that detects it. Realigned 2026-07: tofu 1.12.3 ran the
  # whole of phase 25 (edge e2e) in run #10 — live evidence, not
  # release notes.
  tofu: "1.12.3"        # verify state-encryption against THIS binary
  sops: "3.9.4"
  age: "1.2.1"
  kubectl: "1.35.4"     # aligned to k3s
  helm: "3.17.0"
  gh: "apt"             # operator PREREQUISITE (installed and
                        # authenticated BEFORE init — it is THE
                        # GitHub credential, D10); "apt" = presence
                        # is enough, no version comparison
  cosign: "2.6.3"       # host: ceremony+verify phase 80; NOT v3 (A43);
                        # keep aligned with ci-images/cosign/
  direnv: "apt"
  jq: "apt"
  git: "apt"            # H1 validation #1: the phase 05 loop installs
  openssl: "apt"        # them and the pin MUST exist (clean failure if
                        # missing, not a KeyError)

# k3s flags (2026-04-30:96-112): traefik/servicelb arrive declaratively
# write-kubeconfig-mode 600, NOT 644 (finding from the native Linux
# run, 2026-07-25): /etc/rancher/k3s/k3s.yaml carries the
# CLUSTER-ADMIN client-certificate + client-key. With 644 any local
# user or process on the host is an admin of the cluster. On a
# disposable VM that did not matter; on a real host it is direct
# escalation. COUPLED with 20-k3s.sh: the copy to ~/.kube/config MUST
# be done with privilege, because a user-level cp can no longer read
# the source. Guarded by check 85 of verify-static.sh.
#
# node-name GENERIC (2026-08-29): until this commit it carried the name
# of the node on the machine where the seed was first written, which is
# identity of one INSTANCE travelling inside the product — the same
# class check 116 keeps out for addresses and 117 for people. A name
# that is the same on every installation names nobody, which is exactly
# why the private ranges are allowed there. Nothing in the seed reads
# this value (`grep -rn node-name` returns this line and nothing else);
# it is what `kubectl get nodes` shows.
k3s_install_flags: >-
  --write-kubeconfig-mode 600
  --disable=traefik
  --disable=servicelb
  --node-name=aegis-node

# Cilium — hetzner profile ONLY (ADR-0014: kube-router does not
# enforce NetPol; decision: Cilium). SENTINEL PIN on purpose: phase 20
# aborts if it has not been verified against helm.cilium.io (rule:
# the source is the real chart, not training memory — Cilium was
# never deployed in v1, there is no valid inherited pin).
cilium_chart_version: "VERIFICAR-ANTES-DE-HETZNER"
