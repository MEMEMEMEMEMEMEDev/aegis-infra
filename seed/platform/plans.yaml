# plans.yaml — LOS NÚMEROS VIVEN ACÁ Y EN NINGÚN OTRO LADO.
#
# Un contrato de organización dice `cuota: pequena`, nunca `cpu: 2`. La
# razón es aritmética: el día que cambie el hardware, o que un plan
# resulte mal dimensionado, esto es UN archivo y no treinta. Si los
# números estuvieran en cada contrato, cambiarlos sería una migración.
#
# Cambiar un número de acá NO es una versión nueva del contrato (§8 de
# docs/protocols/organization.md): el contrato no menciona números, así
# que no puede quedar desactualizado por esto.
#
# Los planes son ESCALONES, no un continuo. Un continuo invita a
# negociar cada caso ("¿y si le damos 2.5 CPU?") y a los seis meses hay
# treinta cuotas distintas que nadie puede razonar en conjunto.

cuota:
  # Un front estático y a lo sumo un backend chico. Deliberadamente
  # apretado: una cuota no es una aspiración, es el techo que evita que
  # un bug acá se lleve puesto al vecino.
  pequena:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "20"
    persistentvolumeclaims: "5"
    # OJO: limita el tamaño DECLARADO de los PVC, no el USADO. local-path
    # hace bind de un directorio del host y no impone cuota de disco: un
    # pod puede escribir más que su PVC hasta llenar /. Es una limitación
    # conocida del provisioner, no de esto.
    requests.storage: 10Gi

  # Front + API + una base. El escalón por defecto para un producto real.
  mediana:
    requests.cpu: "4"
    requests.memory: 6Gi
    limits.cpu: "8"
    limits.memory: 12Gi
    pods: "40"
    persistentvolumeclaims: "10"
    requests.storage: 50Gi

  grande:
    requests.cpu: "8"
    requests.memory: 12Gi
    limits.cpu: "16"
    limits.memory: 24Gi
    pods: "80"
    persistentvolumeclaims: "20"
    requests.storage: 200Gi

ai:
  # La moneda es el TOKEN, no la request. Una request puede costar 10
  # tokens o 3.000; cobrar por request premia exactamente el abuso que
  # se quiere evitar.
  #
  # `prioridad` ordena la cola cuando hay contención: con una sola GPU
  # detrás, dos organizaciones pidiendo a la vez tienen que resolverse
  # de alguna manera, y "quien llegó primero" castiga a quien paga más.
  # Menor número = atendido antes.
  #
  # `reserva` es lo que impide que un plan alto sea exclusividad: por
  # bajo que sea el plan, esa fracción del cupo le queda garantizada. Un
  # plan intensivo compra LATENCIA, no el derecho a dejar a otro sin
  # turno. Sin la reserva, una organización grande hambrea a las chicas
  # y el producto deja de servir para quien recién empieza.
  #
  # ── OJO CON LAS FRACCIONES A ESTE TAMAÑO ─────────────────────────
  #
  # Con el cupo de HOY (4 en vuelo), estas tres fracciones dan lo mismo:
  #
  #   basico    0,15 x 4 = 0,6 -> 0 -> piso de 1
  #   estandar  0,25 x 4 = 1,0 -> 1
  #   intensivo 0,35 x 4 = 1,4 -> 1
  #
  # Medido en el arranque del gateway (build 7):
  #   "reservas":{"basico":1,"estandar":1,"intensivo":1}
  #
  # O sea: la PROPORCIÓN entre planes no se expresa. Tres de los cuatro
  # lugares quedan reservados, uno por plan, y el cuarto es de quien
  # llegue. Eso NO está roto —cada plan conserva su piso, que es lo que
  # la reserva existe para dar— pero conviene saberlo antes de retocar
  # estos números creyendo que mueven algo: a este tamaño lo que
  # diferencia a los planes es `prioridad` (quién entra primero) y
  # `concurrencia` (cuánto puede tomar cada organización), que sí
  # funcionan con 4 lugares.
  #
  # Las fracciones empiezan a significar algo con un cupo >= 8, que es
  # cuando haya una segunda GPU. Se dejan expresadas para no tener que
  # redescubrir la intención ese día.
  #
  # Esto se supo porque el gateway loguea las reservas AL ARRANCAR y no
  # solo cuando cambian. Sin esa línea, "se aplicaron" y "nunca se
  # evaluaron" se veían igual.
  # `concurrencia` es por ORGANIZACIÓN, no por visitante: cuántos
  # pedidos suyos pueden estar en la GPU a la vez. En 1 alcanzaba para
  # un visitante y serializaba a dos, que con un cupo total de 4 es
  # desperdiciar la mitad de la máquina para proteger de nada. En 2, una
  # organización básica nunca pasa de la mitad del cluster y las demás
  # conservan su reserva.
  # ── LOS tokens_min SE MULTIPLICARON POR 10 el 2026-08-08 ──────────
  #
  # Y NO es que se aflojaron los límites: es que la moneda cambió de
  # tamaño. Hasta ese día el presupuesto descontaba sólo los tokens de
  # SALIDA; la entrada era gratis. Medido sobre esta instancia:
  #
  #   org-blog      entrada 2277  salida 159   se cobraba 159
  #   org-ejemplo   entrada 5526  salida 1173  se cobraba 1173
  #
  # O sea que un proyecto gastaba entre 6 y 15 veces más GPU de lo que
  # se le descontaba. Ahora se cobra ENTRADA + SALIDA, que es lo que el
  # comentario de arriba dice desde el principio: la moneda es el token,
  # y un token de entrada cuesta GPU igual que uno de salida —el prefill
  # es donde se va el tiempo—.
  #
  # El x10 mantiene el RITMO EFECTIVO que ya había, que era ~9 pedidos
  # por minuto para `basico`. Con el costo real medido (~370 tokens un
  # resumen, ~610 una consulta al blog con contexto de artículo), 6000
  # da esos mismos ~10 pedidos. Cambiar la moneda sin recalibrar habría
  # dejado a `basico` en menos de dos por minuto, y eso no se siente
  # como una corrección: se siente como una caída de servicio.
  #
  # OJO CON LOS DOS DE ARRIBA A ESTE TAMAÑO, misma advertencia que la de
  # las reservas: con UNA GPU el techo físico son ~60 pedidos por minuto
  # entre TODOS, o sea ~36.000 tokens/min. `estandar` e `intensivo`
  # quedan por encima de eso, así que hoy no los limita su presupuesto
  # sino la cola y la concurrencia. Se dejan proporcionales para que el
  # día que haya una segunda GPU signifiquen lo que dicen.
  #
  # ── MEDIDO CONTRA EL CLUSTER, no calculado ───────────────────────
  #
  # 2026-08-08, gateway build 11, org-portafolio (`basico`) contra la
  # puerta interna, pedidos secuenciales de portafolio.chat.guia:
  #
  #   una sola IP          12 pasan, corta el 13 con `ritmo_ip`
  #   IPs distintas        24 pasan, corta el 25 con `presupuesto_tenant`
  #
  # LOS DOS RESULTADOS IMPORTAN Y DICEN COSAS DISTINTAS:
  #
  #   Un visitante solo martillando nunca llega al presupuesto: lo para
  #   antes el ritmo por IP, que es el filtro más barato. Es lo que se
  #   quiere — no hace falta gastar el balde de tokens del proyecto para
  #   frenar a uno.
  #
  #   El presupuesto de `tokens_min` es para el caso real: MUCHOS
  #   visitantes de un mismo proyecto. Ahí sí corta, y corta donde dice
  #   la aritmética: ráfaga 9000 + recarga durante los ~15 s del ensayo,
  #   dividido los ~426 tokens que cuesta de verdad un pedido (383 de
  #   entrada + ~43 de salida) = 24. Esos 383 de entrada son los que
  #   antes de #61 viajaban gratis.
  #
  # Y EL VECINO SIGUIÓ ATENDIDO: con el portafolio en 429, org-blog
  # respondió sus 5 pedidos con 200. El balde es por inquilino, y eso
  # ahora está medido y no supuesto.
  basico:
    tokens_min: 6000
    concurrencia: 2
    prioridad: 3
    reserva: 0.15
  estandar:
    tokens_min: 40000
    concurrencia: 2
    prioridad: 2
    reserva: 0.25
  intensivo:
    tokens_min: 120000
    concurrencia: 4
    prioridad: 1
    reserva: 0.35
