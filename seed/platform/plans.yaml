# plans.yaml — THE NUMBERS LIVE HERE AND NOWHERE ELSE.
#
# An organization contract says `cuota: pequena`, never `cpu: 2`. The
# reason is arithmetic: the day the hardware changes, or a plan turns
# out to be badly sized, this is ONE file and not thirty. If the
# numbers lived in each contract, changing them would be a migration.
#
# Changing a number in here is NOT a new version of the contract (§8 of
# docs/protocols/organization.md): the contract names no numbers, so it
# cannot fall out of date because of this.
#
# The plans are STEPS, not a continuum. A continuum invites negotiating
# every case ("what if we give them 2.5 CPU?") and six months later
# there are thirty different quotas nobody can reason about as a whole.

cuota:
  # A static front end and at most one small backend. Deliberately
  # tight: a quota is not an aspiration, it is the ceiling that keeps a
  # bug in here from running the neighbor over.
  pequena:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "20"
    persistentvolumeclaims: "5"
    # WATCH OUT: this caps the DECLARED size of the PVCs, not the USED
    # one. local-path bind-mounts a host directory and imposes no disk
    # quota: a pod can write past its PVC until / fills up. It is a
    # known limitation of the provisioner, not of this.
    requests.storage: 10Gi

  # Front end + API + one database. The default step for a real product.
  mediana:
    requests.cpu: "4"
    requests.memory: 6Gi
    limits.cpu: "8"
    limits.memory: 12Gi
    pods: "40"
    persistentvolumeclaims: "10"
    requests.storage: 50Gi

  grande:
    requests.cpu: "8"
    requests.memory: 12Gi
    limits.cpu: "16"
    limits.memory: 24Gi
    pods: "80"
    persistentvolumeclaims: "20"
    requests.storage: 200Gi

ai:
  # The currency is the TOKEN, not the request. A request can cost 10
  # tokens or 3,000; charging per request rewards exactly the abuse we
  # are trying to avoid.
  #
  # `prioridad` orders the queue under contention: with a single GPU
  # behind it, two organizations asking at the same time have to be
  # resolved somehow, and "first come, first served" punishes whoever
  # pays more. Lower number = served earlier.
  #
  # `reserva` is what stops a high plan from becoming an exclusive: no
  # matter how low the plan, that fraction of the quota stays
  # guaranteed to it. An intensivo plan buys LATENCY, not the right to
  # leave somebody else without a turn. Without the reserve, a large
  # organization starves the small ones and the product stops being of
  # any use to whoever is just starting out.
  #
  # ── MIND THE FRACTIONS AT THIS SIZE ──────────────────────────────
  #
  # With TODAY's quota (4 in flight), these three fractions give the
  # same result:
  #
  #   basico    0.15 x 4 = 0.6 -> 0 -> floor of 1
  #   estandar  0.25 x 4 = 1.0 -> 1
  #   intensivo 0.35 x 4 = 1.4 -> 1
  #
  # Measured at gateway start-up (build 7):
  #   "reservas":{"basico":1,"estandar":1,"intensivo":1}
  #
  # That is: the PROPORTION between plans is not expressed. Three of the
  # four slots end up reserved, one per plan, and the fourth goes to
  # whoever gets there. That is NOT broken —each plan keeps its floor,
  # which is what the reserve exists to give— but it is worth knowing
  # before touching up these numbers believing they move something: at
  # this size what tells the plans apart is `prioridad` (who gets in
  # first) and `concurrencia` (how much each organization may take),
  # which do work with 4 slots.
  #
  # The fractions start to mean something with a quota >= 8, which is
  # when there is a second GPU. They are left expressed so that the
  # intention does not have to be rediscovered that day.
  #
  # This was learned because the gateway logs the reserves AT START-UP
  # and not only when they change. Without that line, "they were
  # applied" and "they were never evaluated" looked identical.
  # `concurrencia` is per ORGANIZATION, not per visitor: how many of its
  # requests can be on the GPU at once. At 1 it was enough for one
  # visitor and serialized two, which with a total quota of 4 is wasting
  # half the machine to protect against nothing. At 2, a basico
  # organization never takes more than half the cluster and the rest
  # keep their reserve.
  # ── tokens_min WERE MULTIPLIED BY 10 on 2026-08-08 ───────────────
  #
  # And it is NOT that the limits were loosened: it is that the currency
  # changed size. Until that day the budget deducted only the OUTPUT
  # tokens; input was free. Measured on this instance:
  #
  #   org-blog      input 2277  output 159   charged 159
  #   org-ejemplo   input 5526  output 1173  charged 1173
  #
  # Which means a project was spending between 6 and 15 times more GPU
  # than it was charged for. Now INPUT + OUTPUT is charged, which is
  # what the comment above has been saying from the start: the currency
  # is the token, and an input token costs GPU just like an output one
  # —prefill is where the time goes—.
  #
  # The x10 preserves the EFFECTIVE PACE that was already there, which
  # was ~9 requests per minute for `basico`. With the real measured cost
  # (~370 tokens for a summary, ~610 for a blog query carrying article
  # context), 6000 gives those same ~10 requests. Changing the currency
  # without recalibrating would have left `basico` under two per minute,
  # and that does not feel like a correction: it feels like an outage.
  #
  # MIND THE TWO ABOVE AT THIS SIZE, the same warning as the one about
  # the reserves: with ONE GPU the physical ceiling is ~60 requests per
  # minute across EVERYONE, that is ~36,000 tokens/min. `estandar` and
  # `intensivo` sit above that, so today what limits them is not their
  # budget but the queue and the concurrency. They are left
  # proportional so that the day there is a second GPU they mean what
  # they say.
  #
  # ── MEASURED AGAINST THE CLUSTER, not calculated ─────────────────
  #
  # 2026-08-08, gateway build 11, org-portafolio (`basico`) against the
  # internal door, sequential portafolio.chat.guia requests:
  #
  #   a single IP          12 pass, the 13th is cut by `ritmo_ip`
  #   different IPs        24 pass, the 25th by `presupuesto_tenant`
  #
  # BOTH RESULTS MATTER AND THEY SAY DIFFERENT THINGS:
  #
  #   A single visitor hammering away never reaches the budget: the
  #   per-IP rate stops them earlier, and it is the cheapest filter.
  #   That is what we want — there is no need to spend the project's
  #   bucket of tokens to hold back one person.
  #
  #   The `tokens_min` budget is for the real case: MANY visitors of the
  #   same project. There it does cut, and it cuts where the arithmetic
  #   says: burst 9000 + refill over the ~15 s of the trial, divided by
  #   the ~426 tokens a request really costs (383 of input + ~43 of
  #   output) = 24. Those 383 of input are the ones that travelled free
  #   before #61.
  #
  # AND THE NEIGHBOR WENT ON BEING SERVED: with the portfolio at 429,
  # org-blog answered its 5 requests with 200. The bucket is per tenant,
  # and that is now measured and not assumed.
  basico:
    tokens_min: 6000
    concurrencia: 2
    prioridad: 3
    reserva: 0.15
  estandar:
    tokens_min: 40000
    concurrencia: 2
    prioridad: 2
    reserva: 0.25
  intensivo:
    tokens_min: 120000
    concurrencia: 4
    prioridad: 1
    reserva: 0.35
