# services.yaml — con QUÉ implementa la plataforma los tipos de
# servicio que ella misma provee.
#
# Mismo principio que ai/routes.yaml y por la misma razón: el contrato de
# una organización dice `tipo: postgres`, que es una promesa ("una base
# relacional, con su disco y su credencial"). Con qué se cumple lo
# decide este archivo. Una organización que nombrara `postgres:17-alpine`
# quedaría casada con una decisión de infraestructura que no le
# corresponde, y subir de mayor sería editar todos los contratos.
#
# ── POR DIGEST, NO POR TAG ────────────────────────────────────────
#
# Kyverno reescribe `imagen:tag` a `imagen:tag@sha256:...` al admitir el
# pod (mutateDigest). Con un TAG en git, desired != live PARA SIEMPRE, y
# la salida obvia —`ignoreDifferences` sobre la imagen— APAGA EL
# AUTO-SYNC: si la única diferencia entre git y el cluster es la imagen
# y la imagen está ignorada, ArgoCD no ve nada que hacer.
#
# Con el DIGEST en git la mutación es un no-op (entrada idéntica a
# salida), no hay deriva, y no hay nada que ignorar. Es el hallazgo #36
# y está medido.
#
# org-ecommerce todavía tiene garage por TAG con ignoreDifferences: es
# del modelo viejo y queda como deuda visible, no como ejemplo.
#
# ── DE DÓNDE SALEN ESTOS DIGESTS ──────────────────────────────────
#
# Del REGISTRY INTERNO, no de images.txt. No son el mismo número: el de
# images.txt pinnea el ORIGEN público, y `crane copy` de un índice
# multi-arquitectura no preserva ese digest. Comprobado el 2026-08-04:
#
#   images.txt (origen)     postgres@sha256:742f40ea20b9...
#   registry interno        postgres@sha256:fe30b547d0e9...
#
# Asumir que coinciden habría dado un ImagePullBackOff.
#
# Para releerlos, contra el registry interno y con la CA (no con -k: que
# el certificado valide es parte de lo que se comprueba):
#
#   kubectl -n registry-system port-forward svc/registry 15000:5000 &
#   curl -sD- -o /dev/null --netrc-file <netrc 600> --cacert <ca> \
#     --resolve registry.registry-system.svc.cluster.local:15000:127.0.0.1 \
#     -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
#     https://registry.registry-system.svc.cluster.local:15000/v2/postgres/manifests/17.10-alpine \
#     | grep -i docker-content-digest
#
# El netrc sale de regcred-internal con la mecánica de
# init/lib/secrets.sh:374 (registry_creds): la contraseña no toca argv.
#
# ── CÓMO SE ACTUALIZA ─────────────────────────────────────────────
#
#   1. nueva línea en mirror-images/images.txt (origen por digest)
#   2. correr el job mirror-images  -> espeja, ESCANEA y FIRMA
#   3. releer el digest del registry interno (receta de arriba)
#   4. editarlo acá + `bin/aegis-org aplicar orgs/*.yaml`
#
# El paso 4 es aparte a propósito: espejar no despliega. Traer una
# imagen y ponerla en producción son dos decisiones distintas.

version: 1

registro: registry.registry-system.svc.cluster.local:5000

tipos:
  # Base relacional por organización. NO compartida: una base por
  # organización es lo que hace que un `DROP` de una no toque a la
  # vecina, y el costo en RAM de un postgres ocioso es despreciable
  # frente a esa garantía.
  postgres:
    imagen: postgres
    digest: sha256:fe30b547d0e9fc2af0377ef99d9a31fd7171281ff4b42d49b3587e0c043676af
    tag_origen: 17.10-alpine # informativo: qué se está leyendo
    puerto: 5432
    # Mayor 17 a propósito: más tiempo de campo que la 18 y soporte
    # upstream hasta noviembre de 2029.
    #
    # El disco es del PLAN de cuota, no de este archivo — una
    # organización `grande` no debería tener el mismo disco que una
    # `pequena`. `disco` acá es el piso para la más chica.
    disco: 2Gi
    # alpine corre como el usuario `postgres` (UID 70) y necesita
    # escribir en PGDATA. El resto del filesystem va de solo lectura.
    uid: 70

# El almacenamiento S3 no es un `tipo` de servicio sino una sección del
# contrato (`almacenamiento.bucket`): una organización no despliega un
# Garage, obtiene un bucket en el que ya existe.
bucket:
  # Dónde vive el Garage compartido. Sale de acá y no de una constante
  # del generador porque el día que haya un segundo cluster, o que el
  # almacenamiento se mueva a un servicio externo, esto es una línea.
  endpoint: http://garage.garage-system.svc.cluster.local:3900
  admin: http://garage.garage-system.svc.cluster.local:3903
  region: garage
  # La imagen del Job que crea el bucket y le da permiso a la clave de
  # la organización. Es nodejs-distroless, que YA está espejada y
  # firmada: Node hace HTTP sin una sola dependencia, así que no hace
  # falta traer y firmar una imagen nueva solo para hablar con una API.
  #
  # Y es distroless: sin shell, sin gestor de paquetes. Un Job que
  # maneja el admin token del almacenamiento es exactamente donde no se
  # quiere un `sh` disponible.
  aprovisionador:
    imagen: nodejs-distroless
    # Del REGISTRY INTERNO, no de images.txt: son números distintos.
    # El de images.txt (a2723a28...) pinnea el origen público.
    digest: sha256:70d1eb571029aa736d99ee9c8caf1eaa190dfdc45b8c58584e5d73efc74ee66d
    tag_origen: "22"

