# AppProjects v2 — W-06 / R1 path B (writing to an app's repo no
# longer grants cluster-scoped access). They are applied with kubectl
# in phase 35, BEFORE root (class C1: the project exists before any
# Application references it). No App manages them: they are bootstrap
# infra (like the D2 Secrets). That avoids (a) the
# AppProject-vs-Application race inside a single sync, and (b) the
# privilege-escalation vector of an App that edits projects. Hence
# they live outside k8s/argocd-apps/ (the App-of-Apps path).
#
# ── WHAT STAYED HERE AND WHAT LEFT (2026-08-05, #19) ──────────────
#
# The projects of the organizations WITH A CONTRACT are now derived by
# `aegis org` into appprojects-tenants.yaml, next door. This file
# keeps only what comes from no contract at all:
#
#   aegis-bootstrap, aegis-platform  the substrate. They belong to no
#                                    organization.
#   aegis-tenant-canary              the canary belongs to the
#                                    PLATFORM: it proves the tenant
#                                    path works, so it cannot depend
#                                    on that very path.
#
# An instance with history may also keep organizations here that
# PREDATE the generator —with no contract to derive them from—. That
# is debt belonging to that instance and it does not travel in the
# seed: here only the substrate plus the canary starts out.
#
# Why it was derived: repeating the block by hand DRIFTS, and the bill
# came due. On 2026-08-05 it was measured on the cluster that
# aegis-tenant-canary was the only one of the four tenant projects
# WITHOUT `orphanedResources` —it was left out when #31 added it to
# the other three— so the canary's app was never evaluated and
# `aegis check` counted it under "nothing orphaned". A block copied
# three times gets updated twice. It is fixed below, and for the
# derived ones it can no longer happen: they are identical by
# construction, not by discipline.
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: aegis-bootstrap
  namespace: argocd
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  description: root App-of-Apps — only creates platform Applications
  sourceRepos:
    - git@github.com:__GH_OWNER__/__PLATFORM_REPO__.git
  destinations:
    - {server: https://kubernetes.default.svc, namespace: argocd}
  # root only applies Applications (namespaced) in argocd:
  namespaceResourceWhitelist:
    - {group: argoproj.io, kind: Application}
  clusterResourceWhitelist: []          # nothing cluster-scoped
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: aegis-platform
  namespace: argocd
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  description: platform plane — pinned charts + manifests from the platform repo
  # only the platform repo and the chart repos the Apps use
  # (enumerated, NOT '*'). They must match the exact repoURL in
  # core.yaml / ci-supply-tenants.yaml / observability.yaml:
  sourceRepos:
    - git@github.com:__GH_OWNER__/__PLATFORM_REPO__.git
    - https://argoproj.github.io/argo-helm
    - quay.io/jetstack/charts
    - https://traefik.github.io/charts
    - https://charts.jenkins.io
    - https://aquasecurity.github.io/helm-charts
    - https://kyverno.github.io/kyverno
    # observability (phase 85 — observability.yaml):
    - https://victoriametrics.github.io/helm-charts
    - https://helm.vector.dev
    - https://grafana.github.io/helm-charts
  # namespace '*' (this cluster): the charts create RBAC in namespaces
  # that are NOT their own — cert-manager puts its leaderelection
  # Role/RoleBinding in kube-system (v1 run: "namespace kube-system is
  # not permitted"). Enumerating namespaces = whack-a-mole (every run
  # finds another one). The platform project is TRUSTED; the real
  # restriction is sourceRepos (only the platform repo + known
  # charts). The security BOUNDARY is the aegis-tenant-canary project
  # (org-canary, cluster-scoped []).
  destinations:
    - {server: https://kubernetes.default.svc, namespace: '*'}
  # cluster-scoped '*': the platform charts install CRDs, cluster
  # RBAC, webhooks, ClusterIssuer/ClusterPolicy, IngressClass, etc.
  # Enumerating = whack-a-mole (every run finds one more kind →
  # another full run). The platform is TRUSTED; its REAL boundary is
  # sourceRepos (only the platform repo + known charts). The security
  # boundary is aegis-tenant-canary (org-canary, cluster-scoped []).
  clusterResourceWhitelist:
    - {group: '*', kind: '*'}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: aegis-tenant-canary
  namespace: argocd
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  description: the platform canary — ONLY its repo, ONLY org-canary, ZERO cluster-scoped (R1 path B)
  sourceRepos:
    - git@github.com:__GH_OWNER__/__APP_REPO__.git
  destinations:
    - {server: https://kubernetes.default.svc, namespace: org-canary}
  clusterResourceWhitelist: []          # deny-all cluster-scoped (THE R1-B fix)
  # and inside its namespace, it must not scale itself up nor change
  # its own limits (the platform sets those, via the org-canary App):
  namespaceResourceBlacklist:
    - {group: "", kind: ResourceQuota}
    - {group: "", kind: LimitRange}
    - {group: rbac.authorization.k8s.io, kind: Role}
    - {group: rbac.authorization.k8s.io, kind: RoleBinding}
    # And it cannot write its own routing (#54). The ones above
    # protect the organization from itself; this one protects ALL THE
    # OTHERS from it.
    #
    # An AppProject filters by *kind* and never by a field's value, so
    # there is no way to say "IngressRoutes yes, but only with YOUR
    # Host". MEASURED on 2026-08-06: two organizations claimed the
    # same hostname, both were admitted without a complaint, and
    # traefik served the second one's. The rightful owner had neither
    # a defense nor a warning.
    #
    # The platform puts the route in (k8s/organizations/org-*/routes.yaml).
    - {group: traefik.io, kind: IngressRoute}
  # ADDED on 2026-08-05. Missing since #31: the other three tenant
  # projects had it and this one did not, so the `hello-aegis` app was
  # never evaluated and the check counted it as clean. The canary is
  # precisely where it matters MOST —it is what gets broken on purpose
  # to prove the platform warns— and it was the only blind spot.
  orphanedResources:
    warn: true
    ignore:
      # The kube-controller-manager creates it in EVERY namespace, it
      # comes from no git and never will. Without this exception the
      # warning would show up forever, and a permanent warning kills
      # the signal just as an absence does — which is Disease E and
      # the very reason this mechanism exists.
      - group: ""
        kind: ConfigMap
        name: kube-root-ca.crt
---
# THE ORGANIZATIONS' INFRASTRUCTURE (#47, 2026-08-05).
#
# The `org-*` Apps deploy each organization's substrate —the
# namespace, the quota, the NetworkPolicies, the Secrets, the base—
# from the PLATFORM repo. They are not tenant apps (those come from
# the organization's own repo and live in its `aegis-tenant-<org>`),
# but neither are they platform: they are a third kind, and until
# today they had nowhere to live.
#
# They used to sit in `aegis-platform`, and that cost two things:
#
# 1. NOBODY LOOKED FOR ORPHANS IN THEM. `aegis-platform` has no
#    `orphanedResources`, so its Apps never produce that condition.
#    Measured on 2026-08-05: of 28 Applications, 3 were evaluated.
#    The remaining 25 —including these five, the ones that deploy
#    the NetworkPolicies of the incident behind #31— came out green
#    without anyone ever having looked at them.
#
# 2. THEY INHERITED cluster-scoped '*'. An organization App could
#    create a ClusterRoleBinding anywhere. The only cluster-scoped
#    thing they really deploy is their Namespace — enumerated below.
#
# WHY THIS WAS NOT FIXED BY ADDING orphanedResources TO
# aegis-platform, which was the obvious move: it was measured.
# Turning it on produces ~146 permanent warnings —81 from the `gpu`
# App alone, whose destination namespace is kube-system, plus the
# Secrets that cert-manager and ArgoCD itself generate— and not one is
# a real orphan: they are resources that never came from git and never
# will. A permanent warning kills the signal just as an absence does,
# which is Disease E and the reason this mechanism exists.
#
# The five `org-*` reported ZERO in that same measurement. That is why
# covering them here costs no noise and gives coverage where it
# counts.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: aegis-organizaciones
  namespace: argocd
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  description: each organization's substrate — namespace, quota, network and secrets, from the platform repo
  # Only the platform repo. These Apps deploy NOBODY's code: an
  # organization's code comes from its own repo and uses its own
  # project.
  sourceRepos:
    - git@github.com:__GH_OWNER__/__PLATFORM_REPO__.git
  destinations:
    # Each organization's namespace, by pattern: onboarding an
    # organization must not require editing this. The alternative
    # —enumerating— is one more place to remember, which is exactly
    # what #19 came to remove.
    - {server: https://kubernetes.default.svc, namespace: 'org-*'}
    # And argocd, because an organization's bundle includes the
    # Applications for its repos, which are objects in the ArgoCD
    # namespace. That is the only reason, and sourceRepos bounds it.
    - {server: https://kubernetes.default.svc, namespace: argocd}
  # ENUMERATED, not '*'. What these five Apps really deploy was
  # measured: 5 Namespaces and nothing else cluster-scoped. If the
  # generator emits another cluster-scoped kind tomorrow, the sync
  # fails saying "not permitted" —a clear error, right there and
  # then— instead of granting it silently forever.
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
  # WARN about what is left over, without deleting it (A19 / #31).
  orphanedResources:
    warn: true
    ignore:
      # The kube-controller-manager creates it in EVERY namespace, it
      # comes from no git and never will.
      - group: ""
        kind: ConfigMap
        name: kube-root-ca.crt
