# Observability Apps (phase 85; multi-doc by area — same contract
# as core.yaml): ServerSideApply=true; selfHeal=true; prune OMITTED
# (A19); aegis.dev/* labels (A18); __GH_OWNER__/__PLATFORM_REPO__
# placeholders (phase 10). Phase 85 decides the ORDER in which they
# are enabled: observability-base first (namespace + secrets + raw
# manifests), then the stores (vmsingle, vlogs, vlogs-events), then
# the collectors (vmagent, vector), then vmalert, grafana last —
# producers before consumers (D5).
#
# Chart versions: pinned EXACTLY (cilium_chart_version precedent),
# verified 2026-08-19 against each Helm repo's index.yaml (the latest
# stable published that day).
---
# observability-base BEFORE everything else (argocd-secrets/ADR-0015
# pattern): the namespace, the KSOPS Secrets, the raw manifests (ntfy,
# alertmanager, bridge, blackbox), the rules, the dashboards, the
# exposure and the trivy-db-age CronJob (which carries an EXPLICIT
# trivy-system namespace — the aegis-platform project allows '*').
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-base
  namespace: argocd
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  project: aegis-platform
  source:
    repoURL: git@github.com:__GH_OWNER__/__PLATFORM_REPO__.git
    targetRevision: main
    path: k8s/base/observability
  destination: {server: https://kubernetes.default.svc, namespace: observability}
  syncPolicy:
    automated: {selfHeal: true}
    syncOptions: [ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vmsingle
  namespace: argocd
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  project: aegis-platform
  sources:
    - repoURL: https://victoriametrics.github.io/helm-charts
      chart: victoria-metrics-single
      targetRevision: 0.45.0
      helm:
        releaseName: vmsingle
        valueFiles: [$values/k8s/base/observability/vmsingle/values.yaml]
    - repoURL: git@github.com:__GH_OWNER__/__PLATFORM_REPO__.git
      targetRevision: main
      ref: values
  destination: {server: https://kubernetes.default.svc, namespace: observability}
  syncPolicy:
    automated: {selfHeal: true}
    syncOptions: [ServerSideApply=true]
