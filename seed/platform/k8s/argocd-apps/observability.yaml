---
# TWO releases of the same victoria-logs-single chart, and that is
# THE point (design.md §4.1): OSS retention is global per instance —
# vlogs keeps it short (pod logs), vlogs-events 1y (supply-chain
# auditing).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vlogs
  namespace: argocd
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  project: aegis-platform
  sources:
    - repoURL: https://victoriametrics.github.io/helm-charts
      chart: victoria-logs-single
      targetRevision: 0.13.9
      helm:
        releaseName: vlogs
        valueFiles: [$values/k8s/base/observability/vlogs/values.yaml]
    - repoURL: git@github.com:__GH_OWNER__/__PLATFORM_REPO__.git
      targetRevision: main
      ref: values
  destination: {server: https://kubernetes.default.svc, namespace: observability}
  syncPolicy:
    automated: {selfHeal: true}
    syncOptions: [ServerSideApply=true]
