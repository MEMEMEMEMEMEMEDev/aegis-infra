# root App-of-Apps v2. ALWAYS A MANUAL SYNC (ADR-0012): the init and
# the operator control the WHEN of each App — that control IS the
# bootstrap's ordering mechanism (ADR-0015 and D5).
# A19: no schema defaults declared; prune is OMITTED.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  labels:
    aegis.dev/part-of: aegis-platform   # A18: NEVER app.kubernetes.io/part-of
spec:
  project: aegis-bootstrap
  source:
    repoURL: git@github.com:__GH_OWNER__/__PLATFORM_REPO__.git
    targetRevision: main
    path: k8s/argocd-apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
