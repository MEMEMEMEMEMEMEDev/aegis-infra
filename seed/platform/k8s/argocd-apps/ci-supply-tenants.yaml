# CI, supply-chain and tenant Apps (v2). Same contract as core.yaml.
# The init decides the ORDER in which they are enabled (phases 40-80);
# kyverno-policies is THE LAST one (D5 — H-7 encoded).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: registry
  namespace: argocd
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  project: aegis-platform
  source:
    repoURL: git@github.com:__GH_OWNER__/__PLATFORM_REPO__.git
    targetRevision: main
    path: k8s/base/registry-system
  destination: {server: https://kubernetes.default.svc, namespace: registry-system}
  syncPolicy:
    automated: {selfHeal: true}
    syncOptions: [ServerSideApply=true, CreateNamespace=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins-secrets
  namespace: argocd
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  project: aegis-platform
  source:
    repoURL: git@github.com:__GH_OWNER__/__PLATFORM_REPO__.git
    targetRevision: main
    path: k8s/base/platform/jenkins-secrets
  destination: {server: https://kubernetes.default.svc, namespace: jenkins-system}
  syncPolicy:
    automated: {selfHeal: true}
    syncOptions: [ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  project: aegis-platform
  sources:
    - repoURL: https://charts.jenkins.io
      chart: jenkins
      targetRevision: 5.9.29
      helm:
        releaseName: jenkins
        valueFiles: [$values/k8s/base/platform/jenkins/values.yaml]
    - repoURL: git@github.com:__GH_OWNER__/__PLATFORM_REPO__.git
      targetRevision: main
      ref: values
  destination: {server: https://kubernetes.default.svc, namespace: jenkins-system}
  syncPolicy:
    automated: {selfHeal: true}
    syncOptions: [ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-system
  namespace: argocd
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  project: aegis-platform
  source:
    repoURL: git@github.com:__GH_OWNER__/__PLATFORM_REPO__.git
    targetRevision: main
    path: k8s/base/trivy-system
  destination: {server: https://kubernetes.default.svc, namespace: trivy-system}
  syncPolicy:
    automated: {selfHeal: true}
    syncOptions: [ServerSideApply=true, CreateNamespace=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-server
  namespace: argocd
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  project: aegis-platform
  sources:
    - repoURL: https://aquasecurity.github.io/helm-charts
      chart: trivy
      targetRevision: 0.24.0
      helm:
        releaseName: trivy
        valueFiles: [$values/k8s/base/platform/trivy-server/values.yaml]
    - repoURL: git@github.com:__GH_OWNER__/__PLATFORM_REPO__.git
      targetRevision: main
      ref: values
  destination: {server: https://kubernetes.default.svc, namespace: trivy-system}
  syncPolicy:
    automated: {selfHeal: true}
    syncOptions: [ServerSideApply=true]
---
# HERE LIVED the argocd-image-updater Application, retired in #59.
#
# Its last consumer was the canary, and it left in #57. Generated
# organizations are born deploying by DIGEST, written by their own
# pipeline, so the component was left with nobody to serve. It is not
# kept "just in case": a component that runs and serves nobody is
# attack surface and noise (I4).
#
# What replaced it is better and not merely different: the pipeline
# that BUILT the image already knows its digest and writes it into
# git. The updater had to rediscover it by polling the registry, with
# a poller that hangs and a write-back that may never land.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-base
  namespace: argocd
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  project: aegis-platform
  source:
    repoURL: git@github.com:__GH_OWNER__/__PLATFORM_REPO__.git
    targetRevision: main
    path: k8s/base/kyverno
  destination: {server: https://kubernetes.default.svc, namespace: kyverno}
  syncPolicy:
    automated: {selfHeal: true}
    syncOptions: [ServerSideApply=true, CreateNamespace=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  project: aegis-platform
  sources:
    - repoURL: https://kyverno.github.io/kyverno
      chart: kyverno
      targetRevision: 3.8.1
      helm:
        releaseName: kyverno
        valueFiles: [$values/k8s/base/platform/kyverno/values.yaml]
    - repoURL: git@github.com:__GH_OWNER__/__PLATFORM_REPO__.git
      targetRevision: main
      ref: values
  destination: {server: https://kubernetes.default.svc, namespace: kyverno}
  syncPolicy:
    automated: {selfHeal: true}
    # ServerSideApply: kyverno's CRDs are bigger than the 256 KiB the
    # last-applied annotation may hold — a client-side PATCH fails with
    # "metadata.annotations: Too long" and the App stays OutOfSync with
    # every sync SyncFailed (first clean instance, 2026-08-27; at home
    # the CRDs had been CREATED once and never patched).
    syncOptions: [ServerSideApply=true]
  # The API server writes `conversion: {strategy: None}` into every CRD
  # that declares no conversion; the chart's policies.kyverno.io CRDs
  # declare none, and ArgoCD's server-side diff reports that default
  # as drift forever (eight CRDs OutOfSync after a Succeeded sync, on
  # the first clean instance). Ignored on CRDs only, and only that
  # field: a real change to a CRD's schema still shows.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers: [/spec/conversion]
---
# THE LAST one enabled (D5): Enforce only with a signature in place.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  project: aegis-platform
  source:
    repoURL: git@github.com:__GH_OWNER__/__PLATFORM_REPO__.git
    targetRevision: main
    path: k8s/base/kyverno-policies
  destination: {server: https://kubernetes.default.svc, namespace: kyverno}
  # H7 run #15 (deterministic BLOCKER): the Kyverno webhook injects
  # ~9 DEFAULT fields when admitting the ClusterPolicy (admission,
  # emitWarning, validationFailureAction:Audit —cosmetic: the real
  # Enforce is the rule's failureAction—, skipBackgroundRequests,
  # required/useCache/verifyDigest, signatureAlgorithm in entry and
  # keys) → a desired-vs-live diff that NEVER closes → eternal
  # OutOfSync → the gate anchored to Synced died at 300s with
  # op=Succeeded. CANONICAL upstream fix (documented Kyverno↔ArgoCD
  # friction): ignore the defaulting paths +
  # RespectIgnoreDifferences=true (without the syncOption the ignore
  # only affects the DIFF, not the apply). The defaults are NOT baked
  # into the seed (the operator's d8e2940 workaround): every Kyverno
  # version may ADD defaults and the seed would end up married to the
  # exact version — this covers the whole family. The fields git DOES
  # declare (background, failureAction, imageReferences, publicKeys,
  # failurePolicy) are NOT on the list: their drift is still detected.
  ignoreDifferences:
    - group: kyverno.io
      kind: ClusterPolicy
      jqPathExpressions:
        - .spec.admission
        - .spec.emitWarning
        - .spec.validationFailureAction
        - .spec.rules[].skipBackgroundRequests
        - .spec.rules[].validationFailureAction?
        - .spec.rules[].verifyImages[]?.validationFailureAction
        - .spec.rules[].verifyImages[]?.required
        - .spec.rules[].verifyImages[]?.useCache
        - .spec.rules[].verifyImages[]?.verifyDigest
        - .spec.rules[].verifyImages[]?.signatureAlgorithm
        - .spec.rules[].verifyImages[]?.attestors[]?.entries[]?.signatureAlgorithm
        - .spec.rules[].verifyImages[]?.attestors[]?.entries[]?.keys.signatureAlgorithm
  syncPolicy:
    automated: {selfHeal: true}
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: org-canary
  namespace: argocd
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  project: aegis-platform
  source:
    repoURL: git@github.com:__GH_OWNER__/__PLATFORM_REPO__.git
    targetRevision: main
    path: k8s/organizations/org-canary
  destination: {server: https://kubernetes.default.svc, namespace: org-canary}
  syncPolicy:
    automated: {selfHeal: true}
    syncOptions: [ServerSideApply=true, CreateNamespace=true]
# The canary's App (hello-aegis) is NOT declared here: it lives in
# k8s/organizations/org-canary/bundle.yaml, nested under the org-canary
# App like every tenant's (ADR-0004/7). Until 2026-08-27 a second copy
# stood here — from the day phase 70 synced an App nobody declared —
# and the two drifted apart: the first clean instance showed root
# OutOfSync with "Application/hello-aegis is part of applications
# argocd/root and org-canary". One object, one owner.
