# ╔══════════════════════════════════════════════════════════════════╗
# ║  GENERADO POR `aegis org` — NO EDITAR A MANO                     ║
# ╚══════════════════════════════════════════════════════════════════╝
# Una Application por CONTRATO en orgs/. Se rederiva ENTERA en cada
# `bin/aegis-org aplicar`: agregar una organización es escribir su
# contrato y nada más.
#
# VACÍO EN LA SEED: una instancia recién arrancada no tiene ninguna
# organización. La primera aparece cuando alguien escriba su contrato:
#
#     $EDITOR orgs/mi-org.yaml
#     bin/aegis-org aplicar orgs/mi-org.yaml
#     bin/aegis-sync root
#
# Si más adelante hiciera falta conservar una organización ANTERIOR al
# generador, va en un archivo aparte al lado (tenants-heredados.yaml) y
# a mano: mezclarla acá haría que la próxima corrida la borrara sin
# decir nada.
#
# Lo que el generador emite por organización:
#
#   project: aegis-organizaciones   NO aegis-platform. Esta App despliega
#                                   el SUSTRATO de una organización
#                                   —namespace, cuota, red, secretos— y
#                                   eso es un tercer tipo: ni plataforma
#                                   ni inquilino. Su proyecto acota el
#                                   cluster-scoped a `Namespace` y le
#                                   busca huérfanos (#47).
#   CreateNamespace=true            el Namespace está en el bundle, pero
#                                   ArgoCD necesita que exista para
#                                   aplicarle el resto: sin esto hay una
#                                   carrera en el primer sync.
#   ignoreDifferences               SOLO `.status` de cada
#                                   volumeClaimTemplate de un
#                                   StatefulSet: es estado observado, no
#                                   hay forma de declararlo, y sin esto
#                                   una organización con base de datos
#                                   queda OutOfSync para siempre.
#
#                                   Y NO se ignora la imagen. Ese es el
#                                   otro atajo y APAGA el auto-sync
#                                   (#36): si la única diferencia es la
#                                   imagen y la imagen está ignorada,
#                                   ArgoCD no ve nada que hacer y nada
#                                   se despliega, con la app en verde.
#                                   No hace falta porque todo lo que
#                                   genera va POR DIGEST.
#
# RECORDATORIO: root NO tiene automated (ADR-0012). Agregar una App acá
# no la crea sola — hay que sincronizar root:  bin/aegis-sync root
