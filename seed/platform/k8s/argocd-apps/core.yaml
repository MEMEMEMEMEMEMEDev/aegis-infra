# Base-plane Apps v2 (multi-doc by area). Shared conventions:
# ServerSideApply=true; selfHeal=true EXCEPT for argocd-self
# (ADR-0012); prune OMITTED (A19); aegis.dev/* labels (A18). The
# repoURL uses __GH_OWNER__/__PLATFORM_REPO__ placeholders that
# phase 10 of the init replaces along with the .sops.yaml (TODO E10:
# unify placeholder templating into a single init step).
---
# argocd-secrets BEFORE argocd (ADR-0015): KSOPS + generator with an
# EXPLICIT LIST (A7) — files: ops-stack-repo, github-webhook,
# hello-aegis-repo (READ-ONLY since #59), ca-trust cert.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-secrets
  namespace: argocd
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  project: aegis-platform
  source:
    repoURL: git@github.com:__GH_OWNER__/__PLATFORM_REPO__.git
    targetRevision: main
    path: k8s/base/platform/argocd-secrets
  destination: {server: https://kubernetes.default.svc, namespace: argocd}
  syncPolicy:
    automated: {selfHeal: true}
    syncOptions: [ServerSideApply=true]
---
# argocd self: NO automated and NO finalizer (ADR-0012). Multi-source
# $values; ignoreDifferences for the runtime keys.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  project: aegis-platform
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 9.5.20
      helm:
        releaseName: argocd          # adoption contract (phase 30)
        valueFiles: [$values/k8s/base/platform/argocd/values.yaml]
    - repoURL: git@github.com:__GH_OWNER__/__PLATFORM_REPO__.git
      targetRevision: main
      ref: values
  destination: {server: https://kubernetes.default.svc, namespace: argocd}
  syncPolicy:
    syncOptions: [ServerSideApply=true]
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: argocd-secret
      jsonPointers: [/data]          # server.secretkey etc., runtime
---
