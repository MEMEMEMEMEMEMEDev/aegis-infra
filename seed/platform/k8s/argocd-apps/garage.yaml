# El almacenamiento S3 compartido de la plataforma.
#
# Archivo aparte de core.yaml porque no es bootstrap: el cluster se
# recupera sin esto. Y aparte de tenants.yaml porque no es de ninguna
# organización — lo comparten todas.
#
# ORDEN: depende de que exista el registry (para pullear la imagen) y de
# que Kyverno esté arriba (garage-system está en la zona de enforce). Las
# dos son Apps de core/ci-supply, que el operador sincroniza antes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garage
  namespace: argocd
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  project: aegis-platform
  source:
    repoURL: git@github.com:__GH_OWNER__/__PLATFORM_REPO__.git
    targetRevision: main
    path: k8s/base/garage-system
  destination: {server: https://kubernetes.default.svc, namespace: garage-system}
  syncPolicy:
    automated: {selfHeal: true}
    syncOptions: [ServerSideApply=true, CreateNamespace=true]
  ignoreDifferences:
    # El apiserver agrega un bloque `status` DENTRO del
    # volumeClaimTemplate. Es estado observado, no configuración: no hay
    # forma de declararlo y sin esto la App queda OutOfSync para siempre.
    #
    # El alcance es lo más angosto posible: SOLO .status de esas
    # entradas. NO todo /spec/volumeClaimTemplates, que es el atajo
    # habitual y taparía un cambio de tamaño o de accessMode.
    #
    # Y NO se ignora la imagen: va por digest, así que la mutación de
    # Kyverno es un no-op y no hay deriva que ignorar. Ignorarla es lo
    # que apaga el auto-sync (#36).
    - group: apps
      kind: StatefulSet
      name: garage
      jqPathExpressions:
        - '.spec.volumeClaimTemplates[]?.status'
