# The platform's shared S3 storage.
#
# A separate file from core.yaml because it is not bootstrap: the
# cluster recovers without it. And separate from tenants.yaml because
# it belongs to no organization — every one of them shares it.
#
# ORDER: it depends on the registry existing (to pull the image) and on
# Kyverno being up (garage-system sits in the enforce zone). Both are
# core/ci-supply Apps, which the operator syncs first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garage
  namespace: argocd
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  project: aegis-platform
  source:
    repoURL: git@github.com:__GH_OWNER__/__PLATFORM_REPO__.git
    targetRevision: main
    path: k8s/base/garage-system
  destination: {server: https://kubernetes.default.svc, namespace: garage-system}
  syncPolicy:
    automated: {selfHeal: true}
    syncOptions: [ServerSideApply=true, CreateNamespace=true]
  ignoreDifferences:
    # The apiserver adds a `status` block INSIDE the
    # volumeClaimTemplate. It is observed state, not configuration:
    # there is no way to declare it, and without this the App stays
    # OutOfSync forever.
    #
    # The scope is as narrow as it gets: ONLY the .status of those
    # entries. NOT the whole /spec/volumeClaimTemplates, which is the
    # usual shortcut and would hide a size or accessMode change.
    #
    # And the image is NOT ignored: it goes by digest, so Kyverno's
    # mutation is a no-op and there is no drift to ignore. Ignoring it
    # is what switches off auto-sync (#36).
    - group: apps
      kind: StatefulSet
      name: garage
      jqPathExpressions:
        - '.spec.volumeClaimTemplates[]?.status'
