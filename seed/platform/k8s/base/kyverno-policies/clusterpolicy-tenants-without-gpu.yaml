# tenants-without-gpu — an organization does not reach the GPU unless the
# platform hands it one.
#
# MEASURED 2026-09-25 on the home instance (org-canary, enforce=restricted,
# signed image), two ways in and both open:
#
#   1. `nvidia.com/gpu: 1` in a container's limits. No quota named the
#      resource, so the apiserver admitted it and the device plugin (time
#      slicing, 2 replicas) would have handed over a slice of the card.
#   2. WITHOUT asking for anything: `runtimeClassName: nvidia` plus
#      `NVIDIA_VISIBLE_DEVICES=all` in the pod's env. The NVIDIA runtime
#      honours that variable for unprivileged containers by default
#      (`accept-nvidia-visible-devices-envvar-when-unprivileged = true`),
#      and the pod listed /dev/nvidia0, /dev/nvidiactl and /dev/nvidia-uvm:
#      the whole card, invisible to the scheduler and to every quota.
#
# Restricted PSS does not look at runtimeClassName, and the signature
# policy only looks at the image. Hence one rule per way in, each with a
# message that names what was refused.
#
# WHY `runtimeClassName` ALONE CLOSES WAY 2. The node's default runtime is
# runc: without the nvidia runtime class the NVIDIA hook never runs, and the
# variable is just a string. The env rule is still here because the variable
# is the half a reviewer recognises, and a refusal that names it teaches.
#
# SCOPE: `org-*`, the namespaces of organizations. NOT the `aegis-tenants`
# label: ai-system carries it too, and ai-system is the platform's own GPU
# lane.
#
# THE ONE DOOR (2026-09-25, check 248): a contract's `gpu: true` labels
# the organization's Namespace `aegis.dev/gpu-otorgada: "true"`. The
# Namespace is the platform's (cluster-scoped: a tenant's repo cannot
# write it), so that label is the grant. In a granted namespace the first
# two rules step aside and `granted-runtime-asks-for-the-card` takes over:
# the nvidia runtime is allowed only on a pod whose every container asks
# the device plugin for `nvidia.com/gpu`. That keeps the quota (ONE card)
# counting it, and the device plugin's own NVIDIA_VISIBLE_DEVICES
# overrides whatever an image's ENV carries. The env rule has no
# exception anywhere.
#
# allowExistingViolations: false, DECLARED. Kyverno defaults it to true,
# which lets a pod that already holds the card be updated in place; and a
# field Kyverno fills that the manifest does not name is a field ArgoCD
# reports as drift forever (measured at home the day this landed; the
# App's ignore list only knew the verifyImages defaults).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: tenants-without-gpu
  labels:
    aegis.dev/part-of: aegis-platform
    aegis.dev/component: policy-enforcement
  annotations:
    pod-policies.kyverno.io/autogen-controllers: DaemonSet,Deployment,Job,StatefulSet,CronJob
spec:
  webhookConfiguration:
    failurePolicy: Fail
  background: true
  rules:
    - name: no-runtime-class
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["org-*"]
      exclude:
        any:
          - resources:
              namespaceSelector:
                matchLabels:
                  aegis.dev/gpu-otorgada: "true"
      validate:
        allowExistingViolations: false
        failureAction: Enforce
        message: >-
          an organization's pod does not choose its runtime: runtimeClassName
          is refused (the nvidia class hands over the whole GPU)
        pattern:
          spec:
            X(runtimeClassName): "null"
    - name: no-gpu-resource
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["org-*"]
      exclude:
        any:
          - resources:
              namespaceSelector:
                matchLabels:
                  aegis.dev/gpu-otorgada: "true"
      validate:
        allowExistingViolations: false
        failureAction: Enforce
        message: >-
          an organization's pod does not ask for nvidia.com/gpu: the GPU is
          handed over by the platform, not requested from a repo
        pattern:
          spec:
            containers:
              - =(resources):
                  =(limits):
                    X(nvidia.com/gpu): "null"
                  =(requests):
                    X(nvidia.com/gpu): "null"
            =(initContainers):
              - =(resources):
                  =(limits):
                    X(nvidia.com/gpu): "null"
                  =(requests):
                    X(nvidia.com/gpu): "null"
    - name: granted-runtime-is-nvidia
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["org-*"]
              namespaceSelector:
                matchLabels:
                  aegis.dev/gpu-otorgada: "true"
      validate:
        allowExistingViolations: false
        failureAction: Enforce
        message: >-
          the only runtime an organization with the GPU granted may use is
          nvidia, and the platform writes it
        pattern:
          spec:
            =(runtimeClassName): "nvidia"
    - name: granted-runtime-asks-for-the-card
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["org-*"]
              namespaceSelector:
                matchLabels:
                  aegis.dev/gpu-otorgada: "true"
      validate:
        allowExistingViolations: false
        failureAction: Enforce
        message: >-
          a pod on the nvidia runtime asks for nvidia.com/gpu in every
          container: otherwise it sees the card without the quota counting it
        pattern:
          spec:
            (runtimeClassName): "nvidia"
            containers:
              - resources:
                  limits:
                    nvidia.com/gpu: "?*"
    - name: no-nvidia-env
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["org-*"]
      validate:
        allowExistingViolations: false
        failureAction: Enforce
        message: >-
          an organization's pod does not set NVIDIA_* variables: with the
          nvidia runtime they expose the GPU without asking the scheduler
        pattern:
          spec:
            containers:
              - =(env):
                  - name: "!NVIDIA_*"
            =(initContainers):
              - =(env):
                  - name: "!NVIDIA_*"
            =(ephemeralContainers):
              - =(env):
                  - name: "!NVIDIA_*"
