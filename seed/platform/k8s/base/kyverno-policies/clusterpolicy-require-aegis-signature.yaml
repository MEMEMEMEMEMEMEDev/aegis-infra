# ClusterPolicy verifyImages v2 — Enforce of cosign signatures.
# THE WHOLE 3.E DESIGN baked in (A44):
#  - GA ClusterPolicy, NOT ImageValidatingPolicy (IVP forces Sigstore
#    TUF online — it fails offline; review on every upgrade).
#  - failurePolicy Fail WITHOUT matchConditions (they break the
#    mutation→validation flow: "missing digest"). The blast radius is
#    narrowed by the NATIVE config.webhooks.namespaceSelector (chart
#    values) — ALWAYS check the generated webhookconfigurations.
#  - mutateDigest true: the mutation verifies + rewrites to digest +
#    annotation; the validation demands it. REQUIRED for Enforce.
#  - Kyverno down: a graceful stop removes the webhooks (no
#    disruption); a hard crash leaves them => tenants are REJECTED
#    (real fail-closed).
# BOOTSTRAP ORDER (D5/H-7) — a MECHANISM, not a comment (run
# #12): this file is NOT listed in the kustomization (it is born with
# resources: []); phase 80 adds it IN THE SAME COMMIT that injects
# the real pub. Before, the automated App applied it with the
# placeholder from phase 35 on → the EVALUATION crashed (invalid key +
# unsigned image) and failurePolicy=Fail rejected the canary of the 70
# even though the action was Audit. Do NOT list it statically (check
# 39 watches for that). The COSIGN_PUB placeholder (with dunders,
# below in publicKeys) is injected by phase 80 (the pub does not exist
# until the cosign ceremony).
# CR-1 run #14: this comment does NOT write the literal placeholder
# — the global replace() dumped it HERE too and broke the top-level
# YAML; inject_placeholder ignores comments and check 48 forbids the
# literal inside comments (double defence).
# Facts about THIS version of Kyverno (verified live, #12):
#  - failurePolicy goes in spec.webhookConfiguration.failurePolicy;
#    spec.failurePolicy is deprecated and the API REJECTS it
#    (Forbidden).
#  - admission:false + background:false at the same time is FORBIDDEN
#    — there is no "turn the policy off" by patch; the way for it not
#    to apply is for it NOT TO EXIST (this pattern).
# failurePolicy=Fail is KEPT: it is the deliberate fail-closed (A44,
# blast radius narrowed by the webhook's namespaceSelector); external
# dependencies are resolved by ORDER (only coming into existence once
# the key/signature exist), not by weakening the gate with Ignore.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-aegis-signature
  labels:
    aegis.dev/part-of: aegis-platform
    aegis.dev/component: policy-enforcement
  annotations:
    # Autogen WITHOUT ReplicaSet or ReplicationController (Kyverno's
    # default includes them).
    #
    # Turning the background scan on left 4 permanent reds, and all
    # four were OLD ReplicaSets scaled to 0: two with images that were
    # never signed (main-000002, main-000005) and two with images that
    # no longer even exist in the registry. None of them runs anything.
    #
    # It is true information —if somebody rolled back to those
    # revisions, they would not start— but it is the same disease as
    # the permanent OutOfSync: four reds that never change train the
    # eye to ignore the report, and the real finding gets lost in the
    # noise. The policy exists to govern what RUNS.
    #
    # It does NOT weaken the gate, and this was verified:
    #  - A `rollout undo` modifies the DEPLOYMENT, still in the list.
    #  - A ReplicaSet created by hand with an unsigned image creates
    #    Pods, and Pods are evaluated all the same (pods WITH an owner
    #    are evaluated: the portfolio's has an owner and is annotated).
    # That is: what does not run is taken out of the REPORT, not out of
    # ENFORCEMENT.
    pod-policies.kyverno.io/autogen-controllers: DaemonSet,Deployment,Job,StatefulSet,CronJob
spec:
  webhookConfiguration:
    failurePolicy: Fail
  # background: true — it settles debt #103, and not as a cosmetic
  # improvement.
  #
  # WHAT IT FIXES. PolicyReports were generated ONLY on admission. A
  # pod that skips admission does not produce a report in red: it
  # produces NONE. And "there is no report" cannot be seen — looking at
  # the list of reports, everything was green.
  #
  # It really happened on 2026-07-27: after the power cut, the
  # hello-aegis pod was created 3 seconds after the admission
  # controller went Ready and ended up WITHOUT the
  # kyverno.io/verify-images annotation. It ran for 14 hours without
  # the policy ever having evaluated it, without a single error
  # anywhere. failurePolicy is Fail, so it was not a webhook that was
  # down —that would have rejected the pod—: it was that Kyverno serves
  # admission before it finishes loading its policies.
  #
  # With background, Kyverno re-evaluates what is ALREADY running, so a
  # resource that escaped admission shows up in red on the next sweep.
  # It turns an invisible absence into a report.
  #
  # WHY NOT PREVENT INSTEAD OF DETECT. Prevention would mean leaving
  # the webhooks registered permanently and fail-closed. On a single
  # node that is a lock with no key: if Kyverno does not start, NOTHING
  # starts — Kyverno included. Detecting is the choice.
  #
  # It does NOT touch admission: `background` governs the scanning of
  # existing resources and only produces reports. What blocks is still
  # failureAction: Enforce.
  #
  # Requirements verified before turning it on (2026-07-28): the
  # kyverno-background-controller SA can read the regcred-kyverno
  # Secret, there is no NetworkPolicy cutting off its way out to the
  # registry, it has ca-certificates mounted, and the public key is
  # embedded here (no external dependency). Cost: it re-verifies
  # signatures periodically against the internal registry.
  background: true
  rules:
    - name: verify-aegis-signature
      match:
        any:
          - resources:
              kinds: [Pod]
              # By LABEL, not by a list of names (2026-07-27).
              # `namespaces: [org-personal]` left every new
              # organization outside the policy with no signal at all:
              # org-portafolio was created, something was deployed
              # there, and nothing warned that the boundary was not
              # there. The label is carried by each tenant's bundle, so
              # coverage is automatic.
              namespaceSelector:
                matchLabels:
                  aegis.dev/part-of: aegis-tenants
      verifyImages:
        # W-04 / R1 / PLAT-03 — DENY-BY-DEFAULT. imageReferences '*':
        # EVERY pod of a tenant namespace must be signed by the aegis
        # key. The previous allowlist by name (hello-aegis in two forms
        # of the registry) let any other image in WITHOUT verifying it
        # (P1.2: bypass through the ClusterIP form confirmed live,
        # "solved" by adding the 2nd form — enumerating forms
        # guarantees a third one). The correct invariant is that no
        # allowlist exists. The canary, signed, matches '*' and passes;
        # nginx/another-registry without a signature is rejected (the
        # negative deny-by-default gate of phase 80). '*' covers by
        # construction any form (DNS, ClusterIP, external):
        - imageReferences:
            - "*"
          failureAction: Enforce
          mutateDigest: true
          imageRegistryCredentials:
            secrets: [regcred-kyverno]
          attestors:
            - count: 1
              entries:
                - keys:
                    publicKeys: |
                      __COSIGN_PUB__
                    rekor: {ignoreTlog: true}     # offline signatures:
                    ctlog: {ignoreSCT: true}      # no Sigstore SaaS
