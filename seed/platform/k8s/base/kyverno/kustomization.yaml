# kyverno-base v2: ns + regcred (pull of signatures). Kyverno's CA
# goes through values (global.caCertificates), NOT through a
# Certificate here — the .volume+secret crashes the controllers (A44).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
generators:
  - secret-generator.yaml
