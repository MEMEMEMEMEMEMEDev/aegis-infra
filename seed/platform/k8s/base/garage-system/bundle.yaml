# garage-system — the platform's SHARED S3 storage.
#
# WHAT IT IS AND WHY IT IS SHARED. One Garage for every organization,
# with one bucket and one key pair for each. The alternative —one
# Garage per organization, which is what org-ecommerce has— spends
# 256 MiB and a PVC per tenant to serve a handful of objects, and
# multiplies by N the work of maintaining, upgrading and backing up.
# With a single real hardware node, that arithmetic does not add up.
#
# Isolation is NOT lost: in Garage permissions are per KEY-and-BUCKET.
# An organization's key can only read and write in its own bucket, and
# cannot list the others. It is less power than a full IAM, and less to
# get wrong with.
#
# WHAT GARAGE DOES NOT HAVE, which shapes how it is used:
#   - NO object versioning and no object-lock: what is deleted is gone.
#     An immutable backup CANNOT lean on this.
#   - NO server-side encryption: objects sit in plain text on a disk
#     that is not encrypted either.
# Both limitations matter more now that the disk is shared.
#
# THE CONFINEMENT, which is the reason Garage won over MinIO: the image
# is ONE static binary and nothing else — no shell, no package manager,
# no libc, no utilities. If somebody found an RCE, there is no `sh`, no
# `curl`, no `apk` to chain anything with.
---
apiVersion: v1
kind: Namespace
metadata:
  name: garage-system
  labels:
    # Kyverno ENFORCE ZONE, not ownership. Platform namespaces are
    # excluded so that a hard Kyverno crash does not block the
    # RECOVERY of the cluster (argocd, kyverno, registry, jenkins,
    # cert-manager). Garage is not needed to recover the cluster and it
    # holds third-party data: here fail-closed is the requirement, not
    # a risk. Same reasoning as ai-system.
    aegis.dev/part-of: aegis-tenants
    aegis.dev/component: garage
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: garage-system
# Garage does not talk to the Kubernetes API. Not even a token mounted.
automountServiceAccountToken: false
imagePullSecrets:
  # Pattern A: the platform provides the HOW of pulling.
  - name: regcred-internal
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: garage-system
  labels: {aegis.dev/component: garage}
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir     = "/var/lib/garage/data"
    db_engine    = "lmdb"

    # A single node: there is nobody to replicate to. Raising this
    # without adding nodes leaves Garage waiting for peers that do not
    # exist.
    replication_factor = 1

    rpc_bind_addr   = "[::]:3901"
    # A single node never speaks RPC over the network; localhost is
    # enough and avoids depending on the pod's DNS resolving at boot.
    rpc_public_addr = "127.0.0.1:3901"

    # rpc_secret and admin_token do NOT go here: they arrive through
    # GARAGE_RPC_SECRET and GARAGE_ADMIN_TOKEN from secretKeyRef. This
    # ConfigMap is readable by anyone with access to the namespace.

    [s3_api]
    s3_region     = "garage"
    api_bind_addr = "[::]:3900"
    root_domain   = ".s3.garage"

    [admin]
    api_bind_addr = "[::]:3903"
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: garage-system
  labels: {app: garage, aegis.dev/component: garage}
spec:
  # Headless: the StatefulSet needs a stable network identity and there
  # is nothing to balance with a single replica.
  clusterIP: None
  selector: {app: garage}
  ports:
    - {name: s3, port: 3900, targetPort: 3900}
    - {name: rpc, port: 3901, targetPort: 3901}
    - {name: admin, port: 3903, targetPort: 3903}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: garage-system
  labels: {app: garage, aegis.dev/component: garage}
spec:
  serviceName: garage
  # The three fields that follow are Kubernetes DEFAULTS, declared on
  # purpose. The apiserver fills them in and ArgoCD compares what is
  # declared against what is live: omitting them leaves the App
  # OutOfSync forever over fields nobody changed. They were taken from
  # the real diff of the ArgoCD API, not from guessing which they were.
  podManagementPolicy: OrderedReady
  revisionHistoryLimit: 10
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {partition: 0}
  # ONE replica, and it is not negotiable with this configuration:
  # replication_factor=1 and --single-node describe a one-node cluster.
  # Raising replicas creates pods that Garage rejects ("the cluster
  # already has other nodes").
  replicas: 1
  selector:
    matchLabels: {app: garage}
  template:
    metadata:
      labels: {app: garage, aegis.dev/component: garage}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # Without this the non-root user cannot write to the PVC.
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: garage
          # BY DIGEST. Kyverno rewrites image:tag by appending the
          # digest on admission, and with a tag in git desired != live
          # FOREVER; the obvious way out —ignoreDifferences on the
          # image— TURNS OFF auto-sync (#36). With the digest, the
          # mutation is a no-op. That is the difference with the garage
          # of org-ecommerce, which is still on the old model.
          image: registry.registry-system.svc.cluster.local:5000/garage@sha256:dac0c92add4f1a0b41035e94b41036a270ffbe88a37c7ac9c3f19e6dc5bdccf2
          # command AND args, not just args. The Garage image does NOT
          # declare an ENTRYPOINT: it ships only CMD
          # ["/garage","server"]. In Kubernetes `args` replaces CMD and
          # `command` replaces ENTRYPOINT, so setting args alone leaves
          # the pod trying to run a binary called "server" — which does
          # not exist. The symptom is StartError with "executable file
          # not found in $PATH", and it is hard to read because the
          # manifest looks fine.
          command: ["/garage"]
          # WITHOUT --default-bucket, which is the difference with the
          # per-organization model. Here buckets and keys are created
          # by each organization's provisioning Job against the admin
          # API, with material that already lives encrypted in its repo.
          args: ["server", "--single-node"]
          env:
            - name: GARAGE_CONFIG_FILE
              value: /etc/garage/garage.toml
            # BY ENVIRONMENT VARIABLE AND NOT BY FILE, even though
            # Garage supports rpc_secret_file/admin_token_file and a
            # file is usually preferable.
            #
            # The reason is a real clash between two requirements of
            # this same pod: fsGroup (needed so the non-root user can
            # write to the PVC) makes Kubernetes add the group read
            # bit to ALL volumes, leaving the Secret at 0440. Garage
            # demands exactly 0600 and refuses to start. With fsGroup
            # set there is no way to get 0600 on a Secret volume.
            #
            # The other way out was GARAGE_ALLOW_WORLD_READABLE_SECRETS,
            # and it was discarded: it turns the check off FOREVER,
            # including the time the file really is 0644. Changing the
            # mechanism is better than disabling the control.
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef: {name: garage-credentials, key: rpc_secret}
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: {name: garage-credentials, key: admin_token}
          ports:
            - {name: s3, containerPort: 3900}
            - {name: rpc, containerPort: 3901}
            - {name: admin, containerPort: 3903}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          # TCP probes on purpose: an HTTP probe would force us to
          # assume which health endpoint exists and whether it asks for
          # a token. The S3 port accepting connections is signal enough
          # and assumes nothing.
          readinessProbe:
            tcpSocket: {port: 3900}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 3900}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "1", memory: 2Gi}
          volumeMounts:
            - {name: config, mountPath: /etc/garage/garage.toml, subPath: garage.toml, readOnly: true}
            # subPath of one same PVC: it guarantees that meta/ and
            # data/ exist (Kubernetes creates them) without depending
            # on Garage to do it.
            - {name: data, mountPath: /var/lib/garage/meta, subPath: meta}
            - {name: data, mountPath: /var/lib/garage/data, subPath: data}
            # With readOnlyRootFilesystem, /tmp comes from outside.
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: garage-config}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    # apiVersion, kind and volumeMode are filled in by the apiserver by
    # default. They go DECLARED and not ignored: without them desired
    # != live forever, and the obvious way out —widening
    # `ignoreDifferences` to the whole volumeClaimTemplate— would turn
    # off auto-sync and hide a real change of size or accessMode.
    # Declaring the default is free; ignoring it costs auto-sync (#36).
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        volumeMode: Filesystem
        resources:
          # Shared across all the organizations. The ceiling per
          # organization is set by its quota, not by this number.
          #
          # CAREFUL: local-path bind-mounts a host directory and does
          # NOT impose a disk quota. This limits the DECLARED size, not
          # the USED one: a tenant can write past its bucket until it
          # fills /. It is a limitation of the provisioner and it is
          # noted in plans.yaml as well.
          requests: {storage: 20Gi}
