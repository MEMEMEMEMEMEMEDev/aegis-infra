# Network isolation of the shared storage.
#
# THE RULE THAT MATTERS: Garage does not talk to anyone OUTWARD. It is
# a store; a store opening connections to the internet has no
# legitimate use case at all and plenty of illegitimate ones. Egress is
# limited to DNS and nothing else.
#
# And ingress: ONLY to the S3 port (3900), and only from organization
# namespaces. The ADMIN API (3903) is the one that creates buckets and
# keys; whoever reaches it can grant itself permission over anybody's
# bucket. That is why its ingress is granted separately and by pod
# label, not by namespace.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: garage-system
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# S3 from the organizations. The FINE-GRAINED permission —which bucket
# each one may touch— is enforced by Garage per key; this only says who
# is allowed to get as far as talking to it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tenants-a-s3
  namespace: garage-system
spec:
  podSelector:
    matchLabels: {app: garage}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            # By LABEL and not by enumerating namespaces. Enumerating
            # is how a new organization ends up with no access and the
            # symptom is "the bucket does not answer" — an isolation
            # failure disguised as a normal state. It already happened
            # on 2026-08-03 with the AI gateway and the blog.
            matchLabels: {aegis.dev/part-of: aegis-tenants}
      ports:
        - {protocol: TCP, port: 3900}
---
# The ADMIN API, ONLY for the provisioning Jobs.
#
# With the admin one you can create keys and grant yourself access to
# the bucket of ANY organization, so this is the most sensitive rule in
# the file.
#
# THE NAMESPACE IS THE CONDITION THAT NARROWS IT, and the pod label is
# the second one. Fixed on 2026-08-08 after looking at it with "what if
# a tenant is compromised" eyes.
#
# It used to say `namespaceSelector: aegis.dev/part-of: aegis-tenants`
# plus the pod label, and the comment explained that it was granted by
# POD because "inside an organization namespace the app and its Job
# live together". That topology is NO LONGER the real one: the
# provisioning Job is generated by `aegis org` in GARAGE-SYSTEM
# (k8s/base/garage-system/aprovisionar.yaml, namespace: garage-system),
# not in the organization's namespace.
#
# With the old rule, the namespace condition was met by ANY org-* —all
# of them carry that label— and the pod one is a label the tenant
# writes in ITS OWN manifest: its AppProject forbids it ResourceQuota,
# LimitRange, Role, RoleBinding and IngressRoute, but not creating
# Pods. Which means a compromised tenant could put the label on itself
# and reach 3903 over the network.
#
# IT WAS NOT A BREACH —the admin_token lives only in garage-system and
# one namespace does not read another's Secrets— but it was
# defence-in-depth eroded away: there was ONE single thing left between
# a tenant and total control of the shared storage. Now there are two,
# and the outer one is not his to write.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-aprovisionamiento-a-admin
  namespace: garage-system
spec:
  podSelector:
    matchLabels: {app: garage}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: garage-system}
          podSelector:
            matchLabels: {aegis.dev/rol: aprovisionar-bucket}
      ports:
        - {protocol: TCP, port: 3903}
---
# The provisioning Job needs to go OUT towards Garage itself.
#
# It is not obvious and that is why it is separate: `default-deny`
# covers ALL the pods of the namespace, Jobs included, and egress
# towards a neighbouring pod is egress too. Without this rule the Job
# just waits and the symptom —a timeout— does not look like "a
# NetworkPolicy is missing".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-aprovisionamiento-egress
  namespace: garage-system
spec:
  podSelector:
    matchLabels: {aegis.dev/rol: aprovisionar-bucket}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app: garage}
      ports:
        - {protocol: TCP, port: 3903}
---
# DNS and NOTHING ELSE. Without this it does not resolve and the
# symptom does not look like the cause; with anything more, a store of
# third-party data would have a way out to the internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: garage-system
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
