# vmalert's rules — the 5 families of phase-85 §1 (deadman, b11,
# kyverno, trivy-db, cloudflared), each one its own file INSIDE a
# single ConfigMap: the victoria-metrics-alert 0.47.0 chart mounts
# ONE single `server.configMap` at /config (verified 2026-08-19
# against the chart's alert-server.yaml), and vmalert's -rule flag
# takes a glob (/config/*.yaml — vmalert/values.yaml).
# A new rule = a new key here, no magic (the spirit of A7).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmalert-reglas
  namespace: observability
  labels: {aegis.dev/part-of: aegis-platform}
data:
  # DEADMAN (design.md §4.2a): ALWAYS firing; its value is its
  # ABSENCE — if the heartbeat stops reaching the phone, the chain
  # rule→Alertmanager→bridge→ntfy→app is broken at some link.
  # The cadence of the resend lives in Alertmanager (repeat_interval
  # per profile), not here.
  deadman.yaml: |
    groups:
      - name: deadman
        interval: 1m
        rules:
          - alert: DeadmanAegis
            expr: vector(1)
            labels: {severity: heartbeat}
            annotations:
              summary: "heartbeat of the aegis platform"
              description: "If this heartbeat STOPS arriving, the alerting chain is broken at some link: vmalert, Alertmanager, the bridge or ntfy."
  # B11 FOR REAL (design.md §4.2b): the alert comes out of the real
  # TLS handshake (blackbox against the CA), not out of cert-manager's
  # metric — that one measures the Secret (the declaration), not what
  # is served; it is kept as context in the dashboards.
  b11.yaml: |
    groups:
      - name: b11-cert-servido
        rules:
          - alert: RegistryCertServidoPorExpirar
            expr: (probe_ssl_earliest_cert_expiry{job="blackbox-registry"} - time()) < 30 * 24 * 3600
            for: 30m
            labels: {severity: critical}
            annotations:
              summary: "the cert the registry SERVES expires in under 30d"
              description: "cert-manager renews the Secret at 60d but the pod does NOT restart by itself (debt B11): restart the registry pod so that it serves the renewed cert."
          - alert: RegistryProbeFalla
            expr: probe_success{job="blackbox-registry"} == 0
            for: 15m
            labels: {severity: critical}
            annotations:
              summary: "the TLS handshake against the registry fails"
              description: "blackbox cannot validate the chain against aegis' CA (or the registry does not answer). A wrong cert lands here too — that is the point."
          - alert: TrivyHealthzFalla
            expr: probe_success{job="blackbox-trivy"} == 0
            for: 15m
            labels: {severity: warning}
            annotations:
              summary: "the trivy-server's /healthz does not answer"
          # The three above compare against a value. If the SERIES
          # disappears —the blackbox pod dies, vmagent's job is
          # edited, a netpol closes— the comparison does not come out
          # false: it comes out EMPTY, and an empty alert does not
          # fire. Two of those three are critical, and one is THE B11
          # alert.
          # cloudflared and trivy-db already had their absent()
          # companion from the design; blackbox did not. That
          # asymmetry was the hole (sweep of 2026-08-22).
          - alert: BlackboxSinMedida
            expr: absent(probe_success{job="blackbox-registry"}) or absent(probe_success{job="blackbox-trivy"})
            for: 20m
            labels: {severity: critical}
            annotations:
              summary: "blackbox's probes stopped reporting"
              description: "Without these series, RegistryCertServidoPorExpirar, RegistryProbeFalla and TrivyHealthzFalla cannot fire: they are left mute, not green. Check the blackbox pod, vmagent's job and the netpols of registry-system and trivy-system."
  # Kyverno (design.md §4.2c): threshold 0 ON PURPOSE — in healthy
  # operation this number IS zero; every rejection in a tenant is
  # either an attack or a broken pipeline, both urgent. Metric and
  # label verified 2026-08-19 against
  # kyverno.io/docs/reference/metrics, and the request_allowed label
  # RE-verified against the cluster on 2026-08-22.
  #
  # THE SCOPE: Kyverno's enforce is defined BY LABEL
  # (kyverno/values.yaml: aegis.dev/part-of In [aegis-tenants]), not
  # by name prefix. This rule filtered `org-.*` and was therefore
  # blind to ai-system and garage-system, which carry the label —
  # and ai-system carries it ON PURPOSE for being reachable from the
  # internet, that is, the namespace where a rejection matters MOST.
  # It is the same class of bug that Kyverno's values documents
  # having suffered by enumerating instead of labelling, repeated on
  # the alert's side (sweep of 2026-08-22).
  kyverno.yaml: |
    groups:
      - name: kyverno-tenants
        rules:
          - alert: KyvernoAdmisionRechazadaEnTenant
            expr: sum(increase(kyverno_admission_requests_total{request_allowed="false", resource_namespace=~"org-.*|ai-system|garage-system"}[10m])) > 0
            labels: {severity: critical}
            annotations:
              summary: "admission REJECTED in a namespace under enforce"
              description: "Either an attack or a broken pipeline — both urgent. Look at which policy rejected and in which namespace."
  # Age of Trivy's DB (design.md §4.2d): the metric is derived by the
  # trivy-db-age CronJob. And the metric's ABSENCE alerts TOO: a
  # watchman of the watchman that stops measuring is a green gate
  # switched off (Disease E).
  #
  # last_over_time([2h]) AND NOT the bare metric: the CronJob pushes
  # ONCE AN HOUR and an instant query only looks 5 minutes back.
  # Without the window the metric is «absent» ~55 minutes of every
  # hour: TrivyDBVieja cannot be evaluated and TrivyDBSinMedida fires
  # every day. An alert that shouts daily stops being read, and by the
  # time it finally tells the truth nobody is looking — it is Disease
  # E from the other end, that of the chronic false positive.
  # Measured on 2026-08-22, after fixing the CronJob: the alert went
  # back to firing with the CronJob ALREADY healthy.
  trivy-db.yaml: |
    groups:
      - name: trivy-db
        rules:
          - alert: TrivyDBVieja
            expr: (time() - max(last_over_time(aegis_trivy_db_updated_timestamp_seconds[2h]))) > 48 * 3600
            for: 1h
            labels: {severity: critical}
            annotations:
              summary: "Trivy's vulnerability DB is more than 48h old"
              description: "Every «green» scan is lying in silence: the A42 pin became an act of faith. Check the trivy-server and its way out to the DB's source."
          - alert: TrivyDBSinMedida
            expr: absent(last_over_time(aegis_trivy_db_updated_timestamp_seconds[2h]))
            for: 3h
            labels: {severity: warning}
            annotations:
              summary: "the trivy-db-age CronJob stopped pushing"
              description: "With no measurement there is no watchman: check the CronJob in trivy-system and vmsingle's import endpoint."
  # cloudflared (design.md §4.2e): the signal is NOT «there was a
  # restart» (healthy reconnection in dev, intermittent network BY
  # DESIGN) but «active connections == 0 SUSTAINED». Threshold per
  # profile: dev 30m, hetzner 5m. Metric verified 2026-08-19 against
  # developers.cloudflare.com (cloudflared's metrics:
  # cloudflared_tunnel_ha_connections).
  cloudflared.yaml: |
    groups:
      - name: cloudflared
        rules:
          - alert: TunelSinConexion
            expr: max(cloudflared_tunnel_ha_connections) == 0
            for: 30m
            labels: {severity: critical}
            annotations:
              summary: "cloudflared with NOT ONE connection to the edge, sustained"
              description: "This is not a scrape gap nor a restart: the tunnel could not reconnect within the profile's window. Nothing public is reaching the cluster."
          - alert: TunelSinScrape
            expr: absent(cloudflared_tunnel_ha_connections)
            for: 30m
            labels: {severity: warning}
            annotations:
              summary: "vmagent does not see cloudflared's metrics"
              description: "Different from «tunnel down»: here the one not answering is the metrics endpoint (netpol, port, pod). With no data there is no watchman over the tunnel."
  # Scrape (sweep of 2026-08-22): the PANEL «scrape targets down»
  # existed and the alert did not. A panel is looked at when somebody
  # opens it; an alert comes looking for you. After the switch-on
  # nothing watched that vmagent went on scraping: the only thing that
  # measures it is phase 85's obs-metricas-fluyen gate, which runs
  # ONCE in its lifetime.
  #
  # The two faces, and they are different on purpose:
  #  · a target that answers badly shows up as `up == 0`.
  #  · a target that STOPS BEING DISCOVERED —its label renamed in a
  #    chart bump— does not produce `up == 0`: it produces NOTHING.
  #    That is why the second rule counts jobs against the expected
  #    number instead of looking at values.
  scrape.yaml: |
    groups:
      - name: scrape
        rules:
          - alert: TargetDeScrapeCaido
            expr: up == 0
            for: 15m
            labels: {severity: warning}
            annotations:
              summary: "a scrape target has not answered for 15m"
              description: "The job {{ $labels.job }} does not answer at {{ $labels.instance }}. Every panel and every alert that depend on those metrics are mute, not green."
          - alert: JobDeScrapeDesaparecido
            expr: count(count by (job) (up)) < __OBS_SCRAPE_JOBS_MIN__
            for: 20m
            labels: {severity: critical}
            annotations:
              summary: "vmagent discovers fewer jobs than it declares"
              description: "A job with no discovered targets does NOT produce up==0: it produces nothing, and its silence reads the same as health. Compare `count by (job) (up)` against vmagent/values.yaml's job_name entries — most likely a label renamed by a chart bump."
  # Tenants (2026-08-22). Until today not one platform alert named an
  # organization's application: shop had been alive for a day and if
  # its API had returned 500 to every customer, nothing would have
  # fired. The contract derived isolation and routing; it never had a
  # way of saying «and watch it».
  #
  # The rules are GENERIC on purpose: the target is derived by
  # `aegis org` (one sitio-<org> job per contract with a domain and a
  # public path), and these three cover it no matter how many
  # organizations there are. Adding an organization adds a target, not
  # three more alerts — otherwise every sign-up would mean editing
  # this, and nobody would.
  tenants.yaml: |
    groups:
      - name: inquilinos
        rules:
          - alert: SitioDeInquilinoCaido
            expr: probe_success{job=~"sitio-.*"} == 0
            for: 10m
            labels: {severity: critical}
            annotations:
              summary: "{{ $labels.organizacion }}: the site does not answer a customer"
              description: "The probe walks the complete path (DNS, edge, tunnel, traefik, middlewares, app) against {{ $labels.instance }} and does not get a 200. If ALL the organizations fall at once, look at TunelSinConexion first: it is the common link."
          - alert: SitioDeInquilinoSinSonda
            expr: absent(probe_success{job=~"sitio-.*"})
            for: 20m
            labels: {severity: warning}
            annotations:
              summary: "not one tenant probe is reporting"
              description: "SitioDeInquilinoCaido compares against a value: without the series it does not come out false, it comes out empty, and an empty alert does not fire. Check the blackbox pod and the derived block of vmagent/values.yaml."
          # Memory against the DECLARED CEILING, not against the
          # machine: a pod that touches its limit gets killed by the
          # kernel, even if the node has RAM to spare. The measurement
          # already existed (cAdvisor); what was missing was looking
          # at it.
          - alert: InquilinoAlLimiteDeMemoria
            expr: |
              100 * sum by (namespace) (container_memory_working_set_bytes{namespace=~"org-.*",container!=""})
                  / sum by (namespace) (container_spec_memory_limit_bytes{namespace=~"org-.*",container!=""}) > 90
            for: 15m
            labels: {severity: warning}
            annotations:
              summary: "{{ $labels.namespace }} uses more than 90% of the memory it declared"
              description: "The next step is the kernel killing a pod by OOM, and that is NOT visible as the site going down until it happens. Either the quota goes up, or the app is leaking memory."
  # Supply (2026-08-22). The template's `scan` and `sign` stages have
  # a deliberate BOOTSTRAP TOLERANCE: during phases 50-70 neither the
  # trivy-server nor cosign's key exists, and breaking the build there
  # would be preventing the start-up. The tolerance is right.
  #
  # What was wrong is that it was INVISIBLE with the platform already
  # standing. `scan_skipped:true` travelled in the event, was kept for
  # a year in vlogs-events, and the build ended GREEN. An image nobody
  # scanned, running, indistinguishable from a healthy one. It is the
  # same old disease from the record's side: the datum existed and no
  # instrument read it.
  #
  # The two faces are NOT symmetrical and that is why they go
  # separately:
  #  · with no signature, Kyverno rejects the admission and the deploy
  #    fails loudly. The alert is a notice, not a discovery.
  #  · with no scan absolutely nothing happens. That one is critical.
  #
  # A 30d window and not 2h: this is not pushed by a cron but by a
  # BUILD, and a repo can go weeks without one. The series says «this
  # image's last build», and as long as there is no other one that
  # remains the truth about what is running. When there is not even
  # that —an image deployed with no build measured at all— it is not
  # an alert's job: it is COULD NOT EVALUATE, and `aegis check`'s
  # round reports it. An alert that fires on day one, when there are
  # no builds because the platform has just been born, is the chronic
  # false red: it shouts, it gets ignored, and it stops being any use
  # for when it matters.
  suministro.yaml: |
    groups:
      - name: suministro
        rules:
          - alert: ImagenSinEscaneo
            expr: last_over_time(aegis_build_scan_skipped[30d]) == 1
            for: 15m
            labels: {severity: critical}
            annotations:
              summary: "{{ $labels.image }} was published without going through Trivy"
              description: "The last build skipped the scan (the trivy-server was not answering) and the image was pushed, signed and deployed all the same. Nothing tells it apart from a scanned one: it has to be rebuilt with the server alive. If this is a start-up in progress, it closes by itself in phase 80."
          - alert: ImagenSinFirma
            expr: last_over_time(aegis_build_sign_skipped[30d]) == 1
            for: 15m
            labels: {severity: warning}
            annotations:
              summary: "{{ $labels.image }} was published unsigned"
              description: "The last build did not find cosign's key. Unlike the scan, this is NOT silent: Kyverno rejects the admission and the deploy fails. The alert exists to name the cause before somebody debugs the rejection from scratch."
  # Images (2026-08-27). Everything above measures the BUILD: did the
  # last build scan, did it sign, how long ago. None of it measures
  # the image AFTER the build. A CVE published the week after the push
  # lands in the trivy DB and the deployed image goes on serving,
  # scanned-green in every panel, vulnerable in fact. Two Jenkins jobs
  # close that gap and push here:
  #  · image-watch (cron, once a day, one POST at the end of the run):
  #    re-scans every mirrored image against TODAY's DB, fixable only,
  #    and asks the upstream whether re-mirroring would help. A run
  #    that dies leaves no heartbeat — that IS the signal.
  #  · base-images (build cadence, like Jenkinsfile.app): rebuilds an
  #    aegis-base-* and bumps the FROM of its consumers.
  #
  # Windows: [2d] for everything image-watch pushes (2 × its daily
  # period, check 092 §8: with [1d] one late run and every series is
  # «absent»); [30d] for base-images, which is a build and can go
  # weeks without one (same policy as suministro.yaml).
  #
  # Alertmanager has ONE route, so the `info` below pages like the
  # rest. That is acceptable ON PURPOSE: each firing of it is a
  # decision the operator has to take (re-mirror or not), not noise
  # to be filed — if a day comes when it is noise, the fix is a route,
  # not deleting the alert.
  images.yaml: |
    groups:
      - name: images
        rules:
          # `for: 24h` is the rebuild window: when the watch finds a
          # fixable CVE in an aegis-base-* it triggers the rebuild the
          # same morning. A day later, still there, means one of two
          # things a loop cannot fix: the distro has not shipped the
          # fix yet, or the image is a third party's and a human has
          # to decide.
          - alert: ImageWithFixableVulns
            expr: sum by (image) (last_over_time(aegis_image_fixable_vulns[2d])) > 0
            for: 24h
            labels: {severity: warning}
            annotations:
              summary: "{{ $labels.image }} has {{ $value }} fixable CVE(s) against today's DB, a day after the watch saw them"
              description: "Fixable, not theoretical: --ignore-unfixed. For an aegis-base-* the loop already tried (base-images rebuilt it the morning it appeared): either the distro has no fix yet or the rebuild failed — check the base-images console. For a third party run `crane digest` on the upstream tag and read UpstreamFixAvailable: if it fires, re-mirroring helps; if not, the fix is not published upstream yet."
          # All three legs on the same `image`: vulnerable today, the
          # upstream tag moved, AND the candidate scans clean. Only
          # then does re-mirroring help; without the third leg it is a
          # bump for nothing.
          - alert: UpstreamFixAvailable
            expr: sum by (image) (last_over_time(aegis_image_fixable_vulns[2d])) > 0 and on (image) last_over_time(aegis_upstream_candidate_fixable_vulns[2d]) == 0 and on (image) last_over_time(aegis_upstream_moved[2d]) == 1
            for: 1h
            labels: {severity: info}
            annotations:
              summary: "{{ $labels.image }}: the upstream moved and the candidate scans clean"
              description: "Re-mirroring WILL help: the upstream tag points at a new digest and that digest has no fixable CVE. Edit images.txt (tag+digest), run mirror-images, bump the consumer. Until then ImageWithFixableVulns keeps firing for this image."
          # Not «clean»: the watch could not run trivy on this image
          # (transport, registry, scan error). A 0 in fixable_vulns
          # next to a 1 here is a zero that measured nothing.
          - alert: ImageWatchCouldNotEvaluate
            expr: last_over_time(aegis_image_watch_failed[2d]) == 1
            for: 1h
            labels: {severity: warning}
            annotations:
              summary: "image-watch COULD NOT EVALUATE {{ $labels.image }}"
              description: "COULD NOT EVALUATE ≠ clean: the watch's last run could not scan this image (pull, transport or trivy error), so its fixable count is not a measurement. Read the image-watch console for the error; the rest of the images ARE measured."
          # Build cadence, so 30d and no `for`: the series says «the
          # last rebuild of this base, seen from this consumer», and
          # until there is another rebuild that is the truth.
          - alert: BasePropagationFailed
            expr: last_over_time(aegis_base_propagation_failed[30d]) == 1
            labels: {severity: warning}
            annotations:
              summary: "{{ $labels.repo }} is still on the old {{ $labels.image }}"
              description: "The base was rebuilt and signed, but the FROM bump in this consumer repo FAILED or found nothing to bump: what it deploys is still built on the vulnerable base, and nothing in its own pipeline will say so. Check the base-images console for {{ $labels.repo }}; the fix is the bump (by hand if need be) and a build."
          # One series per exception id; when there are no exceptions
          # there is no series, and that is health. Negative = already
          # expired — it stays under the threshold until somebody
          # removes the entry.
          - alert: TrivyIgnoreExpiring
            expr: last_over_time(aegis_trivyignore_expires_in_seconds[2d]) < 30 * 86400
            labels: {severity: warning}
            annotations:
              summary: "trivyignore exception {{ $labels.id }} expires in under 30d"
              description: "Re-measure the exception (its statement in trivyignore.yaml says how it was justified and what would close it) or let it expire. When it does, the next mirror run and the next watch both go red ON PURPOSE: an exception nobody re-read is a CVE nobody looks at."
          # The guard of the four above (check 092 §5): each `or
          # absent()` is over a series the watch pushes on EVERY run,
          # so the disappearance of any of them means the run did not
          # finish — and with the series gone the comparing alerts do
          # not go false, they go empty. Phase 85 fires the job once
          # at birth, so on this instance «silent» means «stopped»,
          # never «not yet».
          - alert: ImageWatchSilent
            expr: absent(last_over_time(aegis_image_watch_timestamp_seconds[2d])) or absent(last_over_time(aegis_image_fixable_vulns[2d])) or absent(last_over_time(aegis_image_watch_failed[2d]))
            for: 1h
            labels: {severity: critical}
            annotations:
              summary: "image-watch did not leave its daily heartbeat"
              description: "The daily job did not push in the last two days: the cron is gone from job-dsl, the job is broken, or vmsingle rejected the POST. Without it ImageWithFixableVulns, UpstreamFixAvailable and ImageWatchCouldNotEvaluate are mute, not green — and what is running has not been re-scanned since the last heartbeat. Phase 85 fires it once at birth: silent means stopped, not «not yet»."
  backups.yaml: |
    groups:
      # ── the off-site copy ─────────────────────────────────────────
      # These read what the backup timer publishes right after every
      # capture. The three of them are one instrument split in three
      # because the three failures are different and want different
      # answers: the copy got old, the MEASUREMENT stopped, and there
      # is no copy at all. A single rule for all three would send the
      # operator looking for a backup when the problem is a network,
      # or the other way round.
      - name: backups
        rules:
          # Every read is wrapped in last_over_time[2d], and that is
          # not style: this producer publishes ONCE PER CADENCE, up to
          # 24h apart, and an instant query's default window is far
          # shorter. Written bare, these three alerts fall between two
          # pushes and return empty — and empty does not fire. The
          # first version of this group was written bare, and check 092
          # said so before it ever reached an instance.
          #
          # Staleness measured against the CLOCK THAT WAS SET, not
          # against a number written here. `remote status` exports the
          # cadence it read from the machine, so an operator who moves
          # the timer to 6h moves this threshold with it. Twice the
          # cadence, because exactly one missed run is a hiccup and two
          # is a pattern.
          - alert: BackupStale
            expr: (time() - last_over_time(aegis_backup_remote_timestamp_seconds[2d])) > on() group_left() (2 * last_over_time(aegis_backup_remote_cadence_seconds[2d]))
            for: 1h
            labels: {severity: critical}
            annotations:
              summary: "org-{{ $labels.org }}: the newest off-site copy is older than two runs of the clock"
              description: "The timer either did not run or could not reach the destination for at least two cadences. Read `journalctl --user -u aegis-backup` on the host, then `aegis data remote list`. The data is NOT lost — but the copy that was meant to survive this machine is as old as this alert says."
          # A gauge nobody writes any more keeps its last value for
          # ever, so the ages above would stay young while nothing was
          # being measured. This is the rule that stops that green from
          # being a lie, and it is why the timer publishes a measured
          # timestamp separate from the copies' own.
          - alert: BackupMeasurementStopped
            expr: absent(last_over_time(aegis_backup_remote_measured_timestamp_seconds[7d])) or absent(last_over_time(aegis_backup_remote_timestamp_seconds[7d])) or absent(last_over_time(aegis_backup_remote_cadence_seconds[7d])) or (time() - last_over_time(aegis_backup_remote_measured_timestamp_seconds[2d])) > 172800
            for: 1h
            labels: {severity: warning}
            annotations:
              summary: "nobody has measured the off-site copy in two days"
              description: "NOT the same as a stale backup: the measurement itself stopped, so BackupStale is mute rather than green. Either the timer is not running (`systemctl --user status aegis-backup.timer`), or its ExecStartPost cannot reach vmsingle. Until this clears, the age of every copy on the dashboard is the last one anybody saw, not the one there is."
          # The destination answered and there was NOTHING in it. It is
          # separated from staleness because an empty destination has
          # no age to be old: with only the rule above, an instance that
          # never managed to push a single bundle would show no series
          # and no alert at all.
          - alert: BackupNeverArrived
            expr: sum(last_over_time(aegis_backup_remote_bundles[7d])) == 0 and on() (last_over_time(aegis_backup_remote_measured_timestamp_seconds[2d]) > 0)
            for: 1h
            labels: {severity: critical}
            annotations:
              summary: "the off-site destination is reachable and EMPTY"
              description: "The measurement ran, the destination answered, and there is not one bundle in it. This is an instance whose data lives in exactly one place. Run `aegis data backup` by hand and read what it says: the usual causes are a credential that opens nothing (`aegis data remote adopt`) and a bucket that was created under another name than the one derived."
