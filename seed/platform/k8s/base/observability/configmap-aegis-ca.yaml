# aegis' root CA in PEM, so that blackbox validates the registry's
# REAL chain (phase-85 §2: a probe with insecure_skip_verify would
# give the same expiry, but would let a WRONG cert through in green —
# the same -k that P2.4 banished from phase 40).
#
# The PEM is of the generated class and is injected by the init's
# PHASE 85 with inject_placeholder (the CA does not exist until
# cert-manager issues it in phase 35) — the same pattern as
# kyverno/values.yaml's CA. This comment does NOT write the literal
# placeholder (CR-1/CR-2, check 48).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aegis-ca
  namespace: observability
  labels: {aegis.dev/part-of: aegis-platform}
data:
  ca.crt: |
    __OBS_CA_PEM__
