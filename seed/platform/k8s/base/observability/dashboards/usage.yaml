# «usage» dashboard — the question the other three do not answer.
#
# design.md §1 built two layers: the SMOKE DETECTOR (is something wrong?)
# and the BLACK BOX (what happened?). Both look at health. Neither answers
# the third question of whoever runs their own machine: HOW MUCH AM I USING
# AND HOW MUCH IS LEFT? That is capacity, and until today it had no panel.
#
# None of this required instrumenting anything: cAdvisor comes in the
# kubelet and vmagent was already scraping it since phase 85. The metrics
# were there; what was missing was looking at them.
#
# EVERY QUERY WAS TESTED AGAINST vmsingle BEFORE BEING WRITTEN. A panel
# that says «No data» is Disease E in visual form: it takes up space, it
# looks like surveillance and it measures nothing.
#
# Provisioned FROM GIT via the sidecar (grafana_dashboard label —
# design.md §4.1: none is born by clicking; editable:false in the JSON).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-consumo
  namespace: observability
  labels:
    aegis.dev/part-of: aegis-platform
    grafana_dashboard: "1"
data:
  consumo.json: |
    {
      "uid": "aegis-consumo",
      "title": "Aegis · usage",
      "description": "Capacity: how much each organization uses and how much is left on the machine. The question the smoke detector and the black box do not answer.",
      "schemaVersion": 39,
      "editable": false,
      "timezone": "browser",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "1m",
      "tags": [
        "aegis",
        "capacity"
      ],
      "panels": [
        {
          "id": 1,
          "title": "Machine memory",
          "description": "How much of the physical RAM is committed. It is the number that decides whether the seed fits on a smaller machine.",
          "type": "gauge",
          "datasource": { "type": "prometheus", "uid": "vmsingle" },
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum(container_memory_working_set_bytes{id=\"/\"}) / sum(machine_memory_bytes)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 85 }
                ]
              }
            }
          },
          "options": { "showThresholdMarkers": true, "showThresholdLabels": false }
        },
        {
          "id": 2,
          "title": "Free memory",
          "description": "What is left to bring something new up without evicting anyone.",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "vmsingle" },
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(machine_memory_bytes) - sum(container_memory_working_set_bytes{id=\"/\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 2147483648 },
                  { "color": "green", "value": 5368709120 }
                ]
              }
            }
          },
          "options": { "graphMode": "area", "colorMode": "value", "textMode": "value" }
        },
        {
          "id": 3,
          "title": "Machine CPU",
          "description": "Average of the last 5 minutes over the total number of cores.",
          "type": "gauge",
          "datasource": { "type": "prometheus", "uid": "vmsingle" },
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum(rate(container_cpu_usage_seconds_total{id=\"/\"}[5m])) / sum(machine_cpu_cores)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 90 }
                ]
              }
            }
          },
          "options": { "showThresholdMarkers": true }
        },
        {
          "id": 4,
          "title": "Disk",
          "description": "WATCH OUT: local-path does NOT enforce a disk quota. The declared size of a PVC does not stop a pod from writing until it fills the root — see plans.yaml. This is the only real brake, and it is a visual one.",
          "type": "gauge",
          "datasource": { "type": "prometheus", "uid": "vmsingle" },
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum(container_fs_usage_bytes{id=\"/\"}) / sum(container_fs_limit_bytes{id=\"/\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 75 },
                  { "color": "red", "value": 88 }
                ]
              }
            }
          },
          "options": { "showThresholdMarkers": true }
        },
        {
          "id": 5,
          "title": "Memory by organization",
          "description": "What each tenant consumes. Stacked: the total is what the organizations take out of the machine.",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "vmsingle" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 6 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace) (container_memory_working_set_bytes{namespace=~\"org-.*\",container!=\"\"})",
              "legendFormat": "{{namespace}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "fillOpacity": 35,
                "stacking": { "mode": "normal", "group": "A" },
                "lineWidth": 1,
                "showPoints": "never"
              }
            }
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "right", "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          }
        },
        {
          "id": 6,
          "title": "CPU by organization",
          "description": "In cores. A demo at rest should live close to zero: if it does not, something is spinning idle.",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "vmsingle" },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 6 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace) (rate(container_cpu_usage_seconds_total{namespace=~\"org-.*\",container!=\"\"}[5m]))",
              "legendFormat": "{{namespace}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 3,
              "custom": { "fillOpacity": 20, "lineWidth": 1, "showPoints": "never" }
            }
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "right", "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          }
        },
        {
          "id": 7,
          "title": "How much of what it declared each organization uses",
          "description": "Real usage against the ceiling declared in the manifests. Far below = the quota is oversized and that RAM cannot be lent to anyone else. Close to 100 = a candidate to be killed for memory.",
          "type": "bargauge",
          "datasource": { "type": "prometheus", "uid": "vmsingle" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 15 },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum by (namespace) (container_memory_working_set_bytes{namespace=~\"org-.*\",container!=\"\"}) / sum by (namespace) (container_spec_memory_limit_bytes{namespace=~\"org-.*\",container!=\"\"})",
              "legendFormat": "{{namespace}}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "blue", "value": null },
                  { "color": "green", "value": 40 },
                  { "color": "yellow", "value": 80 },
                  { "color": "red", "value": 92 }
                ]
              }
            }
          },
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "showUnfilled": true,
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          }
        },
        {
          "id": 8,
          "title": "Memory by subsystem",
          "description": "The whole machine, not just the tenants. This is where you see what the platform itself costs: observability, CI, GitOps, the AI engine.",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "vmsingle" },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 15 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace) (container_memory_working_set_bytes{container!=\"\",namespace!=\"\"})",
              "legendFormat": "{{namespace}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "fillOpacity": 30,
                "stacking": { "mode": "normal", "group": "A" },
                "lineWidth": 1,
                "showPoints": "never"
              }
            }
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "right", "calcs": ["lastNotNull"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          }
        },
        {
          "id": 9,
          "title": "The ten biggest memory eaters",
          "description": "Sorted. When the machine gets tight, the answer starts here.",
          "type": "table",
          "datasource": { "type": "prometheus", "uid": "vmsingle" },
          "gridPos": { "h": 10, "w": 12, "x": 0, "y": 24 },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(10, sum by (namespace, pod) (container_memory_working_set_bytes{container!=\"\"}))",
              "instant": true,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "bytes" },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Value" },
                "properties": [
                  { "id": "displayName", "value": "memory" },
                  { "id": "custom.cellOptions", "value": { "type": "gauge", "mode": "gradient" } }
                ]
              }
            ]
          },
          "transformations": [
            { "id": "organize", "options": { "excludeByName": { "Time": true } } },
            { "id": "sortBy", "options": { "fields": {}, "sort": [{ "field": "Value", "desc": true }] } }
          ],
          "options": { "showHeader": true }
        },
        {
          "id": 10,
          "title": "CPU throttling",
          "description": "Seconds per second the kernel held a container back for hitting its limit. Different from «it uses a lot of CPU»: here the pod WANTS to work and is not allowed to. If this rises, the limit was set too small — not the machine.",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "vmsingle" },
          "gridPos": { "h": 10, "w": 12, "x": 12, "y": 24 },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(10, sum by (namespace, pod) (rate(container_cpu_cfs_throttled_seconds_total{container!=\"\"}[5m])))",
              "legendFormat": "{{namespace}}/{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 3,
              "custom": { "fillOpacity": 15, "lineWidth": 1, "showPoints": "never" }
            }
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          }
        }
      ]
    }
