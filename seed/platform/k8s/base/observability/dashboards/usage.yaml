apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-consumo
  namespace: observability
  labels:
    aegis.dev/part-of: aegis-platform
    grafana_dashboard: '1'
data:
  consumo.json: "{\n  \"uid\": \"aegis-consumo\",\n  \"title\": \"Aegis · usage\",\n  \"description\": \"Capacity: how much each organization uses and how much is left on the machine. The question the smoke detector and the black box do not answer.\",\n  \"schemaVersion\": 39,\n  \"editable\": false,\n  \"timezone\": \"browser\",\n  \"time\": {\n    \"from\": \"now-6h\",\n    \"to\": \"now\"\n  },\n  \"refresh\": \"1m\",\n  \"tags\": [\n    \"aegis\",\n    \"capacity\"\n  ],\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"title\": \"Machine memory\",\n      \"description\": \"How much of the physical RAM is committed. It is the number that decides whether the seed fits on a smaller machine.\",\n      \"type\": \"gauge\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"vmsingle\"\n      },\n      \"gridPos\": {\n        \"h\": 6,\n        \"w\": 6,\n        \"x\": 0,\n        \"y\": 0\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"100 * sum(container_memory_working_set_bytes{id=\\\"/\\\"}) / sum(machine_memory_bytes)\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percent\",\n          \"min\": 0,\n          \"max\": 100,\n          \"decimals\": 1,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"yellow\",\n                \"value\": 70\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 85\n              }\n            ]\n          }\n        }\n      },\n      \"options\": {\n        \"showThresholdMarkers\": true,\n        \"showThresholdLabels\": false\n      }\n    },\n    {\n      \"id\": 2,\n      \"title\": \"Free memory\",\n      \"description\": \"What is left to bring something new up without evicting anyone.\",\n      \"type\": \"stat\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"vmsingle\"\n      },\n      \"gridPos\": {\n        \"h\": 6,\n        \"w\": 6,\n        \"x\": 6,\n        \"y\": 0\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"sum(machine_memory_bytes) - sum(container_memory_working_set_bytes{id=\\\"/\\\"})\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"bytes\",\n          \"decimals\": 1,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"red\",\n                \"value\": null\n              },\n              {\n                \"color\": \"yellow\",\n                \"value\": 2147483648\n              },\n              {\n                \"color\": \"green\",\n                \"value\": 5368709120\n              }\n            ]\n          }\n        }\n      },\n      \"options\": {\n        \"graphMode\": \"area\",\n        \"colorMode\": \"value\",\n        \"textMode\": \"value\"\n      }\n    },\n    {\n      \"id\": 3,\n      \"title\": \"Machine CPU\",\n      \"description\": \"Average of the last 5 minutes over the total number of cores.\",\n      \"type\": \"gauge\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"vmsingle\"\n      },\n      \"gridPos\": {\n        \"h\": 6,\n        \"w\": 6,\n        \"x\": 12,\n        \"y\": 0\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"100 * sum(rate(container_cpu_usage_seconds_total{id=\\\"/\\\"}[5m])) / sum(machine_cpu_cores)\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percent\",\n          \"min\": 0,\n          \"max\": 100,\n          \"decimals\": 1,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"yellow\",\n                \"value\": 70\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 90\n              }\n            ]\n          }\n        }\n      },\n      \"options\": {\n        \"showThresholdMarkers\": true\n      }\n    },\n    {\n      \"id\": 4,\n      \"title\": \"Disk\",\n      \"description\": \"WATCH OUT: local-path does NOT enforce a disk quota. The declared size of a PVC does not stop a pod from writing until it fills the root — see plans.yaml. This is the only real brake, and it is a visual one.\",\n      \"type\": \"gauge\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"vmsingle\"\n      },\n      \"gridPos\": {\n        \"h\": 6,\n        \"w\": 6,\n        \"x\": 18,\n        \"y\": 0\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"100 * sum(container_fs_usage_bytes{id=\\\"/\\\"}) / sum(container_fs_limit_bytes{id=\\\"/\\\"})\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percent\",\n          \"min\": 0,\n          \"max\": 100,\n          \"decimals\": 1,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"yellow\",\n                \"value\": 75\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 88\n              }\n            ]\n          }\n        }\n      },\n      \"options\": {\n        \"showThresholdMarkers\": true\n      }\n    },\n    {\n      \"id\": 5,\n      \"title\": \"Memory by organization\",\n      \"description\": \"What each tenant consumes. Stacked: the total is what the organizations take out of the machine.\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"vmsingle\"\n      },\n      \"gridPos\": {\n        \"h\": 9,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 6\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"sum by (namespace) (container_memory_working_set_bytes{namespace=~\\\"org-.*\\\",container!=\\\"\\\"})\",\n          \"legendFormat\": \"{{namespace}}\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"bytes\",\n          \"custom\": {\n            \"fillOpacity\": 35,\n            \"stacking\": {\n              \"mode\": \"normal\",\n              \"group\": \"A\"\n            },\n            \"lineWidth\": 1,\n            \"showPoints\": \"never\"\n          }\n        }\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"right\",\n          \"calcs\": [\n            \"lastNotNull\",\n            \"max\"\n          ]\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      }\n    },\n    {\n      \"id\": 6,\n      \"title\": \"CPU by organization\",\n      \"description\": \"In cores. A demo at rest should live close to zero: if it does not, something is spinning idle.\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"vmsingle\"\n      },\n      \"gridPos\": {\n        \"h\": 9,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 6\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"sum by (namespace) (rate(container_cpu_usage_seconds_total{namespace=~\\\"org-.*\\\",container!=\\\"\\\"}[5m]))\",\n          \"legendFormat\": \"{{namespace}}\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"decimals\": 3,\n          \"custom\": {\n            \"fillOpacity\": 20,\n            \"lineWidth\": 1,\n            \"showPoints\": \"never\"\n          }\n        }\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"right\",\n          \"calcs\": [\n            \"lastNotNull\",\n            \"max\"\n          ]\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      }\n    },\n    {\n      \"id\": 7,\n      \"title\": \"How much of what it declared each organization uses\",\n      \"description\": \"Real usage against the ceiling declared in the manifests. Far below = the quota is oversized and that RAM cannot be lent to anyone else. Close to 100 = a candidate to be killed for memory.\",\n      \"type\": \"bargauge\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"vmsingle\"\n      },\n      \"gridPos\": {\n        \"h\": 9,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 15\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"100 * sum by (namespace) (container_memory_working_set_bytes{namespace=~\\\"org-.*\\\",container!=\\\"\\\"}) / sum by (namespace) (container_spec_memory_limit_bytes{namespace=~\\\"org-.*\\\",container!=\\\"\\\"})\",\n          \"legendFormat\": \"{{namespace}}\",\n          \"instant\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percent\",\n          \"min\": 0,\n          \"max\": 100,\n          \"decimals\": 1,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"blue\",\n                \"value\": null\n              },\n              {\n                \"color\": \"green\",\n                \"value\": 40\n              },\n              {\n                \"color\": \"yellow\",\n                \"value\": 80\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 92\n              }\n            ]\n          }\n        }\n      },\n      \"options\": {\n        \"displayMode\": \"gradient\",\n        \"orientation\": \"horizontal\",\n        \"showUnfilled\": true,\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        }\n      }\n    },\n    {\n      \"id\": 8,\n      \"title\": \"Memory by subsystem\",\n      \"description\": \"The whole machine, not just the tenants. This is where you see what the platform itself costs: observability, CI, GitOps, the AI engine.\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"vmsingle\"\n      },\n      \"gridPos\": {\n        \"h\": 9,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 15\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"sum by (namespace) (container_memory_working_set_bytes{container!=\\\"\\\",namespace!=\\\"\\\"})\",\n          \"legendFormat\": \"{{namespace}}\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"bytes\",\n          \"custom\": {\n            \"fillOpacity\": 30,\n            \"stacking\": {\n              \"mode\": \"normal\",\n              \"group\": \"A\"\n            },\n            \"lineWidth\": 1,\n            \"showPoints\": \"never\"\n          }\n        }\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"right\",\n          \"calcs\": [\n            \"lastNotNull\"\n          ]\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      }\n    },\n    {\n      \"id\": 9,\n      \"title\": \"The ten biggest memory eaters\",\n      \"description\": \"Sorted. When the machine gets tight, the answer starts here.\",\n      \"type\": \"table\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"vmsingle\"\n      },\n      \"gridPos\": {\n        \"h\": 10,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 24\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"topk(10, sum by (namespace, pod) (container_memory_working_set_bytes{container!=\\\"\\\"}))\",\n          \"instant\": true,\n          \"format\": \"table\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"bytes\"\n        },\n        \"overrides\": [\n          {\n            \"matcher\": {\n              \"id\": \"byName\",\n              \"options\": \"Value\"\n            },\n            \"properties\": [\n              {\n                \"id\": \"displayName\",\n                \"value\": \"memory\"\n              },\n              {\n                \"id\": \"custom.cellOptions\",\n                \"value\": {\n                  \"type\": \"gauge\",\n                  \"mode\": \"gradient\"\n                }\n              }\n            ]\n          }\n        ]\n      },\n      \"transformations\": [\n        {\n          \"id\": \"organize\",\n          \"options\": {\n            \"excludeByName\": {\n              \"Time\": true\n            }\n          }\n        },\n        {\n          \"id\": \"sortBy\",\n          \"options\": {\n            \"fields\": {},\n            \"sort\": [\n              {\n                \"field\": \"Value\",\n                \"desc\": true\n              }\n            ]\n          }\n        }\n      ],\n      \"options\": {\n        \"showHeader\": true\n      }\n    },\n    {\n      \"id\": 10,\n      \"title\": \"CPU throttling\",\n      \"description\": \"Seconds per second the kernel held a container back for hitting its limit. Different from «it uses a lot of CPU»: here the pod WANTS to work and is not allowed to. If this rises, the limit was set too small — not the machine.\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"vmsingle\"\n      },\n      \"gridPos\": {\n        \"h\": 10,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 24\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"topk(10, sum by (namespace, pod) (rate(container_cpu_cfs_throttled_seconds_total{container!=\\\"\\\"}[5m])))\",\n          \"legendFormat\": \"{{namespace}}/{{pod}}\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"decimals\": 3,\n          \"custom\": {\n            \"fillOpacity\": 15,\n            \"lineWidth\": 1,\n            \"showPoints\": \"never\"\n          }\n        }\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\",\n          \"calcs\": [\n            \"lastNotNull\",\n            \"max\"\n          ]\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      }\n    },\n    {\n      \"id\": 11,\n      \"title\": \"Off-site copy by organization\",\n      \"description\": \"How many bytes of each organization live at the off-site destination, published by the backup timer after every capture. It is here and not on a platform board because it is a CAPACITY number: R2's free tier is counted in bytes as well as in operations, and this is the series that says how close the instance is to paying for its own backups. A flat line is not calm: read BackupMeasurementStopped before reading this panel.\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"vmsingle\"\n      },\n      \"gridPos\": {\n        \"h\": 7,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 34\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"sum by (org) (last_over_time(aegis_backup_remote_bytes[2d]))\",\n          \"legendFormat\": \"{{org}}\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"bytes\",\n          \"min\": 0\n        },\n        \"overrides\": []\n      }\n    }\n  ]\n}\n"
