# «platform» dashboard — design.md §4.4: ArgoCD sync/drift,
# certs (served vs declared — B11), cloudflared, Kyverno.
# Provisioned FROM GIT via the sidecar (grafana_dashboard label —
# design.md §4.1: none is born by clicking; editable:false in the JSON).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-plataforma
  namespace: observability
  labels:
    aegis.dev/part-of: aegis-platform
    grafana_dashboard: "1"
data:
  plataforma.json: |
    {
      "uid": "aegis-plataforma",
      "title": "Aegis · platform",
      "description": "Layer 2 of design.md §1: the platform health that used to be checked by hand.",
      "schemaVersion": 39,
      "editable": false,
      "timezone": "browser",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "tags": [
        "aegis"
      ],
      "panels": [
        {
          "id": 1,
          "title": "ArgoCD apps out of Synced",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "vmsingle"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 6
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(argocd_app_info{sync_status!=\"Synced\"}) or vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "vmsingle"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "description": "Do git and cluster diverge?"
        },
        {
          "id": 2,
          "title": "Days to expiry of the SERVED cert (blackbox, B11)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "vmsingle"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 6
          },
          "targets": [
            {
              "refId": "A",
              "expr": "min(probe_ssl_earliest_cert_expiry{job=\"blackbox-registry\"} - time()) / 86400",
              "datasource": {
                "type": "prometheus",
                "uid": "vmsingle"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "d"
            },
            "overrides": []
          },
          "description": "A real TLS handshake against the CA — what is served, not what is declared. The cert-manager metric (the panel next to it) is context only."
        },
        {
          "id": 3,
          "title": "Days to expiry according to cert-manager (context)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "vmsingle"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 6
          },
          "targets": [
            {
              "refId": "A",
              "expr": "min(certmanager_certificate_expiration_timestamp_seconds - time()) / 86400",
              "datasource": {
                "type": "prometheus",
                "uid": "vmsingle"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "d"
            },
            "overrides": []
          },
          "description": "It measures the Secret (the declaration). If this one says 90d and the blackbox one says 30d, the registry pod is serving the old cert: THAT is debt B11."
        },
        {
          "id": 4,
          "title": "Active tunnel connections",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "vmsingle"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 6
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(cloudflared_tunnel_ha_connections)",
              "datasource": {
                "type": "prometheus",
                "uid": "vmsingle"
              },
              "legendFormat": "connections"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "description": "A SUSTAINED zero = tunnel down. Scrape gaps in dev are NOT incidents (§3.3): tell «no data» apart from «zero»."
        },
        {
          "id": 5,
          "title": "REJECTED admissions in tenants (org-*)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "vmsingle"
          },
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(kyverno_admission_requests_total{request_allowed=\"false\",resource_namespace=~\"org-.*\"}[1h])) or vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "vmsingle"
              },
              "legendFormat": "rejections/h"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "description": "In healthy operation this number IS zero. Every rejection is either an attack or a broken pipeline — both urgent."
        },
        {
          "id": 6,
          "title": "Kyverno webhook latency (p95)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "vmsingle"
          },
          "gridPos": {
            "x": 12,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum(rate(kyverno_admission_review_duration_seconds_bucket[24h])) by (le))",
              "datasource": {
                "type": "prometheus",
                "uid": "vmsingle"
              },
              "legendFormat": "p95"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "description": "It sits on the critical path of EVERY tenant pod. A 24 h window and not a 5 min one ON PURPOSE: here admissions happen at deploy time, a handful per day. With [5m] the panel was blank 99% of the time, and a panel that is always empty stops being read (audit of 2026-08-21)."
        },
        {
          "id": 7,
          "title": "Scrape targets down (up == 0)",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "vmsingle"
          },
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 24,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "up == 0",
              "datasource": {
                "type": "prometheus",
                "uid": "vmsingle"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "description": "The target knocked out by a netpol shows up HERE and not 3 days later (gate obs-metricas-fluyen)."
        }
      ],
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      }
    }
