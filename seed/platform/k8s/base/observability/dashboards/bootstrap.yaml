# Dashboard «bootstrap» — la pregunta de design.md §1 capa 1
# («¿dónde se atasca un bootstrap?») respondida en pantalla, sobre el
# gates.jsonl que la fase 85 ingesta a vlogs-events.
# Provisionado DESDE GIT via sidecar (label grafana_dashboard —
# design.md §4.1: ninguno nace a click; editable:false en el JSON).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-bootstrap
  namespace: observability
  labels:
    aegis.dev/part-of: aegis-platform
    grafana_dashboard: "1"
data:
  bootstrap.json: |
    {
      "uid": "aegis-bootstrap",
      "title": "Aegis · bootstrap",
      "description": "Capa 1 de design.md §1: el bootstrap mismo como sistema observado.",
      "schemaVersion": 39,
      "editable": false,
      "timezone": "browser",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "tags": [
        "aegis"
      ],
      "panels": [
        {
          "id": 1,
          "title": "Gates de las corridas del init (gates.jsonl)",
          "type": "logs",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "vlogs-events"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 12
          },
          "targets": [
            {
              "refId": "A",
              "expr": "_stream: {source=\"aegis-init\"}",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "vlogs-events"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "description": "La historia completa de los bootstraps: cada línea es un gate con ts, fase, resultado y duración. Responde «¿dónde se atascó el último bootstrap?»."
        },
        {
          "id": 2,
          "title": "Gates FALLADOS (todas las corridas)",
          "type": "logs",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "vlogs-events"
          },
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "expr": "_stream: {source=\"aegis-init\"} \"fail\"",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "vlogs-events"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        },
        {
          "id": 3,
          "title": "Eventos ingestados por día",
          "type": "timeseries",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "vlogs-events"
          },
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "expr": "_stream: {source=\"aegis-init\"} | stats by (_time:1d) count() filas",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "vlogs-events"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        }
      ],
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      }
    }
