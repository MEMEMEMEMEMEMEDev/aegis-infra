# «bootstrap» dashboard — the question of design.md §1 layer 1
# («where does a bootstrap get stuck?») answered on screen, over the
# gates.jsonl that phase 85 ingests into vlogs-events.
# Provisioned FROM GIT via the sidecar (grafana_dashboard label —
# design.md §4.1: none is born by clicking; editable:false in the JSON).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-bootstrap
  namespace: observability
  labels:
    aegis.dev/part-of: aegis-platform
    grafana_dashboard: "1"
data:
  bootstrap.json: |
    {
      "uid": "aegis-bootstrap",
      "title": "Aegis · bootstrap",
      "description": "Layer 1 of design.md §1: the bootstrap itself as an observed system.",
      "schemaVersion": 39,
      "editable": false,
      "timezone": "browser",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "tags": [
        "aegis"
      ],
      "panels": [
        {
          "id": 1,
          "title": "Gates of the init runs (gates.jsonl)",
          "type": "logs",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "vlogs-events"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 12
          },
          "targets": [
            {
              "refId": "A",
              "expr": "_stream: {source=\"aegis-init\"}",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "vlogs-events"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "description": "The full history of the bootstraps: every line is a gate with ts, phase, result and duration. It answers «where did the last bootstrap get stuck?»."
        },
        {
          "id": 2,
          "title": "FAILED gates (all runs)",
          "type": "logs",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "vlogs-events"
          },
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "expr": "_stream: {source=\"aegis-init\"} \"fail\"",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "vlogs-events"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        },
        {
          "id": 3,
          "title": "Events ingested per day",
          "type": "timeseries",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "vlogs-events"
          },
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "expr": "_stream: {source=\"aegis-init\"} | stats by (_time:1d) count() rows",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "vlogs-events"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        }
      ],
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      }
    }
