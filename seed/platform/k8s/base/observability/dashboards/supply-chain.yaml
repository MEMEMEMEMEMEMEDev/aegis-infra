# «supply-chain» dashboard — design.md §4.4: the
# build→digest→scan→signature events and the age of Trivy's DB.
# Provisioned FROM GIT via the sidecar (grafana_dashboard label —
# design.md §4.1: none is born by clicking; editable:false in the JSON).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-supply-chain
  namespace: observability
  labels:
    aegis.dev/part-of: aegis-platform
    grafana_dashboard: "1"
data:
  supply-chain.json: |
    {
      "uid": "aegis-supply-chain",
      "title": "Aegis · supply-chain",
      "description": "Layer 3 of design.md §1: the events that tell the story, with their 1-year retention.",
      "schemaVersion": 39,
      "editable": false,
      "timezone": "browser",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "tags": [
        "aegis"
      ],
      "panels": [
        {
          "id": 1,
          "title": "Age of Trivy's DB (hours)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "vmsingle"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 6
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(time() - max(last_over_time(aegis_trivy_db_updated_timestamp_seconds[2h]))) / 3600",
              "datasource": {
                "type": "prometheus",
                "uid": "vmsingle"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "h"
            },
            "overrides": []
          },
          "description": "The watcher of the watcher: past 48h, every «green» scan lies in silence (alert TrivyDBVieja)."
        },
        {
          "id": 2,
          "title": "trivy /healthz (probe_success)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "vmsingle"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 6
          },
          "targets": [
            {
              "refId": "A",
              "expr": "probe_success{job=\"blackbox-trivy\"}",
              "datasource": {
                "type": "prometheus",
                "uid": "vmsingle"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        },
        {
          "id": 3,
          "title": "Supply-chain events (AEGIS_EVENT)",
          "type": "logs",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "vlogs-events"
          },
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 24,
            "h": 12
          },
          "targets": [
            {
              "refId": "A",
              "expr": "_stream: {source=~\"jenkins-.*\"}",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "vlogs-events"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "description": "The build→digest→scan→signature traceability, from BOTH producers: the application builds (jenkins-build) and the third-party image mirror (jenkins-mirror). EVENT identity, never a metric label (design.md §2)."
        },
        {
          "id": 4,
          "title": "Builds per day",
          "type": "timeseries",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "vlogs-events"
          },
          "gridPos": {
            "x": 0,
            "y": 18,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "_stream: {source=~\"jenkins-.*\"} | stats by (_time:1d) count() builds",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "vlogs-events"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        },
        {
          "id": 5,
          "title": "Did anyone scan it?",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "vmsingle"
          },
          "gridPos": {
            "x": 0,
            "y": 26,
            "w": 8,
            "h": 6
          },
          "targets": [
            {
              "refId": "A",
              "expr": "last_over_time(aegis_build_scan_skipped[30d])",
              "legendFormat": "{{image}}",
              "instant": true,
              "datasource": {
                "type": "prometheus",
                "uid": "vmsingle"
              }
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "scanned",
                      "color": "green",
                      "index": 0
                    },
                    "1": {
                      "text": "NOT SCANNED",
                      "color": "red",
                      "index": 1
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "description": "Did the last build of each image go through Trivy? The stage tolerates the server being absent (bootstrap, phases 50-70) and stays green: without this panel that tolerance was invisible. Alert ImagenSinEscaneo."
        },
        {
          "id": 6,
          "title": "Did anyone sign it?",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "vmsingle"
          },
          "gridPos": {
            "x": 8,
            "y": 26,
            "w": 8,
            "h": 6
          },
          "targets": [
            {
              "refId": "A",
              "expr": "last_over_time(aegis_build_sign_skipped[30d])",
              "legendFormat": "{{image}}",
              "instant": true,
              "datasource": {
                "type": "prometheus",
                "uid": "vmsingle"
              }
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "signed",
                      "color": "green",
                      "index": 0
                    },
                    "1": {
                      "text": "UNSIGNED",
                      "color": "orange",
                      "index": 1
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "description": "Unlike the scan, this one is NOT silent: Kyverno rejects the admission. The panel exists to name the cause before debugging the rejection from scratch."
        },
        {
          "id": 7,
          "title": "How long since anyone built it",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "vmsingle"
          },
          "gridPos": {
            "x": 16,
            "y": 26,
            "w": 8,
            "h": 6
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(time() - last_over_time(aegis_build_timestamp_seconds[30d])) / 86400",
              "legendFormat": "{{image}}",
              "instant": true,
              "datasource": {
                "type": "prometheus",
                "uid": "vmsingle"
              }
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "d",
              "decimals": 1
            },
            "overrides": []
          },
          "description": "How much what the two panels next to it say is worth. The last build measured them: if that was a month ago, they describe that image and not what is being deployed today. A deployed image that does not show up here is not green: it is unmeasured, and that is what aegis check reports."
        },
        {
          "id": 8,
          "title": "Fixable CVEs per image, against today's DB",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "vmsingle"
          },
          "gridPos": {
            "x": 0,
            "y": 32,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (image,severity) (last_over_time(aegis_image_fixable_vulns[2d]))",
              "instant": true,
              "format": "table",
              "datasource": {
                "type": "prometheus",
                "uid": "vmsingle"
              }
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value": "fixable"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "fixable"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              }
            ]
          },
          "description": "What is RUNNING, re-scanned every morning by image-watch against today's trivy DB, fixable only (--ignore-unfixed). A build-time green says nothing about the CVEs published after the push; this does. Alert ImageWithFixableVulns (after the 24h rebuild window). A 0 next to 'could not evaluate' in the watch console is a zero that measured nothing."
        },
        {
          "id": 9,
          "title": "Upstream moved / candidate clean",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "vmsingle"
          },
          "gridPos": {
            "x": 12,
            "y": 32,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "last_over_time(aegis_upstream_moved[2d])",
              "instant": true,
              "format": "table",
              "datasource": {
                "type": "prometheus",
                "uid": "vmsingle"
              }
            },
            {
              "refId": "B",
              "expr": "last_over_time(aegis_upstream_candidate_fixable_vulns[2d])",
              "instant": true,
              "format": "table",
              "datasource": {
                "type": "prometheus",
                "uid": "vmsingle"
              }
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value #A": "upstream moved",
                  "Value #B": "candidate fixable"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "upstream moved"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "text": "same digest",
                            "color": "text",
                            "index": 0
                          },
                          "1": {
                            "text": "MOVED",
                            "color": "blue",
                            "index": 1
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "candidate fixable"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "red",
                          "value": 1
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              }
            ]
          },
          "description": "Would re-mirroring help? MOVED = the upstream tag points at a new digest; 'candidate fixable' = fixable CVEs in that new digest (equal to the current total when it has not moved). MOVED with 0 is the only case where editing images.txt fixes anything — that is UpstreamFixAvailable. Only for images.txt entries whose tag is known."
        },
        {
          "id": 10,
          "title": "Days since image-watch ran",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "vmsingle"
          },
          "gridPos": {
            "x": 0,
            "y": 40,
            "w": 6,
            "h": 6
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(time() - last_over_time(aegis_image_watch_timestamp_seconds[2d])) / 86400",
              "instant": true,
              "datasource": {
                "type": "prometheus",
                "uid": "vmsingle"
              }
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "d",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1.5
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "How much the two tables above are worth: they describe the morning of the last run. Empty is NOT green — it is ImageWatchSilent: the daily job left no heartbeat in two days, and nothing on this instance has re-scanned what it serves since."
        },
        {
          "id": 11,
          "title": "trivyignore: days left",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "vmsingle"
          },
          "gridPos": {
            "x": 6,
            "y": 40,
            "w": 18,
            "h": 6
          },
          "targets": [
            {
              "refId": "A",
              "expr": "last_over_time(aegis_trivyignore_expires_in_seconds[2d]) / 86400",
              "instant": true,
              "format": "table",
              "datasource": {
                "type": "prometheus",
                "uid": "vmsingle"
              }
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value": "days left"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "d",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0
                  },
                  {
                    "color": "green",
                    "value": 30
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "days left"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              }
            ]
          },
          "description": "One row per exception in trivyignore.yaml, by id. Negative = already expired: the next mirror run and the next watch go red on purpose until somebody re-measures it or removes it. Alert TrivyIgnoreExpiring under 30d. No rows with no exceptions — that is health, not a gap."
        },
        {
          "id": 12,
          "title": "Listed but not mirrored",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "vmsingle"
          },
          "gridPos": {
            "x": 0,
            "y": 46,
            "w": 8,
            "h": 6
          },
          "targets": [
            {
              "refId": "A",
              "expr": "last_over_time(aegis_image_not_mirrored[2d]) == 1",
              "instant": true,
              "format": "table",
              "datasource": {
                "type": "prometheus",
                "uid": "vmsingle"
              }
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "description": "images.txt entries the watch found absent from the registry. Normal on a fresh instance (mirror-images has not run yet) and a NOTICE, not an alert: nothing runs on an image that is not there. An entry that stays here after a mirror run is a mirror that failed for that image."
        },
        {
          "id": 13,
          "title": "Days since the base was propagated",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "vmsingle"
          },
          "gridPos": {
            "x": 8,
            "y": 46,
            "w": 16,
            "h": 6
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(time() - last_over_time(aegis_base_propagated_timestamp_seconds[30d])) / 86400",
              "legendFormat": "{{image}} → {{repo}}",
              "instant": true,
              "datasource": {
                "type": "prometheus",
                "uid": "vmsingle"
              }
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "d",
              "decimals": 1
            },
            "overrides": []
          },
          "description": "When each consumer's FROM was last bumped to a rebuilt aegis-base-*. Read next to 'How long since anyone built it': a base propagated a week ago into a repo nobody built since is a bump that has not reached what runs. A failed bump is BasePropagationFailed, not a gap here."
        }
      ],
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      }
    }
