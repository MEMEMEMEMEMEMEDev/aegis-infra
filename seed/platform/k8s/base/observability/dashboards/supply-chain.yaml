# Dashboard «supply-chain» — design.md §4.4: eventos
# builds→digest→scan→firma y la edad de la DB de Trivy.
# Provisionado DESDE GIT via sidecar (label grafana_dashboard —
# design.md §4.1: ninguno nace a click; editable:false en el JSON).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-supply-chain
  namespace: observability
  labels:
    aegis.dev/part-of: aegis-platform
    grafana_dashboard: "1"
data:
  supply-chain.json: |
    {
      "uid": "aegis-supply-chain",
      "title": "Aegis · supply-chain",
      "description": "Capa 3 de design.md §1: los eventos que cuentan la historia, con su retención de 1 año.",
      "schemaVersion": 39,
      "editable": false,
      "timezone": "browser",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "tags": [
        "aegis"
      ],
      "panels": [
        {
          "id": 1,
          "title": "Edad de la DB de Trivy (horas)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "vmsingle"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 6
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(time() - max(last_over_time(aegis_trivy_db_updated_timestamp_seconds[2h]))) / 3600",
              "datasource": {
                "type": "prometheus",
                "uid": "vmsingle"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "h"
            },
            "overrides": []
          },
          "description": "El vigía del vigía: si pasa de 48h, cada scan «verde» miente en silencio (alerta TrivyDBVieja)."
        },
        {
          "id": 2,
          "title": "/healthz de trivy (probe_success)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "vmsingle"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 6
          },
          "targets": [
            {
              "refId": "A",
              "expr": "probe_success{job=\"blackbox-trivy\"}",
              "datasource": {
                "type": "prometheus",
                "uid": "vmsingle"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        },
        {
          "id": 3,
          "title": "Eventos de la cadena de suministro (AEGIS_EVENT)",
          "type": "logs",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "vlogs-events"
          },
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 24,
            "h": 12
          },
          "targets": [
            {
              "refId": "A",
              "expr": "_stream: {source=~\"jenkins-.*\"}",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "vlogs-events"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "description": "La trazabilidad build→digest→scan→firma, de los DOS productores: los builds de aplicación (jenkins-build) y el espejo de imágenes de terceros (jenkins-mirror). Identidad de EVENTO, jamás label de métrica (design.md §2)."
        },
        {
          "id": 4,
          "title": "Builds por día",
          "type": "timeseries",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "vlogs-events"
          },
          "gridPos": {
            "x": 0,
            "y": 18,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "_stream: {source=~\"jenkins-.*\"} | stats by (_time:1d) count() builds",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "vlogs-events"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        },
        {
          "id": 5,
          "title": "¿La escaneó alguien?",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "vmsingle"
          },
          "gridPos": {
            "x": 0,
            "y": 26,
            "w": 8,
            "h": 6
          },
          "targets": [
            {
              "refId": "A",
              "expr": "last_over_time(aegis_build_scan_skipped[30d])",
              "legendFormat": "{{image}}",
              "instant": true,
              "datasource": {
                "type": "prometheus",
                "uid": "vmsingle"
              }
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "escaneada",
                      "color": "green",
                      "index": 0
                    },
                    "1": {
                      "text": "SIN ESCANEO",
                      "color": "red",
                      "index": 1
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "description": "El último build de cada imagen, ¿pasó por Trivy? El stage tolera que el server no esté (bootstrap, fases 50-70) y sigue en verde: sin este panel esa tolerancia era invisible. Alerta ImagenSinEscaneo."
        },
        {
          "id": 6,
          "title": "¿La firmó alguien?",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "vmsingle"
          },
          "gridPos": {
            "x": 8,
            "y": 26,
            "w": 8,
            "h": 6
          },
          "targets": [
            {
              "refId": "A",
              "expr": "last_over_time(aegis_build_sign_skipped[30d])",
              "legendFormat": "{{image}}",
              "instant": true,
              "datasource": {
                "type": "prometheus",
                "uid": "vmsingle"
              }
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "firmada",
                      "color": "green",
                      "index": 0
                    },
                    "1": {
                      "text": "SIN FIRMA",
                      "color": "orange",
                      "index": 1
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "description": "A diferencia del escaneo, esto NO es silencioso: Kyverno rechaza la admisión. El panel existe para nombrar la causa antes de depurar el rechazo desde cero."
        },
        {
          "id": 7,
          "title": "Hace cuánto que nadie la buildea",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "vmsingle"
          },
          "gridPos": {
            "x": 16,
            "y": 26,
            "w": 8,
            "h": 6
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(time() - last_over_time(aegis_build_timestamp_seconds[30d])) / 86400",
              "legendFormat": "{{image}}",
              "instant": true,
              "datasource": {
                "type": "prometheus",
                "uid": "vmsingle"
              }
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "d",
              "decimals": 1
            },
            "overrides": []
          },
          "description": "Cuánto vale lo que dicen los dos paneles de al lado. Los medió el último build: si fue hace un mes, describen esa imagen y no lo que se está desplegando hoy. Una imagen desplegada que no aparece acá no está en verde: está sin medir, y eso lo reporta aegis check."
        }
      ],
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      }
    }
