# blackbox-exporter v0.28.0 (raw). B11 FOR REAL (design.md §4.2b): it
# measures the certificate the registry SERVES through a real TLS
# handshake validated AGAINST aegis' CA (configmap-aegis-ca) — never
# insecure_skip_verify: a probe with -k would give the same expiry but
# would let a WRONG cert through in green (the same -k that P2.4
# banished from phase 40).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-config
  namespace: observability
  labels: {aegis.dev/part-of: aegis-platform}
data:
  config.yml: |
    modules:
      # registry_tls: it accepts 401 as success — the registry's auth
      # comes after the handshake; the 401 IS the proof that TLS and
      # auth are alive (the same criterion as the registry-tls-real
      # gate):
      registry_tls:
        prober: http
        timeout: 10s
        http:
          method: GET
          valid_status_codes: [200, 401]
          fail_if_not_ssl: true
          tls_config:
            ca_file: /etc/blackbox/ca/ca.crt
      # plain http_2xx: trivy's /healthz (hooks.md — the watchman's
      # watchman by availability; the DB's AGE is measured by the
      # CronJob):
      http_2xx:
        prober: http
        timeout: 10s
        http:
          method: GET
      # sitio_publico: the COMPLETE path of a customer to a tenant's
      # site — Cloudflare's DNS, the edge, the tunnel, traefik, the
      # middlewares and the app. It is the only probe that measures
      # what a person experiences; everything else measures pieces.
      #
      # Three decisions, and not one of them is style:
      #
      # ip4 MANDATORY. Cloudflare publishes A and AAAA; blackbox
      # prefers IPv6 by default and this cluster has no IPv6 way out,
      # so the probe failed in 1 ms with probe_success=0 —
      # indistinguishable from «the site is down». Measured on
      # 2026-08-22 before shipping this: a probe that always fails is
      # as useless as one that always passes, and noisier.
      #
      # no_follow_redirects + valid_status_codes [200]: if a tenant's
      # site ever ends up behind Cloudflare Access by mistake, the 302
      # to the login CANNOT count as success. It is the same rule as
      # init's check 90: do not measure the edge believing you are
      # measuring the app.
      #
      # tls_config against a bundle that carries BOTH trust stores, and
      # the reason is the edge. Under EDGE=cloudflare the certificate is
      # Cloudflare's and validates against the public roots; under
      # EDGE=local it is the wildcard aegis' own CA issued, which no
      # public store has ever heard of. With no tls_config at all this
      # module used the image's system roots implicitly — right for one
      # edge and, for the other, a probe that rejects a perfectly good
      # site and reports it DOWN. The only measurement that represents a
      # real person, lying, on the profile where it is the only one left.
      #
      # The bundle is system-roots + aegis' CA, built by the init
      # container below. NEVER insecure_skip_verify: `-k` would give the
      # same green for a certificate served by somebody else, which is
      # exactly the sin P2.4 banished from phase 40 and the reason
      # registry_tls validates too.
      sitio_publico:
        prober: http
        timeout: 10s
        http:
          method: GET
          preferred_ip_protocol: ip4
          ip_protocol_fallback: false
          valid_status_codes: [200]
          no_follow_redirects: true
          fail_if_not_ssl: true
          tls_config:
            ca_file: /etc/blackbox/trust/bundle.crt
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox
  namespace: observability
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  selector: {app.kubernetes.io/name: blackbox}
  ports: [{name: http, port: 9115, targetPort: 9115}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox
  namespace: observability
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: blackbox}
  template:
    metadata:
      labels: {app.kubernetes.io/name: blackbox}
    spec:
      # The trust bundle: the image's public roots PLUS aegis' own CA,
      # concatenated into an emptyDir. blackbox's `ca_file` REPLACES the
      # trust pool, it does not add to it — so pointing sitio_publico at
      # the internal CA alone would break the cloudflare edge, and
      # leaving it at the system roots breaks the local one. The union is
      # the only file that serves both.
      #
      # The SAME image on purpose: it is the digest that is already
      # mirrored, scanned and signed. A new image just to run one `cat`
      # would cost a pipeline, a signature and one more digest to audit
      # (the same reasoning as the initContainer of engine-charla).
      initContainers:
        - name: build-trust-bundle
          image: quay.io/prometheus/blackbox-exporter:v0.28.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              cat /etc/ssl/certs/ca-certificates.crt /etc/blackbox/ca/ca.crt \
                > /etc/blackbox/trust/bundle.crt
              # Loud on purpose: a bundle that silently came out with
              # only one of the two halves is a probe that fails on one
              # whole edge and blames the site.
              echo "trust bundle: $(grep -c 'BEGIN CERTIFICATE' /etc/blackbox/trust/bundle.crt) certificates"
              grep -q 'BEGIN CERTIFICATE' /etc/blackbox/ca/ca.crt
          volumeMounts:
            - {name: aegis-ca, mountPath: /etc/blackbox/ca, readOnly: true}
            - {name: trust, mountPath: /etc/blackbox/trust}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
      containers:
        - name: blackbox-exporter
          # verified 2026-08-19 against github.com/prometheus/
          # blackbox_exporter releases (v0.28.0, 2025-12-06) and the
          # tag on quay.io/prometheus/blackbox-exporter:
          image: quay.io/prometheus/blackbox-exporter:v0.28.0
          args: ["--config.file=/etc/blackbox_exporter/config.yml"]
          ports: [{name: http, containerPort: 9115}]
          volumeMounts:
            - {name: config, mountPath: /etc/blackbox_exporter, readOnly: true}
            - {name: aegis-ca, mountPath: /etc/blackbox/ca, readOnly: true}
            - {name: trust, mountPath: /etc/blackbox/trust, readOnly: true}
          readinessProbe:
            httpGet: {path: /-/healthy, port: 9115}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /-/healthy, port: 9115}
            initialDelaySeconds: 15
          resources:            # phase-85 §10
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: config
          configMap: {name: blackbox-config}
        - name: aegis-ca
          configMap: {name: aegis-ca}
        - name: trust
          emptyDir: {}
