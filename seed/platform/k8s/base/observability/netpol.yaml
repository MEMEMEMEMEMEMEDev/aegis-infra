# NetworkPolicy for observability — WRITTEN but NOT LISTED in the
# kustomization until Cilium (ADR-0014: kube-router does not enforce —
# validate POSITIVE enforcement before turning it on). Same treatment
# as registry-system. INGRESS-ONLY like all of iter2 (flannel does no
# FQDN egress).
#
# Legitimate clients once it is on:
#  - infra-edge (traefik): grafana :3000 and ntfy :8080 (the two
#    IngressRoutes of routes.yaml).
#  - trivy-system: the trivy-db-age CronJob pushes to vmsingle :8428.
#  - jenkins-system: the `report` stage of every build pushes the
#    supply-chain event to vlogs-events :9428 and its three metrics to
#    vmsingle :8428. Missing from this list and from the rule: the
#    event POST exists since phase 85 and the metrics one since today,
#    so turning this netpol on as it stood would have cut both. It
#    went unnoticed because the file is not listed in the kustomization
#    — precisely the kind of debt that comes due the day it is.
#  - the namespace itself: vmagent scrapes everyone, vmalert talks to
#    vmsingle and alertmanager, alertmanager to the bridge, the bridge
#    to ntfy, grafana to the three stores, vector to the two vlogs.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: observability
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-trivy-and-intra
  namespace: observability
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: infra-edge}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: trivy-system}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: jenkins-system}
        - podSelector: {}          # intra-ns: all the internal plumbing
