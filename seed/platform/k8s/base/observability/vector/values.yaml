# vector 0.57.0 values — the collector (design.md §4.1): a DaemonSet
# (one pod on the single node) that reads pod stdout → vlogs, and
# ROUTES the builds' `AEGIS_EVENT ` lines ALSO to vlogs-events
# (jsonline, 1y retention) — ZERO lines touched in the Jenkinsfile:
# the report stage's structured log already was the contract.
#
# Vector ships no native VictoriaLogs sink in 0.57.0 (verified
# 2026-08-19 against src/sinks of tag v0.57.0): logs through the
# elasticsearch-compatible endpoint of vlogs (the path VictoriaMetrics
# documents), events through /insert/jsonline (the same endpoint
# phase 85 uses to ingest gates.jsonl).
role: Agent
fullnameOverride: vector

customConfig:
  data_dir: /vector-data-dir
  api:
    enabled: false
  sources:
    k8s_logs:
      type: kubernetes_logs
    metricas_propias:
      type: internal_metrics
  transforms:
    # the clock contract (design.md §3.2, WSL2 post-suspend): the
    # collector stamps ITS timestamp besides the emitter's — on a
    # conflict, the collector's orders and the emitter's informs:
    marca_tiempo:
      type: remap
      inputs: [k8s_logs]
      source: |
        .ts_colector = now()
    eventos:
      type: filter
      inputs: [marca_tiempo]
      condition:
        type: vrl
        source: contains(string!(.message), "AEGIS_EVENT ")
    eventos_json:
      type: remap
      inputs: [eventos]
      source: |
        payload, err = parse_json(replace(string!(.message), r'^(.*?)AEGIS_EVENT ', ""))
        if err == null && is_object(payload) {
          . = merge!(., object!(payload))
        }
        # the same stream field phase 85 uses when ingesting the
        # gates.jsonl (source=aegis-init): a single convention per
        # instance so that filtering by origin is possible:
        .source = "jenkins-build"
  sinks:
    # ALL pod logs → vlogs (short retention, set per profile):
    vlogs:
      type: elasticsearch
      inputs: [marca_tiempo]
      endpoints: ["http://vlogs.observability.svc:9428/insert/elasticsearch/"]
      mode: bulk
      api_version: v8
      healthcheck: {enabled: false}
      compression: gzip
      query:
        _msg_field: message
        _time_field: timestamp
        _stream_fields: kubernetes.pod_namespace,kubernetes.container_name
    # ONLY the AEGIS_EVENT ones → vlogs-events (1y, audit):
    vlogs_eventos:
      type: http
      inputs: [eventos_json]
      uri: "http://vlogs-events.observability.svc:9428/insert/jsonline?_stream_fields=source&_time_field=ts_colector&_msg_field=message"
      method: post
      encoding: {codec: json}
      framing: {method: newline_delimited}
    # the collector's own metrics, scrapeable by vmagent (job
    # observability-stack — the chart's Service derives port 9598
    # from this address):
    metricas:
      type: prometheus_exporter
      inputs: [metricas_propias]
      address: 0.0.0.0:9598

resources:                      # phase-85 §10
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 500m, memory: 512Mi}
