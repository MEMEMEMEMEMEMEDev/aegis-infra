# grafana 10.5.15 values — the viewer, provisioned 100% FROM GIT
# (design.md §4.1): datasources by provisioning, dashboards by a
# sidecar reading ConfigMaps out of the repo. NOTHING by clicking.
fullnameOverride: grafana       # Service = `grafana` :80

# NO persistence, and it is THE decision (design.md §4.1): a clicked
# dashboard would be an invisible orphan — not in git, not evaluated
# by ArgoCD, dead with the pod. With no PVC there is nowhere to pile
# up click-state: the constraint as a mechanism, not as a rule of
# conduct.
persistence:
  enabled: false

admin:
  existingSecret: grafana-admin  # KSOPS (phase 85 encrypts it; keys
  # admin-user/admin-password — the chart's default). Grafana sits
  # behind Access BUT keeps its login: Access is the door, not the
  # only lock (phase-85 §3).

# the VictoriaLogs datasource is a Grafana plugin; it comes down when
# the pod starts (egress to grafana.com — same treatment as Jenkins'
# installPlugins). verified 2026-08-19 against
# grafana.com/api/plugins: victoriametrics-logs-datasource, active:
plugins:
  - victoriametrics-logs-datasource

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        uid: vmsingle
        type: prometheus
        access: proxy
        url: http://vmsingle.observability.svc:8428
        isDefault: true
      - name: VictoriaLogs
        uid: vlogs
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://vlogs.observability.svc:9428
      - name: VictoriaLogs events
        uid: vlogs-events
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://vlogs-events.observability.svc:9428

sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard    # the ConfigMaps in dashboards/
    searchNamespace: observability
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 100m, memory: 128Mi}

testFramework:
  enabled: false                # no test pod: surface with no use

grafana.ini:
  server:
    root_url: https://grafana.__ROOT_DOMAIN__
  analytics:
    reporting_enabled: false
    check_for_updates: false

resources:                      # phase-85 §10
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 500m, memory: 512Mi}
