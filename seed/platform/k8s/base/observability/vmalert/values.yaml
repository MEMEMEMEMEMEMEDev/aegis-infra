# values victoria-metrics-alert 0.47.0 — evalúa las reglas contra
# vmsingle y notifica al Alertmanager crudo (la cadena de design.md
# §4.1: vmalert → Alertmanager → puente → ntfy → teléfono).
# El alertmanager EMBEBIDO del chart queda apagado (default): el
# nuestro es el crudo de alertmanager.yaml, con su emptyDir de
# silences y su porqué.
server:
  fullnameOverride: vmalert     # Service = `vmalert` :8880
  datasource:
    url: http://vmsingle.observability.svc:8428
  notifier:
    alertmanager:
      url: http://alertmanager.observability.svc:9093
  # las reglas viven en git como ConfigMap propio (reglas/
  # vmalert-rules.yaml); el chart lo monta en /config y el glob las
  # toma TODAS — regla nueva = key nueva en ese ConfigMap:
  configMap: vmalert-reglas
  extraArgs:
    rule: ["/config/*.yaml"]
    # SIN esto, una regla nueva commiteada y sincronizada NO EXISTE.
    # vmalert lee /config una sola vez al arrancar; el kubelet refresca
    # el ConfigMap montado en ~1 min, pero vmalert no vuelve a mirarlo.
    # O sea: ArgoCD dice «Synced», el archivo está en el pod, y la
    # alerta no está cargada — vigilancia que se cree desplegada y no
    # lo está, hasta que alguien reinicie el pod por otro motivo.
    # Encontrado al desplegar las tres alertas del barrido del
    # 2026-08-22: había que llamar a /-/reload a mano.
    configCheckInterval: "60s"
  resources:                    # fase-85 §10
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 250m, memory: 128Mi}
