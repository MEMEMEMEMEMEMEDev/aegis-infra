# victoria-metrics-alert 0.47.0 values — it evaluates the rules
# against vmsingle and notifies the raw Alertmanager (design.md §4.1's
# chain: vmalert → Alertmanager → bridge → ntfy → phone).
# The chart's EMBEDDED alertmanager stays off (the default): ours is
# the raw one in alertmanager.yaml, with its emptyDir of silences and
# its reason why.
server:
  fullnameOverride: vmalert     # Service = `vmalert` :8880
  datasource:
    url: http://vmsingle.observability.svc:8428
  notifier:
    alertmanager:
      url: http://alertmanager.observability.svc:9093
  # the rules live in git as their own ConfigMap (rules/
  # vmalert-rules.yaml); the chart mounts it at /config and the glob
  # takes them ALL — a new rule = a new key in that ConfigMap:
  configMap: vmalert-reglas
  extraArgs:
    rule: ["/config/*.yaml"]
    # WITHOUT this, a new rule committed and synced DOES NOT EXIST.
    # vmalert reads /config once at start-up; the kubelet refreshes
    # the mounted ConfigMap in ~1 min, but vmalert never looks at it
    # again. That is: ArgoCD says «Synced», the file is in the pod,
    # and the alert is not loaded — surveillance that believes itself
    # deployed and is not, until somebody restarts the pod for another
    # reason. Found while deploying the three alerts of the 2026-08-22
    # sweep: /-/reload had to be called by hand.
    configCheckInterval: "60s"
  resources:                    # phase-85 §10
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 250m, memory: 128Mi}
