# ntfy v2.27.0 (multi-doc, raw — precedent registry.yaml: one
# container + one ConfigMap do not amortize a chart). The SELF-HOSTED
# «the platform is broken» channel (design.md §4.1): it cannot depend
# on a free SaaS with guessable topics.
#
# ntfy goes WITHOUT Access (the phone app cannot present a service
# token) — the lock is its OWN auth: deny-all + ACL (phase-85 §3/§5).
# User provisioning is DECLARATIVE, by config: verified 2026-08-19
# against server/server.yml of tag v2.27.0 (auth-users/auth-access
# existed before that version), so there is NO imperative
# `kubectl exec ntfy user add`.
#
# The TWO bcrypt hashes in auth-users are class-generated (owner:
# phase 85, via inject_placeholder — produced by `ntfy user hash` /
# htpasswd -B with the gen_or_restore credentials from the store). A
# bcrypt hash is not reversible material: the same criterion as the
# registry's htpasswd, but here ntfy's format demands it in the
# config. The bridge credential IN CLEAR lives only in the Secret
# ntfy-bridge-token (ntfy-bridge.yaml); the operator's only in the
# store + their phone (phase-85 §3: nobody in the cluster consumes it).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-config
  namespace: observability
  labels: {aegis.dev/part-of: aegis-platform}
data:
  server.yml: |
    base-url: "https://ntfy.__ROOT_DOMAIN__"
    listen-http: ":8080"
    behind-proxy: true            # traefik/cloudflared in front: rate
                                  # limits per real visitor, not per
                                  # the edge's IP
    cache-file: "/var/lib/ntfy/cache.db"
    auth-file: "/var/lib/ntfy/auth.db"
    # DENY-ALL: an open ntfy would be a spam relay on our domain (gate
    # obs-ntfy-publico-responde: publishing with no credential = 403):
    auth-default-access: "deny-all"
    auth-users:
      - "operador:__OBS_NTFY_OPERADOR_HASH__:user"
      - "puente:__OBS_NTFY_PUENTE_HASH__:user"
    auth-access:
      - "operador:aegis-alertas:read-only"
      - "puente:aegis-alertas:write-only"
    # metrics on a DEDICATED listener: never on the public port (the
    # Service exposes them ClusterIP-only; the IngressRoute routes to 80):
    metrics-listen-http: ":9090"
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy
  namespace: observability
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  selector: {app.kubernetes.io/name: ntfy}
  ports:
    - {name: http, port: 80, targetPort: 8080}
    - {name: metrics, port: 9090, targetPort: 9090}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: observability
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  replicas: 1
  strategy: {type: Recreate}    # PVC RWO
  selector:
    matchLabels: {app.kubernetes.io/name: ntfy}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ntfy}
    spec:
      containers:
        - name: ntfy
          # verified 2026-08-19 against github.com/binwiederhier/ntfy
          # releases (v2.27.0, 2026-08-04) and the tag in Docker Hub:
          image: binwiederhier/ntfy:v2.27.0
          args: ["serve"]        # reads /etc/ntfy/server.yml (default)
          ports:
            - {name: http, containerPort: 8080}
            - {name: metrics, containerPort: 9090}
          volumeMounts:
            - {name: config, mountPath: /etc/ntfy, readOnly: true}
            - {name: data, mountPath: /var/lib/ntfy}
          readinessProbe:
            httpGet: {path: /v1/health, port: 8080}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /v1/health, port: 8080}
            initialDelaySeconds: 15
          resources:            # phase-85 §10
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
      volumes:
        - name: config
          configMap: {name: ntfy-config}
        - name: data
          persistentVolumeClaim: {claimName: ntfy-data}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ntfy-data
  namespace: observability
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
