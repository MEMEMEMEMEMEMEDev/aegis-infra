# kustomization observability (fase 85). KSOPS generator con LISTA
# EXPLÍCITA (A7): cada .enc.yaml nuevo = entry nuevo ACÁ, o el
# Secret no existe aunque la App esté Healthy.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # namespace.yaml PRIMERO (corrida #7, bug A): CreateNamespace no es
  # confiable en apps kustomize — patrón registry-system, se iguala
  # al que funciona:
  - namespace.yaml
  - configmap-aegis-ca.yaml
  - ntfy.yaml
  - alertmanager.yaml
  - ntfy-bridge.yaml
  - blackbox.yaml
  - trivy-db-age.yaml
  - rules/vmalert-rules.yaml
  - dashboards/bootstrap.yaml
  - dashboards/platform.yaml
  - dashboards/supply-chain.yaml
  - dashboards/edge.yaml
  - dashboards/usage.yaml
  - routes.yaml
  # NetworkPolicy: escrita (netpol.yaml) pero NO listada hasta Cilium
  # (ADR-0014; kube-router no enforce — validar enforcement POSITIVO
  # antes de activarla). Mismo trato que registry-system.
generators:
  - secret-generator.yaml
