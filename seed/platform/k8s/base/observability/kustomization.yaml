# observability's kustomization (phase 85). KSOPS generator with an
# EXPLICIT LIST (A7): every new .enc.yaml = a new entry HERE, or the
# Secret does not exist even with the App Healthy.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # namespace.yaml FIRST (run #7, bug A): CreateNamespace is not
  # reliable in kustomize apps — the registry-system pattern; this
  # matches the one that works:
  - namespace.yaml
  - configmap-aegis-ca.yaml
  - ntfy.yaml
  - alertmanager.yaml
  - ntfy-bridge.yaml
  - blackbox.yaml
  - trivy-db-age.yaml
  - rules/vmalert-rules.yaml
  - dashboards/bootstrap.yaml
  - dashboards/platform.yaml
  - dashboards/supply-chain.yaml
  - dashboards/edge.yaml
  - dashboards/usage.yaml
  - routes.yaml
  # NetworkPolicy: written (netpol.yaml) but NOT listed until Cilium
  # (ADR-0014; kube-router does not enforce — validate POSITIVE
  # enforcement before switching it on). Same treatment as
  # registry-system.
generators:
  - secret-generator.yaml
