# victoria-metrics-single 0.45.0 values — the metrics store+query
# (design.md §4.1: one binary per role, no operator and no CRDs). No
# replica, PVC 5Gi (phase-85 §2: dev's retention on a single node fits
# with room to spare; scaling to a cluster is the FUTURE hetzner
# profile's problem).
server:
  fullnameOverride: vmsingle    # Service = `vmsingle` :8428 (a stable
                                # name: vmagent, vmalert, grafana and
                                # the trivy-db-age CronJob all consume
                                # it)
  # config class, per profile (phase-85 §4): 30d dev / 90d hetzner.
  # external_labels do not exist in vmsingle (it does not scrape — the
  # datum arrives already labelled by vmagent, which is where
  # __AEGIS_PROFILE__ lives):
  retentionPeriod: __OBS_RETENCION_METRICAS__
  persistentVolume:
    enabled: true
    size: 5Gi
  resources:                    # phase-85 §10
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
