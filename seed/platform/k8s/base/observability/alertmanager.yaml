# Alertmanager v0.34.0 (raw — registry.yaml set the precedent). It
# groups, routes and silences whatever vmalert evaluates; the webhook
# goes out to the ntfy-alertmanager bridge (ntfy speaks plain HTTP,
# not Alertmanager's protocol — design.md §4.1).
#
# emptyDir for silences ON PURPOSE (phase-85 §2): a silence is
# ephemeral operational state; losing it in a restart re-alerts, which
# is the SAFE failure. A PVC for silences would be state-by-click in
# disguise.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: observability
  labels: {aegis.dev/part-of: aegis-platform}
data:
  alertmanager.yml: |
    route:
      receiver: ntfy
      group_by: [alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # the deadman (design.md §4.2a): ALWAYS firing; its value is
        # its ABSENCE from the phone. The cadence is per profile
        # (phase-85 §4: dev 24h — the notebook sleeps by design and
        # the nightly absence is not a signal; hetzner 6h):
        - matchers: ['alertname="DeadmanAegis"']
          receiver: ntfy
          group_wait: 0s
          repeat_interval: __OBS_DEADMAN_REPEAT__
    receivers:
      - name: ntfy
        webhook_configs:
          - url: http://ntfy-bridge.observability.svc:8080
            send_resolved: true
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: observability
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  selector: {app.kubernetes.io/name: alertmanager}
  ports: [{name: http, port: 9093, targetPort: 9093}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: observability
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: alertmanager}
  template:
    metadata:
      labels: {app.kubernetes.io/name: alertmanager}
    spec:
      containers:
        - name: alertmanager
          # verified 2026-08-19 against github.com/prometheus/
          # alertmanager releases (v0.34.0, 2026-08-16) and the tag on
          # quay.io/prometheus/alertmanager:
          image: quay.io/prometheus/alertmanager:v0.34.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports: [{name: http, containerPort: 9093}]
          volumeMounts:
            - {name: config, mountPath: /etc/alertmanager, readOnly: true}
            - {name: storage, mountPath: /alertmanager}
          readinessProbe:
            httpGet: {path: /-/ready, port: 9093}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /-/healthy, port: 9093}
            initialDelaySeconds: 15
          resources:            # phase-85 §10
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
      volumes:
        - name: config
          configMap: {name: alertmanager-config}
        - name: storage
          emptyDir: {}
