apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: observability-secrets
  annotations:
    config.kubernetes.io/function: |
      exec: {path: ksops}
files:
  - grafana-admin.enc.yaml       # encrypted by phase 85 (gen_or_restore
                                 # + make_enc_secret; keys admin-user/
                                 # admin-password — the contract of the
                                 # grafana chart's admin.existingSecret)
  - ntfy-bridge-token.enc.yaml   # encrypted by phase 85: key `config` =
                                 # the bridge's whole scfg (it carries
                                 # the credential it publishes to ntfy
                                 # with, which is why it lives in a
                                 # Secret and not in a ConfigMap)
