apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: observability-secrets
  annotations:
    config.kubernetes.io/function: |
      exec: {path: ksops}
files:
  - grafana-admin.enc.yaml       # lo cifra la fase 85 (gen_or_restore
                                 # + make_enc_secret; keys admin-user/
                                 # admin-password — contrato del chart
                                 # grafana admin.existingSecret)
  - ntfy-bridge-token.enc.yaml   # lo cifra la fase 85: key `config` =
                                 # el scfg completo del puente (lleva
                                 # la credencial con la que publica en
                                 # ntfy, por eso vive en Secret y no
                                 # en ConfigMap)
