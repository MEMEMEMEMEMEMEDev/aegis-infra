# trivy-db-age — the watcher of the watcher (design.md §4.2d): if
# Trivy's DB does not update, every «green» scan lies in silence and
# the A42 pin turns into faith. There is no native metric; it is
# DERIVED: this CronJob reads the DB metadata on the trivy-server's
# PVC and pushes `aegis_trivy_db_updated_timestamp_seconds` to
# vmsingle (/api/v1/import/prometheus). vmalert's trivy-db.yaml rule
# alerts at 48h.
#
# EXPLICIT trivy-system namespace (phase-85 §1): the DB's PVC is RWO
# and lives there — the CronJob has to mount `data-trivy-0` (the
# `data` volumeClaimTemplate of the `trivy` StatefulSet, chart 0.24.0,
# mounted at /home/scanner/.cache ⇒ the DB ends up in
# <pvc>/trivy/db/metadata.json).
#
# RWO EDGE CASE (phase-85 §2): on a single node the second RWO mount
# co-locates by itself; on multi-node hetzner this CronJob needs
# affinity to the trivy-server's node — solve it when the hetzner
# profile is activated (noted on purpose; no multi-node to measure).
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trivy-db-age
  namespace: trivy-system
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  schedule: "17 * * * *"        # hourly; the threshold is 48h — plenty
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels: {app.kubernetes.io/name: trivy-db-age}
        spec:
          restartPolicy: OnFailure
          # The DB's PVC belongs to the trivy-server: `trivy/` is mode 2770
          # with owner and group 65534 — it cannot even be TRAVERSED by
          # another user. The curl image runs as uid 100 by default, so this
          # CronJob failed for 30 h straight with «Permission denied» without
          # anything saying so (found on 2026-08-22). It runs with the same
          # identity as the trivy-server, which is the only one that opens
          # that directory.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: medir-y-pushear
              # verified 2026-08-19 against github.com/curl/
              # curl-container releases (8.21.0, 2026-06-24) and the
              # tag in Docker Hub curlimages/curl:
              image: curlimages/curl:8.21.0
              command: ["/bin/sh", "-ec"]
              args:
                # UpdatedAt from the metadata (what the DB SAYS
                # about itself); if the parse fails, the file's mtime
                # (what the filesystem SAW) — a noted degradation,
                # not silence:
                - |
                  META=/trivy-cache/trivy/db/metadata.json
                  ISO="$(sed -n 's/.*"UpdatedAt":"\([0-9T:.-]*\)Z\{0,1\}".*/\1/p' "$META" | head -1)"
                  TS="$(date -u -D '%Y-%m-%dT%H:%M:%S' -d "${ISO%%.*}" +%s 2>/dev/null || stat -c %Y "$META")"
                  printf 'aegis_trivy_db_updated_timestamp_seconds %s\n' "$TS" \
                    | curl -sS --fail-with-body --retry 3 --retry-connrefused --max-time 30 \
                        --data-binary @- \
                        http://vmsingle.observability.svc:8428/api/v1/import/prometheus
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
                readOnlyRootFilesystem: true
              volumeMounts:
                - {name: trivy-cache, mountPath: /trivy-cache, readOnly: true}
                - {name: tmp, mountPath: /tmp}
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {cpu: 100m, memory: 64Mi}
          volumes:
            - name: trivy-cache
              persistentVolumeClaim:
                claimName: data-trivy-0
                readOnly: true
            - name: tmp
              emptyDir: {sizeLimit: 8Mi}
