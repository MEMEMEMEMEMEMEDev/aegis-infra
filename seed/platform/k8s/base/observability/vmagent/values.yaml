# victoria-metrics-agent 0.46.0 values — THE scraper (phase-85 §2:
# vmsingle can scrape on its own, but vmagent gives relabeling and an
# on-disk buffer against outages — the dev network goes down BY DESIGN
# and losing the buffer would be losing exactly the incident's
# samples).
#
# scrape_configs ENUMERATED (the spirit of A7): a new target = a new
# entry here, no magic. The jobs with kubernetes_sd are BOUNDED to a
# concrete namespace + label + port — they discover replicas of the
# NAMED component, never «everything that carries an annotation».
# Overwriting `config.scrape_configs` REPLACES the chart's default
# list (the generic by-annotation jobs are left out on purpose).
fullnameOverride: vmagent

# WITHOUT this, a new probe IS NOT SCRAPED. vmagent reads its config
# once at start-up; the kubelet refreshes the mounted ConfigMap in
# ~1 min, but vmagent never looks at it again. That is: `aegis org`
# derives the target, ArgoCD says «Synced», the file IS in the pod,
# and nobody scrapes it — surveillance that believes itself deployed
# and is not.
# It is the SAME vice vmalert had (fixed the same day): in this stack
# the hot reload has to be asked for, it does not come.
extraArgs:
  promscrape.configCheckInterval: "60s"

remoteWrite:
  - url: http://vmsingle.observability.svc:8428/api/v1/write

# the on-disk buffer that justifies vmagent (see above):
persistentVolume:
  enabled: true
  size: 1Gi

# Recreate and NOT RollingUpdate, and it is not a preference: the
# buffer above is a ReadWriteOnce PVC, and vmagent takes an exclusive
# lock on it. With RollingUpdate the new pod starts BEFORE the old one
# dies, does not get the lock and enters CrashLoopBackOff for ever:
# vmagent became impossible to restart, and any change to its config
# jammed without anything saying so. Measured on 2026-08-22 when the
# hot reload was added: «cannot acquire lock on file .../flock.lock».
# The price is a few seconds without scraping, which the buffer itself
# covers.
# The key is deployment.spec.strategy and not `strategy` nor
# `updateStrategy` (that last one belongs to the StatefulSet):
# verified with `helm show values victoria-metrics-agent --version
# 0.46.0`. Written wrong, the chart ignores it in silence and the
# Deployment stays on RollingUpdate without ArgoCD noticing a thing —
# it says Synced all the same.
deployment:
  spec:
    strategy:
      type: Recreate

rbac:
  # the chart already gives nodes/nodes-metrics/pods/services; the
  # cadvisor job goes through the API server's PROXY (TLS validated
  # against the cluster's CA — never insecure_skip_verify, the anti -k
  # doctrine) and that asks for nodes/proxy:
  extraRules:
    - apiGroups: [""]
      resources: [nodes/proxy]
      verbs: [get, list, watch]

config:
  global:
    scrape_interval: 30s
    external_labels:
      # the datum's identity, not behaviour (design.md §4.3): a
      # dashboard can tell «no data» apart from «zero» according to
      # the profile's semantics:
      aegis_profile: greenfield
  scrape_configs:
    # ── the stack measures itself (its own Services, static) ──────
    - job_name: vmagent
      static_configs:
        - targets: [localhost:8429]
    - job_name: observability-stack
      static_configs:
        - targets:
            - vmsingle.observability.svc:8428
            - vlogs.observability.svc:9428
            - vlogs-events.observability.svc:9428
            - vmalert.observability.svc:8880
            - alertmanager.observability.svc:9093
            - blackbox.observability.svc:9115
            - ntfy.observability.svc:9090
            - vector.observability.svc:9598
    # ── the kubelet's cAdvisor via the API-server proxy (design.md
    #    §4.5: CPU/mem per container with no node-exporter and no
    #    kube-state-metrics; the proxy validates TLS against the
    #    cluster's CA, unlike scraping the kubelet directly, which
    #    would demand skip_verify) ──────────────────────────────────
    - job_name: kubernetes-nodes-cadvisor
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      kubernetes_sd_configs:
        - role: node
      honor_timestamps: false
      relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
        - target_label: __address__
          replacement: kubernetes.default.svc:443
        - source_labels: [__meta_kubernetes_node_name]
          regex: (.+)
          target_label: __metrics_path__
          replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
    # ── the observed ones (hooks.md, one job per component) ───────
    # ArgoCD: native /metrics (controller :8082, server :8083,
    # repo-server :8084 — container ports named that way in the argo-cd
    # chart; it asks for the entry in argocd's netpol, phase-85 §7):
    - job_name: argocd
      kubernetes_sd_configs:
        - role: pod
          namespaces: {names: [argocd]}
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_part_of]
          regex: argocd
          action: keep
        - source_labels: [__meta_kubernetes_pod_container_port_number]
          regex: "8082|8083|8084"
          action: keep
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
    # cert-manager :9402 — as CONTEXT for B11 (the alert comes out of
    # blackbox, not from here — design.md §4.2b):
    - job_name: cert-manager
      kubernetes_sd_configs:
        - role: pod
          namespaces: {names: [cert-manager]}
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_container_port_number]
          regex: "9402"
          action: keep
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
    # Kyverno :8000 (admissions and the webhook's latency):
    - job_name: kyverno
      kubernetes_sd_configs:
        - role: pod
          namespaces: {names: [kyverno]}
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_part_of]
          regex: kyverno
          action: keep
        - source_labels: [__meta_kubernetes_pod_container_port_number]
          regex: "8000"
          action: keep
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
    # Traefik: entrypoint metrics :9100 (prometheus viene activo por
    # default en el chart 40.3.0 — verificado 2026-08-19 contra sus
    # values: metrics.prometheus.entryPoint=metrics, ports.metrics
    # 9100; the port is not in the Service, hence pod-SD):
    - job_name: traefik
      kubernetes_sd_configs:
        - role: pod
          namespaces: {names: [infra-edge]}
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          regex: traefik
          action: keep
        - source_labels: [__meta_kubernetes_pod_container_port_number]
          regex: "9100"
          action: keep
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
    # cloudflared :2000 (the --metrics flag + containerPort are added
    # to the Deployment by phase 85 — hooks.md, 2 lines):
    - job_name: cloudflared
      kubernetes_sd_configs:
        - role: pod
          namespaces: {names: [infra-edge]}
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          regex: cloudflared
          action: keep
        - source_labels: [__meta_kubernetes_pod_container_port_number]
          regex: "2000"
          action: keep
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
    # Jenkins: the `prometheus` plugin (/prometheus with no API key —
    # hooks.md; the line in installPlugins is added by phase 85):
    - job_name: jenkins
      metrics_path: /prometheus
      static_configs:
        - targets: [jenkins.jenkins-system.svc:8080]
    # registry: debug.prometheus :5001 (the block in the ConfigMap and
    # the port in the Service are added by phase 85 — hooks.md):
    - job_name: registry
      static_configs:
        - targets: [registry.registry-system.svc:5001]
    # ── blackbox probes (what is SERVED, not what is declared) ────
    # B11: probe_ssl_earliest_cert_expiry comes out of here — a real
    # handshake against the CA (the registry_tls module,
    # blackbox.yaml). The relabel leaves `instance` = host:port so
    # that the rule and the gate (instance=~"registry.*") read the
    # destination and not the URL:
    - job_name: blackbox-registry
      metrics_path: /probe
      params: {module: [registry_tls]}
      static_configs:
        - targets: ["https://registry.registry-system.svc:5000/v2/"]
      relabel_configs:
        - source_labels: [__address__]
          target_label: __param_target
        - source_labels: [__param_target]
          regex: "https?://([^/]+).*"
          target_label: instance
          replacement: "$1"
        - target_label: __address__
          replacement: blackbox.observability.svc:9115
    # el /healthz de trivy (pide la entry :4954 en la netpol de
    # trivy-system — phase-85 §7):
    - job_name: blackbox-trivy
      metrics_path: /probe
      params: {module: [http_2xx]}
      static_configs:
        - targets: ["http://trivy.trivy-system.svc:4954/healthz"]
      relabel_configs:
        - source_labels: [__address__]
          target_label: __param_target
        - source_labels: [__param_target]
          regex: "https?://([^/]+).*"
          target_label: instance
          replacement: "$1"
        - target_label: __address__
          replacement: blackbox.observability.svc:9115
    # --- DERIVED by aegis-org (tenant probes): do not edit by hand ---
    # One probe per organization with a domain and a public path. It
    # measures the COMPLETE path a customer walks: DNS, edge, tunnel,
    # traefik, middlewares and the app. Everything else measures
    # pieces.
    # This block is re-derived WHOLE on every aegis org apply.
    # (no organization declares a domain with a public path)
    # --- END DERIVED ---

resources:                      # phase-85 §10
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 500m, memory: 256Mi}
