# victoria-logs-single 0.13.9 values — the instance for supply-chain
# EVENTS + the init's history (gates.jsonl). A SEPARATE release from
# vlogs because OSS retention is global per instance (design.md §4.1):
# a single instance at 1 year would violate the short retention of
# logs and its reason why (§3.1).
#
# 1y FIXED in both profiles, NOT a placeholder (phase-85 §4): it does
# not vary per profile — a constant value dressed up as a variable is
# a lie about flexibility. It is §2's audit retention.
server:
  fullnameOverride: vlogs-events    # Service = `vlogs-events` :9428
  retentionPeriod: 1y
  persistentVolume:
    enabled: true
    size: 1Gi
  resources:                    # phase-85 §10
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 250m, memory: 128Mi}
