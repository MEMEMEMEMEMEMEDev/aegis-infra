# ntfy-alertmanager 1.0.0 — the bridge (raw). It exists because
# vmalert speaks Alertmanager's protocol and ntfy speaks plain HTTP:
# without it the webhook would reach ntfy as unreadable raw JSON
# (design.md §4.1). An extra link accepted WITH eyes open: the deadman
# watches the complete chain end to end.
#
# NO ConfigMap on purpose (phase-85 §1 does not list one for it): its
# scfg config carries the credential it publishes to ntfy with, so the
# WHOLE file lives in the ntfy-bridge-token Secret (KSOPS, encrypted
# by phase 85). Expected content of the `config` key — documented here
# because it is the contract between this Deployment and the phase:
#
#   http-address :8080
#   alert-mode single
#   ntfy {
#       server http://ntfy.observability.svc
#       topic aegis-alertas
#       user puente
#       password <ntfy_bridge_token from the store>
#   }
#   cache {
#       type memory
#   }
#
# (format verified 2026-08-19 against config.scfg of tag v1.0.0 at
# git.xenrox.net/~xenrox/ntfy-alertmanager)
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy-bridge
  namespace: observability
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  selector: {app.kubernetes.io/name: ntfy-bridge}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy-bridge
  namespace: observability
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: ntfy-bridge}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ntfy-bridge}
    spec:
      containers:
        - name: ntfy-alertmanager
          # verified 2026-08-19 against hub.docker.com/r/xenrox/
          # ntfy-alertmanager (tag 1.0.0, 2026-03-31; the project's
          # README at git.xenrox.net points at that image repo):
          image: docker.io/xenrox/ntfy-alertmanager:1.0.0
          args: ["--config", "/etc/ntfy-alertmanager/config"]
          ports: [{name: http, containerPort: 8080}]
          volumeMounts:
            - {name: config, mountPath: /etc/ntfy-alertmanager, readOnly: true}
          readinessProbe:
            tcpSocket: {port: 8080}
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket: {port: 8080}
            initialDelaySeconds: 15
          resources:            # phase-85 §10
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: config
          secret: {secretName: ntfy-bridge-token}
