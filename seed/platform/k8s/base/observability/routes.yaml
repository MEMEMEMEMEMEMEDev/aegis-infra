# Exposure of grafana and ntfy — in observability-base (the argocd
# pattern: the exposure lives next to what it exposes; phase-85 §5).
# The hostnames are declared by edge.yaml (`platform:`) and from
# there tofu DERIVES the CNAMEs and the tunnel ingress — nobody edits
# main.tf by hand (the lesson of ai.__ROOT_DOMAIN__).
#
# - grafana: NO tenant middlewares — it goes BEHIND Access (like
#   argocd/jenkins today), and keeps its own login: Access is the
#   door, not the only lock (phase-85 §3).
# - ntfy: NO Access (the phone app can present neither a service
#   token nor get through the Access login; its lock is its own
#   deny-all — ntfy.yaml). Being the first public platform route
#   with no Access in front, it carries the THREE edge middlewares
#   (#81/#90), copied BYTE FOR BYTE from the ones `aegis-org` emits
#   (render_routes) — the way the canary does. Check 91 today only
#   sweeps platform/k8s/organizations/; extending it to observability
#   is part of B4 (phase-85 §5) so that this copy with no comparator
#   does not drift out of sync.
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ntfy-cabeceras
  namespace: observability
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  headers:
    forceSTSHeader: true
    stsSeconds: 15552000
    stsIncludeSubdomains: false
    contentTypeNosniff: true
    browserXssFilter: false
    referrerPolicy: strict-origin-when-cross-origin
    contentSecurityPolicy: "frame-ancestors 'none'"
    customResponseHeaders:
      X-Frame-Options: "DENY"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ntfy-ritmo
  namespace: observability
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  rateLimit:
    average: 50
    burst: 100
    period: 1s
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ntfy-cuerpo
  namespace: observability
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  buffering:
    maxRequestBodyBytes: 10485760
    memRequestBodyBytes: 1048576
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ntfy-ruteo
  namespace: observability
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  entryPoints: [web, websecure]
  routes:
    - kind: Rule
      match: Host(`ntfy.__ROOT_DOMAIN__`)
      middlewares:
        - {name: ntfy-cabeceras}
        - {name: ntfy-ritmo}
        - {name: ntfy-cuerpo}
      services:
        - {name: ntfy, port: 80}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-ruteo
  namespace: observability
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  entryPoints: [web, websecure]
  routes:
    - kind: Rule
      match: Host(`grafana.__ROOT_DOMAIN__`)
      services:
        - {name: grafana, port: 80}
