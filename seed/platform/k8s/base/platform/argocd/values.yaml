# argo-cd 9.5.20 v2 values — used TWICE with IDENTICAL
# content: the helm install of phase 30 and the self App (adoption
# contract, D6). Structure ALIGNED to the values of the LIVE v1
# (verified bit by bit against the real release, rev 4) — every
# divergence from that pattern was a bug here (the literal-with-a-dot
# configs.cm case was caught by verify-static check 13).
configs:
  cm:
    # without this the repo-server REJECTS the KSOPS exec generator
    # and every *-secrets sync fails (phase 35):
    kustomize.buildOptions: --enable-alpha-plugins --enable-exec
  params:
    server.insecure: true      # TLS terminates at the edge (A21):
                               # CF → Traefik → plain HTTP pod.
                               # Checks ALWAYS with http://.
  secret:
    # ADR-0015: a $ref pointer, NEVER the value in the values bag.
    # Requires the github-webhook Secret (App argocd-secrets) BEFORE
    # the first sync of this App (the order of phase 35):
    githubSecret: "$github-webhook:token"

dex:
  enabled: false               # no SSO in aegis (live v1 the same)

global:
  additionalLabels:
    aegis.dev/part-of: aegis-platform
  domain: argocd.__ROOT_DOMAIN__

notifications:
  enabled: false               # no notifications (live v1 the same)

redisSecretInit:
  enabled: false     # the pre-install hook Job would run on EVERY
                     # sync (helm.sh/hook → PreSync). With the Job
                     # OFF the chart does NOT create argocd-redis and
                     # the redis container demands it (verified
                     # against the 9.5.20 render): phase 30 creates it
                     # with kubectl as bootstrap Secret #3, BEFORE the
                     # install.

repoServer:
  # KSOPS — a CRITICAL block: without it, the repo-server loses the
  # plugin on restart and no *-secrets App decrypts. The age key is
  # mounted by the argocd-sops-age Secret (created with KUBECTL in
  # phase 30 — D2: never by tofu, never in a state). EXPLICIT var
  # (A2), do not trust XDG defaults.
  env:
    - {name: SOPS_AGE_KEY_FILE, value: /.config/sops/age/keys.txt}
    - {name: XDG_CONFIG_HOME, value: /.config}
  initContainers:
    - name: install-ksops
      image: viaductoss/ksops:v4.5.1
      # the image's OFFICIAL installer (leaves ksops + kustomize
      # in /custom-tools) — the form validated in the live release:
      command: [/usr/local/bin/ksops, install, --with-kustomize, /custom-tools]
      volumeMounts: [{name: custom-tools, mountPath: /custom-tools}]
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 200m, memory: 128Mi}
  volumeMounts:
    - {name: custom-tools, mountPath: /usr/local/bin/kustomize, subPath: kustomize}
    - {name: custom-tools, mountPath: /usr/local/bin/ksops, subPath: ksops}
    - {name: sops-age, mountPath: /.config/sops/age/keys.txt, subPath: keys.txt}
  volumes:
    - {name: custom-tools, emptyDir: {}}
    - {name: sops-age, secret: {secretName: argocd-sops-age}}

server:
  # The Traefik IngressRoute is declared by argocd-secrets (the same
  # bundle as the rest of the resources "around" argocd).
  replicas: 1
