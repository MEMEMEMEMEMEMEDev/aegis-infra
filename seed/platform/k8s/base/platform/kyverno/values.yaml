# kyverno 3.8.1 v2 values — CA + scope baked in (A44).
global:
  # aegis root CA (T1, public PEM). global.* => it reaches ALL THREE
  # controllers (admission+background+reports; per-controller left
  # reports without a CA — bug #101 in v1). The AEGIS_CA_PEM
  # placeholder (with dunders, below in data) is injected by PHASE 80
  # of the init (the CA does not exist until cert-manager issues it in
  # phase 35) — same pattern as COSIGN_PUB; both are of the
  # generated class (render_platform_placeholders does NOT touch
  # them). CR-2 run #14: this comment does NOT write the literal
  # placeholder — the old injector took the indent of the FIRST
  # occurrence (this comment, indent 2) and the PEM ended up outside
  # the block scalar (indent 6); inject_placeholder takes the indent
  # of the real line and check 48 forbids the literal in comments.
  caCertificates:
    data: |
      __AEGIS_CA_PEM__
  # the mount alone is NOT enough: go-containerregistry does not pick
  # up the bundle — SSL_CERT_FILE forces it (verified with crane, v1):
  extraEnvVars:
    - name: SSL_CERT_FILE
      value: /etc/ssl/certs/ca-certificates.crt

# NATIVE scope of ALL the webhooks => blast radius of the Fail =
# org-canary. Consistent mutating+validating (the per-policy
# matchConditions are NOT — they break verifyImages). CONSCIOUS
# inherited debt: every future policy is born scoped to org-canary;
# widen it here.
config:
  webhooks:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [org-canary]

admissionController: {replicas: 1}    # dev single-node; hetzner: 2-3
backgroundController: {replicas: 1}
reportsController: {replicas: 1}
