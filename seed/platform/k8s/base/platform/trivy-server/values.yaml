# trivy 0.24.0 values — SERVER MODE (A41): the DB (~99MiB) is pulled
# ONCE to the PVC and updates itself; the pipeline is a thin client
# (--server + --input docker-archive; oci-archive does NOT work).
trivy:
  mode: server
service:
  port: 4954
persistence:
  enabled: true
  size: 5Gi
# the chart's extraEnvVars is a MAP, not a list (verified in v1):
extraEnvVars:
  TRIVY_TIMEOUT: "30m"
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: "1", memory: 1Gi}
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
