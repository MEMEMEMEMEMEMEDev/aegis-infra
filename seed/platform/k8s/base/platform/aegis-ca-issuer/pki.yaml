# Internal PKI v2 (multi-doc): SelfSigned bootstrap → ECDSA root CA
# for 10 years → CA ClusterIssuer. For internal SANs that Let's
# Encrypt cannot issue (.svc, ClusterIP) — A24.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: aegis-selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: aegis-internal-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: aegis-internal-ca
  subject:
    organizations: [aegis]
    organizationalUnits: [platform]
  secretName: aegis-internal-ca
  duration: 87600h          # 10 years (decadal rotation)
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef: {name: aegis-selfsigned-bootstrap, kind: ClusterIssuer}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: aegis-internal-ca
spec:
  ca: {secretName: aegis-internal-ca}
---
# Finding A v1.1 (INVERTED webhook dependency): this
# Certificate used to live in argocd-secrets — the App that phase 35
# syncs FIRST, BEFORE cert-manager. On a cold cluster the apply
# died deterministically with "failed calling webhook
# webhook.cert-manager.io: no endpoints available"; it looked
# intermittent only because the root App's auto-sync sometimes
# brought cert-manager up first. Its conceptual place is HERE: next
# to the aegis-internal-ca ClusterIssuer it references — which was
# ALSO born after it (a double inversion). The aegis-ca-issuer App
# syncs after cert-manager, with the webhook already serving.
# The namespace is argocd ON PURPOSE: the resulting Secret is mounted
# by ArgoCD's repo-server to validate the registry's TLS. (Until
# #59 the argocd-image-updater, now retired, used it too.)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: aegis-ca-trust
  namespace: argocd
spec:
  secretName: aegis-ca-trust
  commonName: aegis-ca-trust
  duration: 8760h
  issuerRef: {name: aegis-internal-ca, kind: ClusterIssuer}
