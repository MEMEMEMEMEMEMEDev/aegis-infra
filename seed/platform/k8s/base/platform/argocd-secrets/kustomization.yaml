# argocd-secrets v2: los Secrets "alrededor" de argocd + su
# IngressRoute + el cert CA-trust, que el repo-server usa para validar
# el TLS del registry interno. A7: lista explícita en el generator.
#
# REGLA TEMPORAL (misma que el generator): esta App sincroniza en
# fase 35. imageupdater-hello-aegis.yaml NO se lista acá A PROPÓSITO
# — su CRD lo instala el chart image-updater en la fase 70; listarlo
# estático rompería el sync de la 35 (kind desconocido). La fase 70
# lo agrega a resources EN EL MISMO COMMIT post-CRD (patrón
# same-commit). NO "arreglar" agregándolo a mano.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - extras.yaml
  - netpol.yaml          # W-07 iter2: aislamiento de ingress de argocd (core, sin CRD → estático OK)
generators:
  - secret-generator.yaml
