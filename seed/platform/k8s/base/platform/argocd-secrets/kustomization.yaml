# argocd-secrets v2: the Secrets "around" argocd + its
# IngressRoute + the CA-trust cert, which the repo-server uses to
# validate the internal registry's TLS. A7: explicit list in the
# generator.
#
# TEMPORAL RULE (the same as the generator's): this App syncs in
# phase 35. imageupdater-hello-aegis.yaml is NOT listed here ON
# PURPOSE — its CRD is installed by the image-updater chart in phase
# 70; listing it statically would break the sync of the 35 (unknown
# kind). Phase 70 adds it to resources IN THE SAME COMMIT, post-CRD
# (same-commit pattern). Do NOT "fix" it by adding it by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - extras.yaml
  - netpol.yaml          # W-07 iter2: argocd ingress isolation (core, no CRD → static OK)
generators:
  - secret-generator.yaml
