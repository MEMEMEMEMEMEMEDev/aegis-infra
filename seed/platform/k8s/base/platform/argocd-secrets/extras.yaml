# Recursos "alrededor" de argocd que NO son Secrets.
#
# Hallazgo A v1.1 — REGLA DE ESTE ARCHIVO: la App argocd-secrets es
# la que la fase 35 sincroniza ANTES de argocd-self (los Secrets
# deben existir antes de que el server los resuelva). Por eso acá NO
# puede entrar ningún recurso cuyo CRD o admission webhook lo provea
# una App que sincroniza DESPUÉS: el apply muere determinista con
# "no endpoints available"/"no matches for kind" y cae la fase.
# Ya pasó con Certificate/aegis-ca-trust (webhook de cert-manager)
# → movido a aegis-ca-issuer, junto al ClusterIssuer que referencia.
# El check 73 de verify-static prohíbe la regresión.
#
# El IngressRoute (CRD de traefik) se CONSERVA acá — es la
# exposición de argocd-server, su lugar natural — y la dependencia
# se resolvió por ORDEN: la fase 35 ahora sincroniza cert-manager,
# la PKI y traefik ANTES que argocd-secrets (ninguno de ellos
# depende de estos Secrets, así que adelantarlos es gratis).
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  entryPoints: [web]
  routes:
    - match: Host(`argocd.__ROOT_DOMAIN__`)
      kind: Rule
      services: [{name: argocd-server, port: 80}]
