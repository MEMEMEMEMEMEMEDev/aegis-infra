# Resources "around" argocd that are NOT Secrets.
#
# Finding A v1.1 — THE RULE OF THIS FILE: the argocd-secrets App is
# the one phase 35 syncs BEFORE argocd-self (the Secrets must exist
# before the server resolves them). That is why NO resource whose
# CRD or admission webhook is provided by an App that syncs LATER
# may go in here: the apply dies deterministically with "no
# endpoints available"/"no matches for kind" and the phase falls.
# It already happened with Certificate/aegis-ca-trust (cert-manager's
# webhook) → moved to aegis-ca-issuer, next to the ClusterIssuer it
# references. Check 73 of verify-static forbids the regression.
#
# The IngressRoute (traefik CRD) is KEPT here — it is the
# exposure of argocd-server, its natural place — and the dependency
# was resolved by ORDER: phase 35 now syncs cert-manager, the PKI
# and traefik BEFORE argocd-secrets (none of them depends on these
# Secrets, so moving them up is free).
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  entryPoints: [web, websecure]
  routes:
    - match: Host(`argocd.__ROOT_DOMAIN__`)
      kind: Rule
      services: [{name: argocd-server, port: 80}]
