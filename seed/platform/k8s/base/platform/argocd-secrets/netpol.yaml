# NetworkPolicy of argocd — W-07 iter2 (platform isolation).
# Delivered by the 'argocd-secrets' App (path k8s/base/platform/argocd-
# secrets, dest argocd) — a directory-app that already syncs to that
# namespace. Separate netpol.yaml (the tenant's pattern).
#
# ITER2 = INGRESS-ONLY. The egress of argocd (repo-server → GitHub, app-
# controller → API server, repo-server → GitHub)
# is NOT touched: cutting it wrong would break GitOps and flannel does not
# tell those FQDNs apart. Egress goes to Cilium/Hetzner (ADR-0014). Leaving
# it open breaks nothing.
#
# Risk if the allowlist were wrong: the ArgoCD UI or some internal flow cut
# off — RECOVERABLE (delete netpol; ArgoCD keeps reconciling through the
# app-controller, which uses EGRESS to the API server, not ingress). That is
# why argocd goes in iter2. The API server does NOT ingress into argocd
# (argocd has no admission webhook — unlike kyverno/cert-manager, iter3).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: argocd
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Legitimate clients (matrix §1):
#  - infra-edge (traefik): the argocd-server UI/API and, if present, the
#    webhook receiver. No port restriction on purpose: argocd-
#    server listens insecure/plain HTTP (server.insecure=true) and the
#    effective port varies (80/8080); narrowing the port wrongly would cut
#    the UI. The value —that only the edge gets in— stays the same.
#  - the namespace itself: argocd-server ↔ repo-server (:8081) ↔ redis
#    (:6379) ↔ app-controller ↔ applicationset, all
#    intra-ns. podSelector {} = same namespace, no port restriction.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-and-intra
  namespace: argocd
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: infra-edge}
        - podSelector: {}          # intra-namespace: argocd components
    # observability (phase-85 §7): vmagent scrapes argocd's native
    # /metrics (controller :8082, server :8083, repo-server :8084 —
    # the ports of the `argocd` job in vmagent/values.yaml). On a live
    # instance phase 85 adds it (structural guard):
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
      ports:
        - {protocol: TCP, port: 8082}
        - {protocol: TCP, port: 8083}
        - {protocol: TCP, port: 8084}
