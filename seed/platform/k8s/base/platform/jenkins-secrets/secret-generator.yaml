# A7: EXPLICIT LIST. The .enc.yaml files are produced by the init:
#   phase 15: hello-aegis-repo (RO), github-token (D11), webhook-hmac
#   phase 40: regcred-internal
#   phase 50: jenkins-admin
#   phase 80: cosign-signing-key
# bootstrap NOTE (DECISION E10): the cosign file is NOT in this list
# out of the factory — an entry without a file breaks the kustomize
# build (A7) and jenkins-secrets must sync in phase 50. Phase 80 adds
# the line `secret-cosign-signing-key.enc.yaml` together with the
# .enc.yaml, in the SAME commit (atomic synchrony).
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: jenkins-secrets
  annotations:
    config.kubernetes.io/function: |
      exec: {path: ksops}
files:
  - secret-jenkins-admin.enc.yaml
  - secret-hello-aegis-repo.enc.yaml
  - secret-regcred-internal.enc.yaml
  - secret-github-token.enc.yaml
  - secret-ops-stack-repo-ro.enc.yaml
  - secret-github-webhook-hmac.enc.yaml
  # EDGE credentials, for the edge-chequeo job. Phase 15 produces
  # them —the freshly minted token and three values from the conf— so
  # they exist long before this App syncs in the 50.
  #
  # All four were in the live instance and in NO phase: they had been
  # created by hand with sops while building the edge job and were
  # never wired up here (#48). On a start with a new age key they were
  # left encrypted with a key that no longer exists.
  #
  # The TOKEN is a credential; the other three are identifiers, not
  # secrets. They are encrypted all the same because the mechanism is
  # a single one: an exception "this one does not need encrypting" is
  # an exception you have to remember afterwards.
  - secret-cloudflare-api-token.enc.yaml
  - secret-cloudflare-account-id.enc.yaml
  - secret-cloudflare-zone-id.enc.yaml
  - secret-root-domain.enc.yaml
