# jenkins-system: ns + RQ + CA-trust cert + IngressRoute (v2).
# PSS BASELINE (W-05): the build NO LONGER needs to be privileged —
# kaniko builds without /dev/fuse and without privileges (it extracts
# layers straight to the FS). baseline (not restricted) because kaniko
# runs as root in the container (root != privileged: it does NOT escape
# to the node); restricted forbids root. It is an enormous jump down
# from privileged — the escape to the node from the build (where
# untrusted code comes in via npm ci) is closed. The run validates that
# kaniko runs under baseline. Going to restricted = future debt (real
# rootless kaniko / buildkit).
---
apiVersion: v1
kind: Namespace
metadata:
  name: jenkins-system
  labels:
    aegis.dev/part-of: aegis-platform
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: jenkins-quota
  namespace: jenkins-system
spec:
  hard:
    # Sized with arithmetic, not by eye (run #11: with "8" a normal
    # overlap — residual ci-images 2500m + app build 4000m +
    # jenkins-0 2200m = 8700m — exhausted the quota, the plugin could
    # not create the pod and the build stayed queued forever).
    # Invariant (check 36 of verify-static watches it):
    #   quota >= jenkins-0 + 2 × heaviest-build-pod
    # because multibranch retries/overlaps ARE the normal case, not
    # the exception. Today: limits jenkins-0 = 2200m/2.25Gi; app build
    # = 5000m/4.25Gi (W-05: +crane container for the push of the
    # scanned tar) → minimum 12200m/10.75Gi. limits are a ceiling, not
    # a reservation — overcommit is cheap:
    requests.cpu: "6"
    requests.memory: 8Gi
    limits.cpu: "13"
    limits.memory: 12Gi
  # A29: a strict RQ => EVERY container (init/sidecar/jnlp/buildah)
  # needs limits; the chart values declare them all.
---
# vehicle for the ca.crt for buildah (cainjector does not propagate — A26):
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: aegis-ca-trust
  namespace: jenkins-system
spec:
  secretName: aegis-ca-trust
  commonName: aegis-ca-trust
  duration: 8760h
  issuerRef: {name: aegis-internal-ca, kind: ClusterIssuer}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jenkins
  namespace: jenkins-system
spec:
  entryPoints: [web, websecure]
  routes:
    - match: Host(`jenkins.__ROOT_DOMAIN__`)
      kind: Rule
      services: [{name: jenkins, port: 8080}]
