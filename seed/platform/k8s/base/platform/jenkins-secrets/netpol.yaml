# NetworkPolicy of jenkins-system — W-07 iter2 (platform isolation).
# Delivered by the 'jenkins-secrets' App (path k8s/base/platform/jenkins-
# secrets, dest jenkins-system) — the same directory-app that already
# brings the namespace/RQ/cert/IngressRoute. Separate netpol.yaml (the
# tenant's pattern).
#
# ITER2 = INGRESS-ONLY (see trivy-system/netpol.yaml for why egress is not
# touched: the builds need to get out to npm/docker.io/gcr.io/github and
# flannel does not do FQDN — that is Cilium/Hetzner, ADR-0014). Leaving
# egress open is THE SAFE THING: it breaks neither `npm ci`, nor the pull
# of kaniko base images, nor the push to the registry, nor DNS.
#
# The real value here: NOBODY outside the edge and the namespace itself can
# reach Jenkins. In iter1 the tenant already could not (through its own
# default-deny egress); this closes it from the Jenkins side and also
# against ANY other namespace. Risk if the allowlist were wrong:
# UI/webhook/agents cut off — RECOVERABLE (delete netpol). That is why
# jenkins-system goes in iter2.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: jenkins-system
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Legitimate clients (matrix §1):
#  - infra-edge (traefik): the Jenkins UI AND the GitHub webhook, which
#    comes in through the tunnel → cloudflared → traefik → jenkins
#    :8080. Port verified in the IngressRoute (services: jenkins:8080).
#  - the namespace itself: the agent pods (JNLP :50000) talk to the
#    controller and vice versa; intra-ns with no port restriction (the
#    controller↔agent uses several). podSelector {} = same namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-and-agents
  namespace: jenkins-system
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: infra-edge}
      ports:
        - {protocol: TCP, port: 8080}
    - from:
        - podSelector: {}          # intra-namespace: controller ↔ JNLP agents
    # observability (phase-85 §7): vmagent scrapes the controller's
    # /prometheus on :8080 (`prometheus` plugin). Without this entry,
    # up==0 with everything «healthy» — a scrape hole indistinguishable
    # from an incident. On a live instance phase 85 adds it (structural
    # guard, never a grep for a mention):
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
      ports:
        - {protocol: TCP, port: 8080}
