# cloudflared v2 — the token comes from the KSOPS Secret that phase
# 25 encrypted from `tofu output` (never on screen). A high
# restartCount with an intermittent network = correct reconnection,
# not a bug (v1 memory).
#
# --metrics 0.0.0.0:2000 + containerPort (hooks.md / phase-85 §7, the
# 2-line plug): vmagent scrapes the tunnel's reconnections and active
# connections (`cloudflared` job). In the seed it ships from the
# factory; on a live instance phase 85 adds it with a structural guard.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: infra-edge
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: cloudflared}
  template:
    metadata:
      labels: {app.kubernetes.io/name: cloudflared}
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2025.6.1
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
          ports:
            - {name: metrics, containerPort: 2000}
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-tunnel-token
                  key: TUNNEL_TOKEN
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
