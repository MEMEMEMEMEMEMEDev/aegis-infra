# traefik 40.3.0 v2 values. A31 baked in: trustedIPs of the /16 pod
# CIDR (cloudflared sends X-Forwarded-*; without this, backends that
# auto-detect the scheme —Jenkins— serve mixed content). NEVER
# insecure:true.
service:
  # chart 40.x: the type goes in service.spec.* — with service.type
  # the chart IGNORES it silently and renders its LoadBalancer default
  # → an eternal EXTERNAL-IP <pending> with servicelb disabled
  # (run #5; verified against helm template of the real chart):
  spec:
    type: ClusterIP      # traffic COMES IN via cloudflared, not an LB
    # A FIXED ClusterIP, and the reason is EDGE=local: there the traffic
    # does not come from a pod but from a bridge ON THE HOST, and a unit
    # in /etc/systemd cannot ask the apiserver where traefik is today. A
    # ClusterIP that changes on every re-creation is a bridge that points
    # nowhere after the first `destroy`. Under cloudflare it is inert
    # (cloudflared resolves by Service name) — one value, both profiles.
    # It has to be free inside k3s' service CIDR: .1 is kubernetes and
    # .10 is kube-dns.
    clusterIP: 10.43.0.80
ports:
  web:
    forwardedHeaders:
      trustedIPs: ["10.42.0.0/16"]   # /16: covers multi-node hetzner
  websecure:
    # Serving TLS here is what EDGE=local needs and what EDGE=cloudflare
    # never exercises: with the tunnel in front, nothing reaches 443.
    # The certificate is NOT configured per-route: the default TLSStore
    # of k8s/base/ingress/edge-tls carries the wildcard, so a route that
    # lists `websecure` is served without naming a secret.
    # Chart 40.x keys this under `http.tls` (a `tls:` straight under
    # the port fails the chart's schema — the first VPS run hit it);
    # `enabled: true` is also the chart's default, written out so the
    # intent survives a chart bump that changes the default.
    http:
      tls:
        enabled: true
    forwardedHeaders:
      trustedIPs: ["10.42.0.0/16"]
# traefik is the ONE door every tenant, console and demo shares. With one
# replica and 256Mi it was OOMKilled at ~1600 req/s towards a canary
# throttled on its CPU (plan/19 B-3, 2026-09-24: exit 137 after its
# probes failed): the requests queue in traefik's memory while the
# backend chokes. Two replicas keep the door open while one restarts,
# and 512Mi gives the queue room. On a single node both land on the
# same host: this buys a restart, not a failure domain.
# HOW LONG traefik waits for a backend (plan/19 B-9). With nothing set,
# the running binary (traefik v3.7.4, its own --help) dials for 30 s and
# waits for response headers FOREVER: during a 90 s network cut between
# traefik and the canary (2026-09-24, Chaos Mesh partition) every visitor
# hung until their client gave up, instead of getting a fast answer.
#   dialTimeout 5s: a pod on the same node answers a connect in
#     milliseconds; five seconds without a TCP handshake is a dead backend.
#   responseHeaderTimeout 60s: the wait for the FIRST byte of headers, not
#     for the whole response. Streaming (the AI chat's SSE, WebSockets)
#     sends its headers at once and is unaffected; a request that has not
#     produced a single header in a minute is hung. It also stays under
#     Cloudflare's own 100 s cut (524), so the visitor gets traefik's 504
#     with a cause instead.
additionalArguments:
  - "--serversTransport.forwardingTimeouts.dialTimeout=5s"
  - "--serversTransport.forwardingTimeouts.responseHeaderTimeout=60s"
deployment:
  replicas: 2
resources:
  requests: {cpu: 200m, memory: 256Mi}
  limits: {cpu: "1", memory: 512Mi}
