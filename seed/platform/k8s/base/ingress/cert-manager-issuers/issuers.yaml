# Let's Encrypt ClusterIssuers v2 — DNS-01 (there is no port 80
# exposed). Pattern: staging FIRST, flip to prod after validating the
# ACME pipeline (rate limit). The token lives ONLY in the KSOPS Secret
# (D7: its only consumer is this ns).
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: {name: letsencrypt-staging}
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: __ACME_EMAIL__
    privateKeySecretRef: {name: le-staging-account}
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef: {name: cloudflare-dns-token, key: api-token}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: {name: letsencrypt-prod}
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: __ACME_EMAIL__
    privateKeySecretRef: {name: le-prod-account}
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef: {name: cloudflare-dns-token, key: api-token}
