# NetworkPolicy of trivy-system — W-07 iter2 (platform isolation).
# Delivered by the 'trivy-system' App (path k8s/base/trivy-system, dest
# trivy-system) — the same directory-app that already creates the
# namespace, with no new App and no cross-namespace (the tenant's pattern:
# netpol.yaml alongside the rest).
#
# ITER2 = INGRESS-ONLY. flannel/kube-router (the CNI of k3s) does NOT do
# FQDN egress, so restricting trivy's way out to its DB (ghcr/aquasec) is
# unfeasible here — real egress is deferred to Cilium/Hetzner (ADR-0014).
# Not declaring Egress leaves the way out open: the download of the
# vulnerability DB and DNS keep working (nothing breaks).
#
# Risk if this allowlist were wrong: the scan fails — RECOVERABLE
# (`kubectl delete netpol -n trivy-system --all`) and besides, the
# Jenkinsfile already tolerates trivy-server being absent at bootstrap
# (WARN, does not break). That is why trivy-system goes in iter2 and not
# in the iter3 of the 🔴🔴.
# The node exception (validated in the v1 run: the canary went Ready
# under default-deny) covers the kubelet probes.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: trivy-system
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Legitimate clients:
#  - jenkins-system: the build pods scan against trivy :4954 (server
#    mode). Port verified in Jenkinsfile.app (TRIVY_SERVER=...:4954).
#  - the namespace itself: the init's 'trivy-responde' gate runs a
#    trivy-probe pod INSIDE trivy-system that curls trivy:4954/healthz
#    (phase 80). Without this intra-ns, default-deny cut it off and phase
#    80 stalled with trivy 1/1 Running but unreachable (integration run
#    2026-07-23). podSelector {} = same namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-scan-from-jenkins
  namespace: trivy-system
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: jenkins-system}
        - podSelector: {}          # intra-ns: the init gate's trivy-probe
      ports:
        - {protocol: TCP, port: 4954}
    # observability (phase-85 §7): blackbox probes trivy's /healthz
    # on :4954 (job `blackbox-trivy` — the watcher of the watcher, for
    # availability; the AGE of the DB is pushed by the trivy-db-age
    # CronJob, which runs INSIDE this ns and goes out by egress, does not
    # come in). On a live instance phase 85 adds it (structural guard):
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
      ports:
        - {protocol: TCP, port: 4954}
