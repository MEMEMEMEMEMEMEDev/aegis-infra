apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: ai-system-secrets
  annotations:
    config.kubernetes.io/function: |
      exec: {path: ksops}
# EXPLICIT LIST (A7): no globs. A glob silently takes in any .enc.yaml
# that lands in this directory.
#
# NEITHER FILE TRAVELS IN THE SEED: both are born on the instance,
# encrypted to its own age key, and phase 87 writes them. Check 145
# derives that obligation from this very list — a generator naming a
# file nobody writes leaves the whole Application unable to render,
# while ArgoCD reports Healthy about nothing.
files:
  # Read credential for the internal registry. The same credential as
  # every other namespace's, replicated here because a Secret does not
  # cross namespaces.
  - secret-regcred-internal.enc.yaml
  # The SHA-256 HASHES of the per-organization API keys, never the keys.
  # That it is a Secret and not a ConfigMap is not about the content —
  # you cannot come back from a hash — but so that the read radius is
  # the same as any credential's: whoever can read this could mount a
  # dictionary attack if some key were guessable.
  #
  # It is SHARED by every organization, which is why `aegis ai key`
  # edits it entry by entry and never rewrites it: a mistyped onboarding
  # would overwrite another tenant's row.
  - secret-ai-keys.enc.yaml
