# engine-cpu — the AI lane that does not touch the GPU.
#
# Speech synthesis, transcription, embeddings and object detection, all
# on CPU. It is independent of the GPU pair: an instance with no card
# can run this lane alone (see the protocol's §0).
#
# ITS SOURCE IS IN THIS ARTIFACT (ai/engine-cpu/) and its image is built
# by the platform, unlike the gateway's. The Containerfile there starts
# from a mirrored base, the pipeline scans and signs, and the digest is
# set by the kustomization's `images:` block.
#
# THE WEIGHTS DO NOT TRAVEL IN THE IMAGE. They land on the modelos-cpu
# volume, seeded with `aegis ai models`. That keeps the image around a
# gigabyte instead of two and — more importantly — changing a model does
# not force a re-signature: two different life cycles.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: modelos-cpu
  namespace: ai-system
  labels: {aegis.dev/component: ai}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  # ~1 GiB of weights today (a voice model, an embedding model, a
  # detector and a small transcriber). 4Gi leaves room for a larger
  # transcriber without re-declaring.
  resources: {requests: {storage: 4Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine-cpu
  namespace: ai-system
  labels: {aegis.dev/component: ai, app: engine-cpu}
spec:
  # ALWAYS 1 replica, with no mode controller: unlike the GPU engines
  # there is no VRAM to give back — off it gives nobody anything, and on
  # it costs ~1.5 GiB of RAM and no CPU at rest.
  replicas: 1
  # Recreate, not RollingUpdate, and here the reason is the QUOTA and
  # not the card: a rolling update wants the old pod and the new one at
  # once, which is 12 CPUs of limits in a namespace whose ceiling is 20
  # shared with both GPU engines and the gateway — the first rollout of
  # the previous lineage stuck in FailedCreate on exceeded quota. With
  # one node and ~15 s of start-up, the Recreate gap is cheaper than
  # reserving quota for a second pod that only exists during deploys.
  #
  # AND IT MUST BE BORN THIS WAY. Converting a live Deployment from
  # RollingUpdate to Recreate fails forever with "Forbidden: may not be
  # specified": a strategic merge does not drop the `rollingUpdate`
  # block the live object keeps, and the `rollingUpdate: null` that
  # would drop it does not travel — kustomize prunes null fields while
  # building. Born fresh it is fine.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: engine-cpu}
  template:
    metadata:
      labels: {app: engine-cpu, aegis.dev/component: ai}
    spec:
      # ── WHY THIS ENGINE TAKES NO TURN ──────────────────────────────
      #
      # `engine-mt` waits for `engine-llm` to serve before it starts,
      # so the two GPU lanes do not reserve VRAM in the same instant.
      # The obvious next step is to hang this one off the end of that
      # chain, and it was proposed. It is wrong, for two measured
      # reasons.
      #
      # ONE: this engine is ALWAYS UP and the GPU ones almost never
      # are. The controller scales llm and mt between 0 and 1 with the
      # mode; engine-cpu has replicas 1 permanently. A wait on
      # engine-mt's /health would therefore spend the full 600 s cap on
      # every ordinary start, because the thing it is waiting for is
      # not coming — the CPU lane would be ten minutes late to serve
      # embeddings so that it could avoid a peak that is not happening.
      #
      # TWO: taking turns does not lower the steady state, only the
      # transient. engine-llm stays resident once it is ready, so when
      # engine-mt then loads, both are in memory anyway: 6.42 + 6.08 +
      # 2.24 GiB measured 2026-09-09. What the turn buys is that the
      # two LOADING spikes do not land together; what governs the total
      # is `aegis host budget`, and that is where it belongs.
      containers:
        - name: engine
          # The digest is set by the kustomization's `images:` block.
          image: registry.registry-system.svc.cluster.local:5000/aegis-engine-cpu
          env:
            - {name: AEGIS_EN_CLUSTER, value: "1"}
            - {name: AEGIS_MODELOS_CPU, value: /models}
            # A PATH and not an alias: there is no internet egress here
            # (netpol), and an alias would make the transcriber try to
            # download it. `aegis ai models` seeds the directory.
            - {name: AEGIS_WHISPER, value: /models/whisper-small}
            # Offline explicitly, same argument as the GPU engines: if a
            # model is missing the error must be "it is not there", not
            # a hang against a closed network.
            - {name: HF_HUB_OFFLINE, value: "1"}
            # ── THE THREAD BUDGET, AND WHY IT IS WRITTEN HERE ────────
            #
            # `motor.py` reads all eight of these and, until
            # 2026-09-09, this manifest set none of them — so the
            # engine ran the defaults its own comment describes as a
            # budget "over 32 threads", inside a container whose
            # `limits.cpu` is 6.
            #
            # It is not that the defaults were wrong; it is that
            # NOTHING INSIDE A CONTAINER KNOWS ITS OWN LIMIT. `nproc`
            # in here answers 32, because a cgroup caps CPU TIME and
            # does not change what the kernel reports. Measured
            # 2026-09-09 in the live pod: nproc 32, sixty threads in
            # the process, limit 6. Every library that sizes a pool
            # from `cpu_count()` does this, which is why these numbers
            # have to be declared next to the limit they answer to.
            #
            # WHAT CHANGED AND WHAT DID NOT, on purpose: the WORKERS
            # are untouched, so concurrency is exactly what it was —
            # four transcriptions at once is what the gateway's
            # AI_EN_VUELO_CPU=4 expects to be able to hand over. What
            # comes down is THREADS PER WORKER, which is intra-op
            # parallelism with sharply diminishing returns on models
            # this size, and which is where the oversubscription lived.
            #
            # The budget: oido 4x1 + voz 2x1 + vision 2x1 + vector 2x1
            # = 10 at the theoretical peak against a limit of 6. The
            # original chose 48 over 32 threads, a ratio of 1.5; this
            # is 1.67, and these caps still do not all happen at once.
            - {name: AEGIS_HILOS_OIDO, value: "1"}
            - {name: AEGIS_HILOS_VOZ, value: "1"}
            - {name: AEGIS_HILOS_VISION, value: "1"}
            - {name: AEGIS_HILOS_VECTOR, value: "1"}
            - {name: AEGIS_OBREROS_OIDO, value: "4"}
            - {name: AEGIS_OBREROS_VOZ, value: "2"}
            - {name: AEGIS_OBREROS_VISION, value: "2"}
            - {name: AEGIS_OBREROS_VECTOR, value: "2"}
            # And the libraries underneath, which size their own pools
            # from cpu_count() without asking anybody. One thread each,
            # because here the WORKER count is the concurrency.
            - {name: OMP_NUM_THREADS, value: "1"}
            - {name: MKL_NUM_THREADS, value: "1"}
            # glibc opens up to eight malloc arenas per core and does
            # not give them back. On a 32-thread machine inside a
            # container with a memory limit, that is measured as a leak.
            - {name: MALLOC_ARENA_MAX, value: "2"}
          ports:
            - {name: http, containerPort: 8600}
          volumeMounts:
            - {name: models, mountPath: /models, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          # The four models load in ~10 s measured; 60 s of grace covers
          # a cold node with the volume on a slow disk.
          startupProbe:
            httpGet: {path: /healthz, port: 8600}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /healthz, port: 8600}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8600}
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          resources:
            # Measured RSS with the four models loaded: ~1.5 GiB. The
            # request covers that; the limit leaves air for the workers'
            # buffers under load.
            #
            # CPU: the per-engine ceilings (threads x workers) are caps
            # that do not all happen at once; 6 CPUs of limit is the
            # measured real ceiling with three of them saturated,
            # without letting a burst take half the node.
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "6"
              memory: 3Gi
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: modelos-cpu}
        # readOnlyRootFilesystem demands a writable /tmp of its own: the
        # media and inference runtimes materialise small temporaries
        # there.
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: engine-cpu
  namespace: ai-system
  labels: {aegis.dev/component: ai}
spec:
  selector: {app: engine-cpu}
  ports:
    - {name: http, port: 8600, targetPort: 8600}
