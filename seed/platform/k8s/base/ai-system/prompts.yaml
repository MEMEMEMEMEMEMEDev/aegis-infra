# ╔══════════════════════════════════════════════════════════════════╗
# ║  HAND-WRITTEN — the only file of ai-system that is NOT generated ║
# ╚══════════════════════════════════════════════════════════════════╝
# Prompts are CONTENT: a person writes them and they come out of no
# contract. What IS derived is the task registry (registro.yaml,
# generated by `aegis org apply` from the `ai.tareas` of each contract),
# and that is why they live in separate files: mixing something
# generated with something hand-written guarantees that sooner or later
# the generator overwrites what somebody wrote.
#
# The prompt file NAME of each task DOES come from the contract
# (`prompt: <file>.txt`). If the key the contract names is missing here,
# the gateway starts and the task fails when it is invoked.
#
# EMPTY IN THE SEED, and that is not an oversight — it is the same
# decision as ai/tasks.yaml. A prompt exists because an organization
# declared a task that uses it, and a freshly born instance has no
# contracts. Inheriting prompts from another instance would mean
# importing the voice of a character nobody wrote.
#
# THE PREFIX HAS TO BE BYTE-STABLE. The engines' prefix cache takes
# time-to-first-token from ~1000 ms to ~25 ms when the beginning of the
# prompt does not change between requests. That is why the gateway
# always assembles [invariant system] + [history] + [new message], and
# why nothing variable can go in here: not a date, not a visitor's name,
# not a counter. Editing a prompt invalidates the cache once and that is
# that; putting something variable inside invalidates it ALWAYS, with no
# error — just a first token forty times slower. It is the easiest
# mistake to make and the hardest to notice.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-prompts
  namespace: ai-system
  labels: {aegis.dev/component: ai}
data: {}
