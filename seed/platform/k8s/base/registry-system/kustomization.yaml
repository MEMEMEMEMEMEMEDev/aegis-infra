# kustomization registry-system v2. KSOPS generator con LISTA
# EXPLÍCITA (A7): cada .enc.yaml nuevo = entry nuevo ACÁ, o el
# Secret no existe aunque la App esté Healthy.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # namespace.yaml PRIMERO (corrida #7, bug A): la App registry tenía
  # CreateNamespace=true pero es una app KUSTOMIZE/KSOPS y el sync
  # falló "namespaces registry-system not found" — CreateNamespace
  # resultó NO confiable para apps kustomize (sí lo es para apps HELM:
  # cert-manager, infra-edge). trivy-system y kyverno-base (que también
  # tienen CreateNamespace=true) funcionaron porque declaran el ns
  # explícito. Se iguala al patrón que SÍ funciona:
  - namespace.yaml
  - registry.yaml
  # NetworkPolicies: escritas pero NO listadas hasta Cilium
  # (ADR-0014; kube-router no enforce — validar enforcement
  # POSITIVO antes de activarlas).
generators:
  - secret-generator.yaml
