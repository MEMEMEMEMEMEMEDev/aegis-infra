# registry v2 (multi-doc) — TLS from day one (a detour asked for by
# the source: 2026-07-04:7). Potholes baked in: EXPLICIT args (without
# args the binary ignores the ConfigMap and starts WITHOUT AUTH,
# silently — A23), tcpSocket probes (401 breaks httpGet — A23), FIXED
# ClusterIP paired with the cert's SAN (A24/A30).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-config
  namespace: registry-system
  labels: {aegis.dev/part-of: aegis-platform}
data:
  config.yml: |
    version: 0.1
    storage:
      filesystem: {rootdirectory: /var/lib/registry}
      delete: {enabled: true}
    http:
      addr: :5000
      tls:
        certificate: /certs/tls.crt
        key: /certs/tls.key
      # distribution metrics (hooks.md / phase-85 §7): a debug
      # listener SEPARATE from the public one — :5001 is exposed only
      # to ClusterIP (vmagent, `registry` job), never through the edge.
      # Plain HTTP on purpose: the registry cert does not list :5001
      # and the scrape is in-cluster. On a live instance phase 85 adds
      # it (structural guard + pod restart: the ConfigMap alone does
      # not restart it):
      debug:
        addr: :5001
        prometheus: {enabled: true}
    auth:
      htpasswd:
        realm: aegis-registry
        path: /auth/htpasswd
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry-system
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  clusterIP: __REGISTRY_CLUSTER_IP__   # FIXED: cert SAN + mirror host
  selector: {app.kubernetes.io/name: registry}
  # two ports ⇒ K8s demands naming BOTH of them (the §7 budget said
  # "1 line"; the name of the 5000 is validation cost, not scope):
  ports:
    - {name: registry, port: 5000, targetPort: 5000}
    - {name: metrics, port: 5001, targetPort: 5001}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: registry-tls
  namespace: registry-system
spec:
  secretName: registry-tls
  duration: 2160h        # 90d; auto-renewal at 60d. INHERITED
  renewBefore: 720h      # operational debt: the pod does NOT restart
                         # by itself — manual restart ~60d or Reloader
                         # with 3+ pods (B11).
  issuerRef: {name: aegis-internal-ca, kind: ClusterIssuer}
  dnsNames:
    - registry.registry-system.svc.cluster.local
    - registry.registry-system.svc
    - registry.registry-system
  ipAddresses: [__REGISTRY_CLUSTER_IP__]   # the kubelet validates the IP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry-system
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  replicas: 1
  strategy: {type: Recreate}    # RWO PVC
  selector:
    matchLabels: {app.kubernetes.io/name: registry}
  template:
    metadata:
      labels: {app.kubernetes.io/name: registry}
      # A22: do NOT touch the labels/annotations here cosmetically —
      # it rotates the pod (template hash) with selfHeal active.
    spec:
      containers:
        - name: registry
          image: registry:3.1.1
          # A23: WITHOUT args the binary uses the default config (NO auth):
          args: ["serve", "/etc/distribution/config.yml"]
          ports: [{containerPort: 5000}]
          volumeMounts:
            - {name: config, mountPath: /etc/distribution}
            - {name: data, mountPath: /var/lib/registry}
            - {name: tls, mountPath: /certs, readOnly: true}
            - {name: auth, mountPath: /auth, readOnly: true}
          readinessProbe:
            tcpSocket: {port: 5000}    # A23: httpGet returns 401
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket: {port: 5000}
            initialDelaySeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: config
          configMap: {name: registry-config}
        - name: data
          persistentVolumeClaim: {claimName: registry-data}
        - name: tls
          secret: {secretName: registry-tls}
        - name: auth
          secret: {secretName: registry-htpasswd}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: registry-system
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 10Gi}}
