# NetworkPolicies for the org-canary tenant — W-07 / R1 / P-D
# ("tenant isolation was conceptual, not technical"). k3s enforces
# networking.k8s.io/v1 with its embedded controller (kube-router) — it
# does NOT require Cilium (the "when Cilium arrives" comment in the
# kustomization is obsolete; verified in 04-netpol-diseno.md §5).
# Rollout: the tenant is step 1 (least risk, most value). The platform
# namespaces come in a later iteration (kyverno/cert-manager last:
# cutting their ingress wrong = a cluster with no admission).
#
# RISK C7 (only the run confirms it): if the k3s controller does NOT
# exempt node traffic, the ingress default-deny could cut the kubelet
# probe (readiness on :8080/healthz) and leave the canary NotReady.
# The design, which MEASURED the traffic, assumes the host is
# exempted; if the run shows NotReady, add an ingress rule for the
# node's CIDR.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: org-canary
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# only the edge (traefik in infra-edge) gets in, and only to the app's
# port. podSelector {}: any pod of the tenant (robust to the ephemeral
# canary):
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-ingress
  namespace: org-canary
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: infra-edge}
      ports:
        - {protocol: TCP, port: 8080}
---
# Traffic INSIDE the namespace itself. Without this the tenant could
# only serve single-pod apps: a front end could not talk to its
# backend, nor a backend to its redis or its database — the
# default-deny cuts pod↔pod traffic within the same namespace too,
# something that surprises everyone the first time (one pictures the
# default-deny as the namespace's boundary, and it is EVERY POD's
# boundary).
#
# `podSelector: {}` inside `from`/`to` means "any pod in THIS
# namespace" — NOT in all of them. Isolation between tenants stays
# intact: org-canary still cannot talk to any other namespace, and
# nobody from outside gets in except the edge.
#
# SCOPE CHOSEN ON PURPOSE: the namespace is the trust boundary, so
# inside it everything is allowed. The alternative —one policy per
# app, with label selectors— is stricter but demands a new rule for
# every pair of components that talk to each other, and getting that
# wrong breaks at runtime in ways that are hard to diagnose. When two
# INDEPENDENT apps share a namespace and the goal is that they not see
# each other, that is the right refinement; meanwhile, apps with
# different owners go in different organizations, which is the
# boundary the platform does enforce.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: org-canary
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
# only DNS goes out (the #1 netpol mistake is forgetting :53 and
# breaking all resolution). A static SPA needs no more egress.
#
# There is NO egress to the internet, and that is deliberate: an app
# that needs to call an external API asks for it with its own explicit
# rule. That way the default stays closed and every way out to the
# network is written down somewhere. (Image pulls do NOT go through
# here: the kubelet does them, and it is not subject to
# NetworkPolicy.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: org-canary
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
