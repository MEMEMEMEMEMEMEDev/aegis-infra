---
# The canary's routing — THE ONLY hand-written IngressRoute, and for
# a reason that is not laziness.
#
# Since #54 an organization's routing is derived by `aegis org` from
# its contract, and the IngressRoute kind is forbidden in every
# tenant's AppProject: an AppProject filters by *kind* and never by a
# field's value, so for as long as a tenant could create one, it could
# claim its neighbour's Host. Measured on 2026-08-06 on this very
# instance: two organizations claimed the same hostname, both were
# admitted without a complaint, and traefik ended up serving the
# second one's.
#
# The canary HAS NO CONTRACT, and that is deliberate: it exists to
# prove that the tenant path works, so it cannot depend on that path.
# With no contract there is nothing to derive from, and that is why
# its route is written here, on the platform's side — which is the
# part that matters. What closes the hole is not that the route is
# GENERATED: it is that the app's repo does not write it.
#
# Nor does it follow the `<org>-<service>:8080` convention the
# platform imposes on organizations with a contract. The canary has
# exposed `hello-aegis:80` since before the convention existed, and
# aligning it would mean touching the very repo that serves as the
# reference for checking that the tenant path still works. It is left
# as it is and said out loud here, which beats a silent rename.
#
# ── THE THREE EDGE MIDDLEWARES (#81, #90) ─────────────────────────
#
# Hand-written too, and for the same reason as the route: the canary
# has no contract to derive them from. But it has to carry them all
# the same — `aegis.__ROOT_DOMAIN__` is a public hostname like any
# other, and leaving it out would make the canary the only site
# without protection precisely because it is the one that proves
# everything works.
#
# They are BYTE FOR BYTE the ones `aegis org` generates for an
# organization with a contract (render_routes). That is real
# duplication, accepted in exchange for the canary staying free of
# the very path it exists to test. Check 91b of verify-static
# compares the two sides: it parses both `spec:` bodies and compares
# those rather than the characters, precisely so that rewording these
# comments cannot turn it red — but changing the generator and
# forgetting this file does.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: canary-cabeceras
  namespace: org-canary
  labels: {aegis.dev/part-of: aegis-organizaciones}
spec:
  headers:
    forceSTSHeader: true
    stsSeconds: 15552000
    stsIncludeSubdomains: false
    contentTypeNosniff: true
    browserXssFilter: false
    referrerPolicy: strict-origin-when-cross-origin
    contentSecurityPolicy: "frame-ancestors 'none'"
    customResponseHeaders:
      X-Frame-Options: "DENY"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: canary-ritmo
  namespace: org-canary
  labels: {aegis.dev/part-of: aegis-organizaciones}
spec:
  rateLimit:
    average: 50
    burst: 100
    period: 1s
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: canary-cuerpo
  namespace: org-canary
  labels: {aegis.dev/part-of: aegis-organizaciones}
spec:
  buffering:
    maxRequestBodyBytes: 10485760
    memRequestBodyBytes: 1048576
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  # `canary-ruteo` and not `hello-aegis`: during the transition it
  # coexists with the route the canary's repo still creates, and two
  # objects with the same name would be two Applications fighting
  # over the same resource. Once the old one is deleted, this is the
  # only one left.
  name: canary-ruteo
  namespace: org-canary
  labels: {aegis.dev/part-of: aegis-organizaciones}
spec:
  entryPoints: [web]
  routes:
    - kind: Rule
      match: Host(`aegis.__ROOT_DOMAIN__`)
      middlewares:
        - {name: canary-cabeceras}
        - {name: canary-ritmo}
        - {name: canary-cuerpo}
      services:
        - {name: hello-aegis, port: 80}
