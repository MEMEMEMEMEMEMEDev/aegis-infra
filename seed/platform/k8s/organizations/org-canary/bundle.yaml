# org-canary tenant v2 — full pattern A: the platform provides the
# HOW of pulling (default SA + regcred); apps declare no credentials.
---
apiVersion: v1
kind: Namespace
metadata:
  name: org-canary
  labels:
    aegis.dev/part-of: aegis-tenants
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: org-canary-quota
  namespace: org-canary
spec:
  hard:
    # Sized for several real apps with their dependencies (front end
    # + backend + cache + database), not for the one-pod canary. The
    # node has 32 cores and 30 GiB; with these ceilings the tenant
    # cannot starve the control plane or a second tenant.
    requests.cpu: "8"
    requests.memory: 8Gi
    limits.cpu: "16"
    limits.memory: 16Gi
    # Object ceiling: a reconciliation bug that creates pods or PVCs
    # in a loop is stopped here instead of taking the node down.
    pods: "50"
    persistentvolumeclaims: "10"
    # CAREFUL — this limits the DECLARED size of the PVCs, not the
    # used one: local-path binds a host directory and imposes no disk
    # quota. A pod can write past its PVC until it fills /. The real
    # limit on the disk is still the disk.
    requests.storage: 50Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: org-canary
# W-07 iter2 (tenant RBAC): the tenant does NOT use the K8s API (the
# app runs, it does not administer it) → do not mount its token in the
# pods. A compromised pod cannot talk to the apiserver with the SA.
# The static app does not notice; an app that DOES need the API asks
# for it at the pod level.
automountServiceAccountToken: false
imagePullSecrets:
  - name: regcred-internal     # A40: pattern A for pulling
---
# The canary's nested App (app repo, dev overlay — ADR-0004/7):
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-aegis
  namespace: argocd
  labels: {aegis.dev/part-of: aegis-tenants}
spec:
  project: aegis-tenant-canary
  source:
    repoURL: git@github.com:__GH_OWNER__/__APP_REPO__.git
    targetRevision: main
    path: k8s/overlays/dev
  destination: {server: https://kubernetes.default.svc, namespace: org-canary}
  syncPolicy:
    automated: {selfHeal: true}
    syncOptions: [ServerSideApply=true]
  # NO ignoreDifferences on the image — deliberately. This App used to
  # ignore .spec.template.spec.containers[].image, for the reason the
  # tenants once had: the signing policy has mutateDigest and appends
  # the digest at admission, so with a TAG in git desired != live
  # forever. But the pipeline writes the DIGEST into git
  # (ci/write-digest.mjs), the mutation is a no-op, and ignoring the
  # image then hides the one change that matters: a new digest. On the
  # first clean instance (2026-08-27) the signed build wrote its digest,
  # ArgoCD compared, saw "no difference", skipped the auto-sync, and the
  # canary stayed on the unsigned image that Kyverno rightly refused to
  # restart. Finding #36, the same one the tenants' generator records —
  # the canary had been left behind.
