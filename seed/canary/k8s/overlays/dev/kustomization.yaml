apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  # This newTag is ONLY the INITIAL tag and its number is not assumed
  # (H1 run #13: build #1 of the multibranch is the cosmetic ABORTED
  # with no push — the first real tag was main-000002): phase 70
  # ALIGNS it with the highest main-* tag that EXISTS in the registry
  # before the first deploy. After that, the Image Updater governs the
  # image via its write-back (default target
  # .argocd-source-hello-aegis.yaml — verified #13; this newTag is not
  # rewritten). The alignment commit touches ONLY k8s/** → the
  # Jenkinsfile's anti-loop skips it.
  - name: registry.registry-system.svc.cluster.local:5000/hello-aegis
    newTag: main-000001
