apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-aegis
  labels: {app: hello-aegis}
spec:
  replicas: 1
  # P2.12 in-VM report #14: with 1 replica the default rolling update
  # (maxUnavailable 25% → 1) leaves ~30s of Bad Gateway on every update.
  # Surge first, kill after = zero window; the transient extra pod fits
  # into org-canary's RQ with room to spare:
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: hello-aegis}
  template:
    metadata:
      labels: {app: hello-aegis}
    spec:
      # Pattern A: the pull secret comes from the ns's default SA
      # (org-canary) — the app does NOT declare the credential.
      # PSS: org-canary is enforce=restricted (run #12, 2nd obstacle of
      # phase 70) — the workload DECLARES the whole profile (there is no
      # mutate policy injecting it; explicit > magic).
      # The image already runs as USER 65532 (Containerfile) →
      # runAsNonRoot validates with no duplicated runAsUser here:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          # the TAG is governed by the overlay (kustomize images) and
          # updated by the Image Updater via write-back:
          image: registry.registry-system.svc.cluster.local:5000/hello-aegis:seed
          ports: [{containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: hello-aegis
spec:
  selector: {app: hello-aegis}
  ports: [{port: 80, targetPort: 8080}]
