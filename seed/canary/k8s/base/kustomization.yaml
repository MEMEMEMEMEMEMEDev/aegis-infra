apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# NO ingressroute.yaml, and it is not an oversight (#54).
#
# The canary's route is now placed by the PLATFORM, in
# k8s/organizations/org-canary/routes.yaml. This repo can no longer
# write it: IngressRoute is in the namespaceResourceBlacklist of
# aegis-tenant-canary.
#
# The reason: an AppProject filters by *kind* and never by the value of
# a field, so there is no way to say "IngressRoutes yes, but only with
# YOUR Host". As long as a tenant could create one, it could claim the
# neighbor's hostname — measured on 2026-08-06 against the instance, and
# the thief won. The only way to bound it by kind is for the kind to
# belong to nobody on this side.
#
# The canary gets the same treatment as everybody else ON PURPOSE. It is
# the proof that the tenant's path works; if it were exempted from the
# controls, it would stop testing the path they really walk.
resources:
  - deployment.yaml
