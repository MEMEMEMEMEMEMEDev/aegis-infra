# The `server{}` this front is served by. It REPLACES the sample the
# base ships, and it must keep `listen 8080`: a tenant's NetworkPolicy
# admits edge -> 8080 only, so a server on any other port starts fine
# and never receives a request.
#
# `listen 80` is not an option either: binding a port below 1024 as uid
# 101 fails at startup.
server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # THE FALLBACK IS FOR A SINGLE-PAGE APP (React, Vue, Angular): a
    # deep link like /orders/7 is a route the browser resolves, not a
    # file, so nginx has to hand back index.html instead of a 404.
    # For a MULTI-PAGE build (Astro, and any generator that emits one
    # .html per route) delete the `/index.html` and leave `=404`:
    # otherwise a real typo answers 200 with the home page, and both
    # the visitor and the uptime probe are told a lie.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The health endpoint the readinessProbe polls. It is a location and
    # not a file so that it keeps answering 200 even while the site
    # itself is being replaced.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
