apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# NO IngressRoute, and it is not an oversight: the public route is
# derived by the PLATFORM from the contract (orgs/__ORG__.yaml) and this
# repo could not write it even if it wanted to — the kind is in the
# AppProject's namespaceResourceBlacklist. As long as a tenant could
# create one, it could claim the neighbor's hostname.
resources:
  - deployment.yaml
