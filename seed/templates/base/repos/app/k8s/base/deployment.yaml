apiVersion: apps/v1
kind: Deployment
metadata:
  # Convención de la plataforma: el servicio `app` del contrato se
  # nombra `<organizacion>-app`. La NetworkPolicy generada selecciona
  # por la etiqueta `app: __ORG__-app` y la IngressRoute derivada busca
  # el Service `__ORG__-app` en el 8080 — estos nombres NO son libres.
  name: __ORG__-app
  labels: {app: __ORG__-app}
spec:
  replicas: 1
  # Con 1 réplica el rolling default (maxUnavailable 25% → 1) deja ~30s
  # de Bad Gateway en cada update. Surge primero, matar después = cero
  # ventana; el pod extra transitorio entra en la cuota `pequena`.
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: __ORG__-app}
  template:
    metadata:
      labels: {app: __ORG__-app}
    spec:
      # El pull secret lo aporta el SA default del namespace: la app NO
      # declara la credencial del registry.
      # PSS: el namespace es enforce=restricted — el workload DECLARA el
      # perfil completo (explícito > mágico). La imagen ya corre USER
      # 65532 (Containerfile) → runAsNonRoot valida sin runAsUser acá.
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          # La IMAGEN la gobierna el overlay (kustomize images) y el
          # pipeline le escribe el DIGEST en cada build. Esta referencia
          # es solo la base que el overlay reescribe.
          image: registry.registry-system.svc.cluster.local:5000/__ORG__-app
          ports: [{containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: __ORG__-app
spec:
  selector: {app: __ORG__-app}
  # La plataforma rutea SIEMPRE al puerto 8080 del Service (convención
  # de la IngressRoute derivada): este puerto no se cambia acá, se
  # cambia en el contrato… y hoy el contrato tampoco lo cambia.
  ports: [{port: 8080, targetPort: 8080}]
