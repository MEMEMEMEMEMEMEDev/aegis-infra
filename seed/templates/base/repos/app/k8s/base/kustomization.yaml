apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# SIN IngressRoute, y no es un olvido: la ruta pública la deriva la
# PLATAFORMA del contrato (orgs/<organizacion>.yaml) y este repo no
# puede escribirla aunque quiera — el kind está en el
# namespaceResourceBlacklist del AppProject. Mientras un inquilino
# pudiera crear una, podía reclamar el hostname del vecino.
resources:
  - deployment.yaml
