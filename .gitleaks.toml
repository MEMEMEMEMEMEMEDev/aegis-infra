# gitleaks configuration: the default rules, plus the allowlist this
# repository can justify line by line. An entry here is a reason, not a
# silence: every one names what the match is and why it is not a secret.
[extend]
useDefault = true

[allowlist]
description = "what looks like a secret and is not, with the reason"
paths = [
  # the checks fabricate their fixtures at run time; what is committed is
  # the shape of a token, never one (check 151)
  '''verify/checks/.*''',
  '''verify/teeth/.*''',
  # the seed carries __PLACEHOLDERS__ the init renders, and sample
  # values the instance replaces
  '''seed/platform/.*\.tpl''',
]
regexes = [
  # the age PUBLIC key of a sample: public by definition
  '''age1[0-9a-z]{58}''',
]
