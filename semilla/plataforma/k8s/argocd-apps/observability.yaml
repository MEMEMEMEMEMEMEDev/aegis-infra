# DOS releases del mismo chart victoria-logs-single, y es EL punto
# (design.md §4.1): la retención OSS es global por instancia — vlogs
# corta (logs de pods), vlogs-eventos 1y (auditoría supply-chain).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vlogs
  namespace: argocd
  labels: {aegis.dev/part-of: aegis-platform}
spec:
