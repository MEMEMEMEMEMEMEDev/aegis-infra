# Apps de observabilidad (fase 85; multi-doc por área — mismo
# contrato que core.yaml): ServerSideApply=true; selfHeal=true;
# prune OMITIDO (A19); labels aegis.dev/* (A18); placeholders
# __GH_OWNER__/__PLATFORM_REPO__ (fase 10). El ORDEN de habilitación
# lo da la fase 85: observability-base primero (namespace + secretos
# + crudos), luego stores (vmsingle, vlogs, vlogs-eventos), luego
# colectores (vmagent, vector), luego vmalert, último grafana —
# productores antes que consumidores (D5).
#
# Versiones de charts: pinneadas EXACTAS (precedente
# cilium_chart_version), verificadas 2026-08-19 contra el index.yaml
# de cada repo Helm (la última estable publicada ese día).
---
# observability-base ANTES que todo (patrón argocd-secrets/ADR-0015):
# el namespace, los Secrets KSOPS, los crudos (ntfy, alertmanager,
# puente, blackbox), las reglas, los dashboards, la exposición y el
# CronJob trivy-db-age (que lleva namespace trivy-system EXPLÍCITO —
# el project aegis-platform permite '*').
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-base
  namespace: argocd
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  project: aegis-platform
  source:
    repoURL: git@github.com:__GH_OWNER__/__PLATFORM_REPO__.git
    targetRevision: main
    path: k8s/base/observability
  destination: {server: https://kubernetes.default.svc, namespace: observability}
  syncPolicy:
    automated: {selfHeal: true}
    syncOptions: [ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vmsingle
  namespace: argocd
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  project: aegis-platform
  sources:
    - repoURL: https://victoriametrics.github.io/helm-charts
      chart: victoria-metrics-single
      targetRevision: 0.45.0
      helm:
        releaseName: vmsingle
        valueFiles: [$values/k8s/base/observability/vmsingle/values.yaml]
    - repoURL: git@github.com:__GH_OWNER__/__PLATFORM_REPO__.git
      targetRevision: main
      ref: values
  destination: {server: https://kubernetes.default.svc, namespace: observability}
  syncPolicy:
    automated: {selfHeal: true}
    syncOptions: [ServerSideApply=true]
