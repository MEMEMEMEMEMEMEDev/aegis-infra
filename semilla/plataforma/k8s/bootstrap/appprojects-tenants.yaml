# ╔══════════════════════════════════════════════════════════════════╗
# ║  GENERADO POR `aegis org` — NO EDITAR A MANO                     ║
# ╚══════════════════════════════════════════════════════════════════╝
# Un AppProject por CONTRATO que declara repo. Se rederiva ENTERO en
# cada `bin/aegis-org aplicar`, así que lo que se escriba a mano acá
# desaparece en la corrida siguiente, en silencio.
#
# VACÍO EN LA SEMILLA, y es la forma correcta: una instancia recién
# arrancada no tiene ninguna organización todavía. El archivo existe
# igual porque la fase 35 lo aplica, y un archivo ausente ahí es un
# error de arranque; uno sin documentos es un estado legítimo, y la
# fase lo distingue con `yaml_has_docs` (init/lib/common.sh).
#
# Los proyectos del sustrato (aegis-bootstrap, aegis-platform) y los
# que no salen de un contrato (aegis-tenant-canary) viven a mano en
# appprojects.yaml, al lado. Mezclarlos acá haría que la próxima
# corrida los borrara.
#
# ESTOS NO LOS GESTIONA NINGUNA App, a propósito (W-06 / R1 camino B).
# Se aplican por kubectl antes que root: (a) evita la carrera
# AppProject-vs-Application dentro de un mismo sync, y (b) cierra el
# vector de escalar privilegios por una App que edite proyectos. Por
# eso viven fuera de k8s/argocd-apps/, que es el path del App-of-Apps.
#
# Lo que el generador emite para cada organización, y por qué importa:
#
#   sourceRepos                 enumerados, jamás '*'
#   clusterResourceWhitelist    vacío — escribir en el repo de una app
#                               ya no da acceso al cluster entero
#   namespaceResourceBlacklist  ResourceQuota, LimitRange, Role,
#                               RoleBinding e IngressRoute. Los cuatro
#                               primeros protegen a la organización de
#                               sí misma; el quinto protege a LAS DEMÁS
#                               de ella (#54 — un AppProject filtra por
#                               kind y nunca por el valor de un campo,
#                               así que "IngressRoutes sí, pero solo con
#                               TU Host" no se puede expresar: la única
#                               forma de acotarlo es que el kind no le
#                               pertenezca)
#   orphanedResources warn      avisa de lo que sobra sin borrarlo
#                               (A19 / #31)
#
# UN AppProject POR ORGANIZACIÓN, nunca uno compartido con varios
# destinos: con un solo proyecto que liste tres namespaces, una app de
# una organización podría desplegarse en el namespace de otra cambiando
# una línea de su propio repo. El proyecto ES la frontera, y una
# frontera con tres puertas abiertas no es una frontera.
