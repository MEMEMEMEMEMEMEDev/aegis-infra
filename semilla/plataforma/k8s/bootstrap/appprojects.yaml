# AppProjects v2 — W-06 / R1 camino B (escribir en el repo de una app
# ya no da acceso cluster-scoped). Se aplican por kubectl en la fase 35
# ANTES de root (clase C1: el proyecto existe antes de que cualquier
# Application lo referencie). NO los gestiona ninguna App: son infra de
# bootstrap (como los Secrets D2). Eso evita (a) la carrera
# AppProject-vs-Application dentro de un mismo sync, y (b) el vector de
# escalar privilegios por una App que edite proyectos. Por eso viven
# fuera de k8s/argocd-apps/ (el path del App-of-Apps).
#
# ── QUÉ QUEDÓ ACÁ Y QUÉ SE FUE (2026-08-05, #19) ──────────────────
#
# Los proyectos de las organizaciones CON CONTRATO ahora los deriva
# `bin/aegis-org` en appprojects-tenants.yaml, al lado. Este archivo
# guarda solo lo que no sale de ningún contrato:
#
#   aegis-bootstrap, aegis-platform  el sustrato. No pertenecen a
#                                    ninguna organización.
#   aegis-tenant-canary              el canary es de la PLATAFORMA:
#                                    prueba que el camino del tenant
#                                    funciona, así que no puede
#                                    depender de ese camino.
#
# Una instancia con historia puede tener acá, además, organizaciones
# ANTERIORES al generador —sin contrato del que derivarlas—. Eso es
# deuda de esa instancia y no viaja en la semilla: acá arranca solo el
# sustrato más el canary.
#
# Por qué se derivó: repetir el bloque a mano DERIVA, y se pagó. El
# 2026-08-05 se midió en el cluster que aegis-tenant-canary era el
# único de los cuatro proyectos de tenant SIN `orphanedResources`
# —quedó afuera cuando #31 lo agregó a los otros tres— así que la app
# del canary no se evaluaba nunca y `aegis check` la contaba
# dentro de "nada huérfano". Un bloque copiado tres veces se actualiza
# dos. Se corrigió abajo, y de los derivados ya no puede volver a
# pasar: son idénticos por construcción y no por disciplina.
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: aegis-bootstrap
  namespace: argocd
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  description: root App-of-Apps — solo crea Applications de plataforma
  sourceRepos:
    - git@github.com:__GH_OWNER__/__PLATFORM_REPO__.git
  destinations:
    - {server: https://kubernetes.default.svc, namespace: argocd}
  # root solo aplica Applications (namespaced) en argocd:
  namespaceResourceWhitelist:
    - {group: argoproj.io, kind: Application}
  clusterResourceWhitelist: []          # nada cluster-scoped
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: aegis-platform
  namespace: argocd
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  description: plano de plataforma — charts pinneados + manifests del repo de plataforma
  # solo el repo de plataforma y los chart repos que las Apps usan
  # (enumerados, NO '*'). Deben matchear repoURL exacto de core.yaml /
  # ci-supply-tenants.yaml / observability.yaml:
  sourceRepos:
    - git@github.com:__GH_OWNER__/__PLATFORM_REPO__.git
    - https://argoproj.github.io/argo-helm
    - quay.io/jetstack/charts
    - https://traefik.github.io/charts
    - https://charts.jenkins.io
    - https://aquasecurity.github.io/helm-charts
    - https://kyverno.github.io/kyverno
    # observabilidad (fase 85 — observability.yaml):
    - https://victoriametrics.github.io/helm-charts
    - https://helm.vector.dev
    - https://grafana.github.io/helm-charts
  # namespace '*' (este cluster): los charts crean RBAC en namespaces que
  # NO son el suyo — cert-manager pone su leaderelection Role/RoleBinding
  # en kube-system (corrida v1: "namespace kube-system is not permitted").
  # Enumerar namespaces = whack-a-mole (cada corrida descubre otro). El
  # proyecto de plataforma es TRUSTED; la restricción real es sourceRepos
  # (solo el repo de plataforma + charts conocidos). El LÍMITE de
  # seguridad es el proyecto aegis-tenant-canary (org-canary, cluster-scoped []).
  destinations:
    - {server: https://kubernetes.default.svc, namespace: '*'}
  # cluster-scoped '*': los charts de plataforma instalan CRDs, RBAC
  # cluster, webhooks, ClusterIssuer/ClusterPolicy, IngressClass, etc.
  # Enumerar = whack-a-mole (cada corrida descubre un kind más → otra
  # corrida completa). La plataforma es TRUSTED; su límite REAL es
  # sourceRepos (solo el repo de plataforma + charts conocidos). El
  # límite de seguridad es aegis-tenant-canary (org-canary, cluster-scoped []).
  clusterResourceWhitelist:
    - {group: '*', kind: '*'}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: aegis-tenant-canary
  namespace: argocd
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  description: el canary de la plataforma — SOLO su repo, SOLO org-canary, CERO cluster-scoped (R1 camino B)
  sourceRepos:
    - git@github.com:__GH_OWNER__/__APP_REPO__.git
  destinations:
    - {server: https://kubernetes.default.svc, namespace: org-canary}
  clusterResourceWhitelist: []          # deny-all cluster-scoped (EL fix de R1-B)
  # y dentro de su namespace, que no se auto-escale ni cambie sus
  # propios límites (esos los pone la plataforma, App org-canary):
  namespaceResourceBlacklist:
    - {group: "", kind: ResourceQuota}
    - {group: "", kind: LimitRange}
    - {group: rbac.authorization.k8s.io, kind: Role}
    - {group: rbac.authorization.k8s.io, kind: RoleBinding}
    # Y NO puede escribir su propio ruteo (#54). Los de arriba protegen
    # a la organización de sí misma; éste protege a LAS DEMÁS de ella.
    #
    # Un AppProject filtra por *kind* y jamás por el valor de un campo,
    # así que no hay forma de decir "IngressRoutes sí, pero solo con TU
    # Host". MEDIDO el 2026-08-06: dos organizaciones reclamaron el
    # mismo hostname, las dos admitidas sin una queja, y traefik sirvió
    # la del segundo. El dueño legítimo no tenía defensa ni aviso.
    #
    # La ruta la pone la plataforma (k8s/organizations/org-*/ruteo.yaml).
    - {group: traefik.io, kind: IngressRoute}
  # AGREGADO el 2026-08-05. Faltaba desde #31: los otros tres proyectos
  # de tenant lo tenían y este no, así que la app `hello-aegis` no se
  # evaluaba y el chequeo la contaba como limpia. El canary es
  # justamente donde MÁS importa —es lo que se rompe a propósito para
  # probar que la plataforma avisa— y era el único punto ciego.
  orphanedResources:
    warn: true
    ignore:
      # Lo crea el kube-controller-manager en CADA namespace, no sale de
      # ningún git y nunca va a salir. Sin esta excepción el aviso
      # aparecería para siempre, y un aviso permanente apaga la señal
      # igual que una ausencia — que es la Enfermedad E y la razón de
      # que este mecanismo exista.
      - group: ""
        kind: ConfigMap
        name: kube-root-ca.crt
---
# LA INFRAESTRUCTURA DE LAS ORGANIZACIONES (#47, 2026-08-05).
#
# Las Apps `org-*` despliegan el sustrato de cada organización —el
# namespace, la cuota, las NetworkPolicies, los Secrets, la base— desde
# el repo de PLATAFORMA. No son apps de tenant (esas vienen del repo de
# la organización y viven en su `aegis-tenant-<org>`), pero tampoco son
# plataforma: son un tercer tipo, y hasta hoy no tenían dónde.
#
# Estaban en `aegis-platform`, y eso costaba dos cosas:
#
# 1. NO SE LES BUSCABAN HUÉRFANOS. `aegis-platform` no tiene
#    `orphanedResources`, así que sus Apps no producen nunca esa
#    condición. Medido el 2026-08-05: de 28 Applications se evaluaban
#    3. Las 25 restantes —incluidas estas cinco, que son las que
#    despliegan las NetworkPolicies del incidente que motivó #31—
#    salían en verde sin que nadie las hubiera mirado.
#
# 2. HEREDABAN cluster-scoped '*'. Una App de organización podía crear
#    un ClusterRoleBinding en cualquier lado. Lo único cluster-scoped
#    que despliegan de verdad es su Namespace — enumerado abajo.
#
# POR QUÉ NO SE ARREGLÓ AGREGÁNDOLE orphanedResources A aegis-platform,
# que era lo obvio: se midió. Activarlo produce ~146 avisos permanentes
# —81 solos de la App `gpu`, cuyo namespace destino es kube-system, más
# los Secrets que generan cert-manager y el propio ArgoCD— y ninguno es
# un huérfano real: son recursos que nunca salieron de git y nunca van a
# salir. Un aviso permanente apaga la señal igual que una ausencia, que
# es la Enfermedad E y la razón de que este mecanismo exista.
#
# Las cinco `org-*` reportaron CERO en esa misma medición. Por eso
# cubrirlas acá no cuesta ruido y da cobertura donde importa.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: aegis-organizaciones
  namespace: argocd
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  description: el sustrato de cada organización — namespace, cuota, red y secretos, desde el repo de plataforma
  # Solo el repo de plataforma. Estas Apps NO despliegan código de
  # nadie: el código de una organización viene de su propio repo y usa
  # su propio proyecto.
  sourceRepos:
    - git@github.com:__GH_OWNER__/__PLATFORM_REPO__.git
  destinations:
    # El namespace de cada organización, por patrón: dar de alta una
    # organización no debe requerir editar esto. La alternativa
    # —enumerar— es un lugar más donde acordarse, que es exactamente lo
    # que #19 vino a sacar.
    - {server: https://kubernetes.default.svc, namespace: 'org-*'}
    # Y argocd, porque el bundle de una organización incluye las
    # Applications de sus repos, que son objetos del namespace de
    # ArgoCD. Es la única razón, y está acotada por sourceRepos.
    - {server: https://kubernetes.default.svc, namespace: argocd}
  # ENUMERADO, no '*'. Se midió qué despliegan de verdad estas cinco
  # Apps: 5 Namespaces y nada más cluster-scoped. Si mañana el
  # generador emite otro kind cluster-scoped, el sync falla diciendo
  # "not permitted" —un error claro y en el momento— en vez de
  # concederlo en silencio para siempre.
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
  # AVISAR de lo que sobra, sin borrarlo (A19 / #31).
  orphanedResources:
    warn: true
    ignore:
      # Lo crea el kube-controller-manager en CADA namespace, no sale de
      # ningún git y nunca va a salir.
      - group: ""
        kind: ConfigMap
        name: kube-root-ca.crt
