# values grafana 10.5.15 — el visor, provisionado 100% DESDE GIT
# (design.md §4.1): datasources por provisioning, dashboards por
# sidecar leyendo ConfigMaps del repo. NADA a click.
fullnameOverride: grafana       # Service = `grafana` :80

# SIN persistence, y es LA decisión (design.md §4.1): un dashboard
# clickeado sería un huérfano invisible — no está en git, no lo
# evalúa ArgoCD, muere con el pod. Sin PVC no hay dónde acumular
# estado-a-click: la restricción como mecanismo, no como regla de
# conducta.
persistence:
  enabled: false

admin:
  existingSecret: grafana-admin  # KSOPS (lo cifra la fase 85; keys
  # admin-user/admin-password — el default del chart). Grafana queda
  # tras Access PERO conserva su login: Access es la puerta, no la
  # única cerradura (fase-85 §3).

# el datasource de VictoriaLogs es un plugin de Grafana; se baja al
# arrancar el pod (egress a grafana.com — mismo trato que los
# installPlugins de Jenkins). verificado 2026-08-19 contra
# grafana.com/api/plugins: victoriametrics-logs-datasource, activo:
plugins:
  - victoriametrics-logs-datasource

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        uid: vmsingle
        type: prometheus
        access: proxy
        url: http://vmsingle.observability.svc:8428
        isDefault: true
      - name: VictoriaLogs
        uid: vlogs
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://vlogs.observability.svc:9428
      - name: VictoriaLogs eventos
        uid: vlogs-eventos
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://vlogs-eventos.observability.svc:9428

sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard    # los 4 ConfigMaps de dashboards/
    searchNamespace: observability
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 100m, memory: 128Mi}

testFramework:
  enabled: false                # sin pod de test: superficie sin uso

grafana.ini:
  server:
    root_url: https://grafana.__ROOT_DOMAIN__
  analytics:
    reporting_enabled: false
    check_for_updates: false

resources:                      # fase-85 §10
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 500m, memory: 512Mi}
