# values victoria-metrics-agent 0.46.0 — EL scraper (fase-85 §2:
# vmsingle puede scrapear solo, pero vmagent da relabeling y buffer
# en disco ante cortes — la red de dev se cae POR DISEÑO y perder el
# buffer sería perder exactamente las muestras del incidente).
#
# scrape_configs ENUMERADOS (A7-espíritu): target nuevo = entry
# nueva acá, no magia. Los jobs con kubernetes_sd van ACOTADOS a un
# namespace + label + puerto concretos — descubren réplicas del
# componente NOMBRADO, jamás «todo lo que tenga una annotation».
# Sobrescribir `config.scrape_configs` REEMPLAZA la lista default
# del chart (los jobs genéricos por annotation quedan fuera a
# propósito).
fullnameOverride: vmagent

# SIN esto, una sonda nueva NO SE RASPA. vmagent lee su config una vez
# al arrancar; el kubelet refresca el ConfigMap montado en ~1 min, pero
# vmagent no vuelve a mirarlo. O sea: aegis-org deriva el target,
# ArgoCD dice «Synced», el archivo ESTÁ en el pod, y nadie lo raspa —
# vigilancia que se cree desplegada y no lo está.
# Es el MISMO vicio que tenía vmalert (arreglado el mismo día): en este
# stack la recarga en caliente hay que pedirla, no viene.
extraArgs:
  promscrape.configCheckInterval: "60s"

remoteWrite:
  - url: http://vmsingle.observability.svc:8428/api/v1/write

# el buffer en disco que justifica a vmagent (ver arriba):
persistentVolume:
  enabled: true
  size: 1Gi

# Recreate y NO RollingUpdate, y no es preferencia: el buffer de arriba
# es un PVC ReadWriteOnce, y vmagent toma un lock exclusivo sobre él.
# Con RollingUpdate el pod nuevo arranca ANTES de que el viejo muera,
# no consigue el lock y entra en CrashLoopBackOff para siempre: vmagent
# quedaba imposible de reiniciar, y cualquier cambio de su config se
# trababa sin que nada lo dijera. Medido el 2026-08-22 al agregar la
# recarga en caliente: «cannot acquire lock on file .../flock.lock».
# El precio es unos segundos sin raspar, que el propio buffer cubre.
# La clave es deployment.spec.strategy y no `strategy` ni
# `updateStrategy` (esa última es la del StatefulSet): verificado con
# `helm show values victoria-metrics-agent --version 0.46.0`. Escrita
# mal, el chart la ignora en silencio y el Deployment se queda en
# RollingUpdate sin que ArgoCD note nada — dice Synced igual.
deployment:
  spec:
    strategy:
      type: Recreate

rbac:
  # el chart ya da nodes/nodes-metrics/pods/services; el job de
  # cadvisor pasa por el PROXY del API server (TLS validado contra el
  # CA del cluster — jamás insecure_skip_verify, la doctrina anti -k)
  # y eso pide nodes/proxy:
  extraRules:
    - apiGroups: [""]
      resources: [nodes/proxy]
      verbs: [get, list, watch]

config:
  global:
    scrape_interval: 30s
    external_labels:
      # identidad del dato, no comportamiento (design.md §4.3): un
      # dashboard puede distinguir «sin dato» de «cero» según la
      # semántica del perfil:
      aegis_profile: greenfield
  scrape_configs:
    # ── el stack se mide a sí mismo (Services propios, estáticos) ──
    - job_name: vmagent
      static_configs:
        - targets: [localhost:8429]
    - job_name: observability-stack
      static_configs:
        - targets:
            - vmsingle.observability.svc:8428
            - vlogs.observability.svc:9428
            - vlogs-eventos.observability.svc:9428
            - vmalert.observability.svc:8880
            - alertmanager.observability.svc:9093
            - blackbox.observability.svc:9115
            - ntfy.observability.svc:9090
            - vector.observability.svc:9598
    # ── cAdvisor del kubelet via API-server proxy (design.md §4.5:
    #    CPU/mem por contenedor sin node-exporter/kube-state-metrics;
    #    el proxy valida TLS contra el CA del cluster, a diferencia
    #    del scrape directo al kubelet que exigiría skip_verify) ──
    - job_name: kubernetes-nodes-cadvisor
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      kubernetes_sd_configs:
        - role: node
      honor_timestamps: false
      relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
        - target_label: __address__
          replacement: kubernetes.default.svc:443
        - source_labels: [__meta_kubernetes_node_name]
          regex: (.+)
          target_label: __metrics_path__
          replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
    # ── los observados (hooks.md, un job por componente) ──────────
    # ArgoCD: /metrics nativos (controller :8082, server :8083,
    # repo-server :8084 — puertos de contenedor llamados así en el
    # chart argo-cd; pide la entry en la netpol de argocd, fase-85 §7):
    - job_name: argocd
      kubernetes_sd_configs:
        - role: pod
          namespaces: {names: [argocd]}
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_part_of]
          regex: argocd
          action: keep
        - source_labels: [__meta_kubernetes_pod_container_port_number]
          regex: "8082|8083|8084"
          action: keep
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
    # cert-manager :9402 — como CONTEXTO de B11 (la alerta sale del
    # blackbox, no de acá — design.md §4.2b):
    - job_name: cert-manager
      kubernetes_sd_configs:
        - role: pod
          namespaces: {names: [cert-manager]}
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_container_port_number]
          regex: "9402"
          action: keep
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
    # Kyverno :8000 (admisiones y latencia del webhook):
    - job_name: kyverno
      kubernetes_sd_configs:
        - role: pod
          namespaces: {names: [kyverno]}
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_part_of]
          regex: kyverno
          action: keep
        - source_labels: [__meta_kubernetes_pod_container_port_number]
          regex: "8000"
          action: keep
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
    # Traefik: entrypoint metrics :9100 (prometheus viene activo por
    # default en el chart 40.3.0 — verificado 2026-08-19 contra sus
    # values: metrics.prometheus.entryPoint=metrics, ports.metrics
    # 9100; el puerto no está en el Service, por eso pod-SD):
    - job_name: traefik
      kubernetes_sd_configs:
        - role: pod
          namespaces: {names: [infra-edge]}
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          regex: traefik
          action: keep
        - source_labels: [__meta_kubernetes_pod_container_port_number]
          regex: "9100"
          action: keep
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
    # cloudflared :2000 (el flag --metrics + containerPort los agrega
    # la fase 85 al Deployment — hooks.md, 2 líneas):
    - job_name: cloudflared
      kubernetes_sd_configs:
        - role: pod
          namespaces: {names: [infra-edge]}
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          regex: cloudflared
          action: keep
        - source_labels: [__meta_kubernetes_pod_container_port_number]
          regex: "2000"
          action: keep
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
    # Jenkins: plugin `prometheus` (/prometheus sin API key —
    # hooks.md; la línea en installPlugins la agrega la fase 85):
    - job_name: jenkins
      metrics_path: /prometheus
      static_configs:
        - targets: [jenkins.jenkins-system.svc:8080]
    # registry: debug.prometheus :5001 (el bloque en el ConfigMap y
    # el puerto en el Service los agrega la fase 85 — hooks.md):
    - job_name: registry
      static_configs:
        - targets: [registry.registry-system.svc:5001]
    # ── sondas blackbox (lo SERVIDO, no lo declarado) ─────────────
    # B11: de acá sale probe_ssl_earliest_cert_expiry — handshake
    # real contra el CA (módulo registry_tls, blackbox.yaml). El
    # relabel deja `instance` = host:puerto para que la regla y el
    # gate (instance=~"registry.*") lean el destino, no la URL:
    - job_name: blackbox-registry
      metrics_path: /probe
      params: {module: [registry_tls]}
      static_configs:
        - targets: ["https://registry.registry-system.svc:5000/v2/"]
      relabel_configs:
        - source_labels: [__address__]
          target_label: __param_target
        - source_labels: [__param_target]
          regex: "https?://([^/]+).*"
          target_label: instance
          replacement: "$1"
        - target_label: __address__
          replacement: blackbox.observability.svc:9115
    # el /healthz de trivy (pide la entry :4954 en la netpol de
    # trivy-system — fase-85 §7):
    - job_name: blackbox-trivy
      metrics_path: /probe
      params: {module: [http_2xx]}
      static_configs:
        - targets: ["http://trivy.trivy-system.svc:4954/healthz"]
      relabel_configs:
        - source_labels: [__address__]
          target_label: __param_target
        - source_labels: [__param_target]
          regex: "https?://([^/]+).*"
          target_label: instance
          replacement: "$1"
        - target_label: __address__
          replacement: blackbox.observability.svc:9115
    # --- DERIVADO por aegis-org (sondas de tenant): no editar a mano ---
    # --- FIN DERIVADO ---

resources:                      # fase-85 §10
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 500m, memory: 256Mi}
