# ntfy v2.27.0 (multi-doc, crudo — precedente registry.yaml: un
# contenedor + un ConfigMap no amortizan un chart). El canal de «la
# plataforma está rota» AUTOHOSPEDADO (design.md §4.1): no puede
# depender de un SaaS gratuito con topics adivinables.
#
# ntfy va SIN Access (la app del teléfono no puede presentar service
# token) — la cerradura es la auth PROPIA: deny-all + ACL (fase-85
# §3/§5). La provisión de usuarios es DECLARATIVA por config:
# verificado 2026-08-19 contra server/server.yml del tag v2.27.0
# (auth-users/auth-access existen desde antes de esa versión), así
# que NO hay `kubectl exec ntfy user add` imperativo.
#
# Los DOS hashes bcrypt de auth-users son de clase-generado (dueño:
# fase 85, via inject_placeholder — los genera `ntfy user hash` /
# htpasswd -B con las credenciales gen_or_restore del store). Un hash
# bcrypt no es material reversible: mismo criterio que el htpasswd
# del registry, pero acá el formato de ntfy lo pide en el config.
# La credencial del puente EN CLARO solo vive en el Secret
# ntfy-puente-token (ntfy-puente.yaml); la del operador solo en el
# store + su teléfono (fase-85 §3: nadie en el cluster la consume).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-config
  namespace: observability
  labels: {aegis.dev/part-of: aegis-platform}
data:
  server.yml: |
    base-url: "https://ntfy.__ROOT_DOMAIN__"
    listen-http: ":8080"
    behind-proxy: true            # traefik/cloudflared delante: rate
                                  # limits por visitante real, no por
                                  # la IP del edge
    cache-file: "/var/lib/ntfy/cache.db"
    auth-file: "/var/lib/ntfy/auth.db"
    # DENY-ALL: un ntfy abierto sería spam-relay con nuestro dominio
    # (gate obs-ntfy-publico-responde: publicar sin credencial = 403):
    auth-default-access: "deny-all"
    auth-users:
      - "operador:__OBS_NTFY_OPERADOR_HASH__:user"
      - "puente:__OBS_NTFY_PUENTE_HASH__:user"
    auth-access:
      - "operador:aegis-alertas:read-only"
      - "puente:aegis-alertas:write-only"
    # métricas en listener DEDICADO: jamás en el puerto público (el
    # Service las expone solo a ClusterIP; la IngressRoute rutea al 80):
    metrics-listen-http: ":9090"
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy
  namespace: observability
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  selector: {app.kubernetes.io/name: ntfy}
  ports:
    - {name: http, port: 80, targetPort: 8080}
    - {name: metrics, port: 9090, targetPort: 9090}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: observability
  labels: {aegis.dev/part-of: aegis-platform}
spec:
  replicas: 1
  strategy: {type: Recreate}    # PVC RWO
  selector:
    matchLabels: {app.kubernetes.io/name: ntfy}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ntfy}
    spec:
      containers:
        - name: ntfy
          # verificado 2026-08-19 contra github.com/binwiederhier/ntfy
          # releases (v2.27.0, 2026-08-04) y el tag en Docker Hub:
          image: binwiederhier/ntfy:v2.27.0
          args: ["serve"]        # lee /etc/ntfy/server.yml (default)
          ports:
            - {name: http, containerPort: 8080}
            - {name: metrics, containerPort: 9090}
          volumeMounts:
            - {name: config, mountPath: /etc/ntfy, readOnly: true}
            - {name: data, mountPath: /var/lib/ntfy}
          readinessProbe:
            httpGet: {path: /v1/health, port: 8080}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /v1/health, port: 8080}
            initialDelaySeconds: 15
          resources:            # fase-85 §10
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
      volumes:
        - name: config
          configMap: {name: ntfy-config}
        - name: data
          persistentVolumeClaim: {claimName: ntfy-data}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ntfy-data
  namespace: observability
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
