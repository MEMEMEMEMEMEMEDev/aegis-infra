# A7: LISTA EXPLÍCITA. Los .enc.yaml los produce el init:
#   fase 15: hello-aegis-repo (RO), github-token (D11), webhook-hmac
#   fase 40: regcred-internal
#   fase 50: jenkins-admin
#   fase 80: cosign-signing-key
# NOTA bootstrap (DECISIÓN E10): el file de cosign NO está en esta
# lista de fábrica — un entry sin archivo rompe el build de kustomize
# (A7) y jenkins-secrets debe sincronizar en fase 50. La fase 80
# agrega la línea `secret-cosign-signing-key.enc.yaml` junto con el
# .enc.yaml, en el MISMO commit (sincronía atómica).
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: jenkins-secrets
  annotations:
    config.kubernetes.io/function: |
      exec: {path: ksops}
files:
  - secret-jenkins-admin.enc.yaml
  - secret-hello-aegis-repo.enc.yaml
  - secret-regcred-internal.enc.yaml
  - secret-github-token.enc.yaml
  - secret-ops-stack-repo-ro.enc.yaml
  - secret-github-webhook-hmac.enc.yaml
  # Credenciales del BORDE, para el job edge-chequeo. Las produce la
  # fase 15 —el token recién acuñado y tres valores de la conf— así que
  # existen mucho antes de que esta App sincronice en la 50.
  #
  # Los cuatro estaban en la instancia viva y en NINGUNA fase: se
  # habían creado a mano con sops al armar el job del borde y nunca se
  # cablearon acá (#48). En un arranque con age key nueva quedaban
  # cifrados con una llave que ya no existe.
  #
  # El TOKEN es una credencial; los otros tres son identificadores, no
  # secretos. Van cifrados igual porque el mecanismo es uno solo: una
  # excepción "esto no hace falta cifrarlo" es una excepción que
  # después hay que recordar.
  - secret-cloudflare-api-token.enc.yaml
  - secret-cloudflare-account-id.enc.yaml
  - secret-cloudflare-zone-id.enc.yaml
  - secret-root-domain.enc.yaml
