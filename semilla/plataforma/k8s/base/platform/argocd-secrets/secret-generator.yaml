apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: argocd-secrets
  annotations:
    config.kubernetes.io/function: |
      exec: {path: ksops}
# REGLA TEMPORAL (corrida #4, bug que frenó la fase 35): esta App
# sincroniza en fase 35 — un entry cuyo .enc.yaml se genera en una
# fase POSTERIOR rompe el build ENTERO de kustomize (atómico) y
# NINGÚN secret de la App se crea, ni los que sí existen en el repo.
# Acá solo entries de fases ≤ 25 (commiteadas antes del primer read
# de ArgoCD); los posteriores los agrega SU fase productora en el
# MISMO commit que el archivo (patrón cosign):
#   secret-regcred-image-updater.enc.yaml → la agrega la fase 40.
files:
  - secret-ops-stack-repo.enc.yaml        # fase 15 (tmb aplicado
                                          # por pipe en fase 30 —
                                          # KSOPS lo ADOPTA después)
  - secret-github-webhook.enc.yaml        # fase 15 (HMAC — A27)
  - secret-hello-aegis-repo.enc.yaml      # fase 15 (WRITE key ⚠)
